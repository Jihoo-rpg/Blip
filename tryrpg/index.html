<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Try RPG — 잃어버린 왕국 : 천년의 봉인 (체험판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c14e;--gold2:#a8802a;--ink:#f4ecdc;--dim:#a99f8c;--panel:linear-gradient(180deg,rgba(30,24,50,.985),rgba(14,11,24,.99));}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at center,#1b1530 0%,#050409 75%);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;container-type:inline-size;font-size:1.72cqw;background:#000;overflow:hidden;box-shadow:0 0 0 1px #000,0 20px 80px #000}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hide{display:none!important}
.pnl{background:var(--panel);border:2px solid var(--gold2);border-radius:.7em;box-shadow:inset 0 0 0 1px rgba(242,193,78,.22),0 .4em 1.6em rgba(0,0,0,.6)}
.ttl{font-family:'Black Han Sans','Gowun Dodum',sans-serif;letter-spacing:.02em;font-weight:400}
.gold{color:var(--gold)}.dim{color:var(--dim)}.up{color:#7dff9a}.dn{color:#ff7b7b}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hstat{position:absolute;left:1.2%;top:1.8%;padding:.5em .8em .6em;width:16em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.6em}
#hname{color:var(--gold);font-size:1.02em}
#hgold{font-size:.85em;color:#ffe9a8}
.bar{position:relative;height:.95em;background:#1b1529;border:1px solid #000;border-radius:.5em;margin-top:.32em;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;transition:width .25s;border-radius:.5em}
.bar>i:after{content:'';position:absolute;left:0;right:0;top:0;height:40%;background:rgba(255,255,255,.22)}
.bar.hp>i{background:linear-gradient(90deg,#b8202a,#ff5d5d)}
.bar.mp>i{background:linear-gradient(90deg,#2440b0,#5da8ff)}
.bar.xp>i{background:linear-gradient(90deg,#b07d0b,#f2c14e)}
.bar>b{position:absolute;inset:0;font-size:.66em;font-weight:400;line-height:1.42em;text-align:center;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
#minibox{position:absolute;right:1.2%;top:1.8%;width:17%;text-align:center}
#mini{width:100%;border-radius:.5em;border:2px solid var(--gold2);background:#000c;display:block;image-rendering:pixelated}
#mapName{font-size:.78em;margin-top:.25em;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
#tracker{position:absolute;left:1.2%;top:19%;width:17em;font-size:.78em;padding:.5em .75em;line-height:1.5}
#tracker .q{margin-top:.15em}#tracker .q b{color:var(--gold);font-weight:400}
#tracker .ready{color:#7dff9a}
#mbtn{pointer-events:auto;position:absolute;right:1.2%;bottom:2.2%;padding:.35em .9em;font-size:.88em;cursor:pointer}
#mbtn:hover{filter:brightness(1.3)}
#hint{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);font-size:.78em;color:#fffc;text-shadow:0 1px 3px #000;white-space:nowrap}
/* banner & toast */
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;pointer-events:none;opacity:0;transition:opacity .7s}
#banner.on{opacity:1}
#bnT{font-size:2.8em;color:#fff;text-shadow:0 0 22px rgba(242,193,78,.9),0 3px 0 #000}
#bnS{font-size:1em;color:#f3e2b0;margin-top:.2em;text-shadow:0 2px 4px #000;letter-spacing:.2em}
#toast{position:absolute;left:50%;top:8%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.35em;align-items:center;pointer-events:none;z-index:8}
#toast .t{padding:.4em 1.1em;border-radius:2em;background:rgba(18,14,30,.94);border:1px solid var(--gold2);font-size:.9em;animation:tin 2.8s forwards;white-space:nowrap}
#toast .t.gold{border-color:var(--gold);color:#ffeaa0;box-shadow:0 0 14px rgba(242,193,78,.35)}
@keyframes tin{0%{opacity:0;transform:translateY(-.6em)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* dialog */
#dialog{position:absolute;left:4%;right:4%;bottom:3.5%;min-height:22%;padding:1.1em 1.4em .9em;cursor:pointer;z-index:6}
#dialog .who{position:absolute;top:-1.05em;left:1em;background:linear-gradient(#3a2a5e,#241a3c);border:2px solid var(--gold2);padding:.12em .9em;border-radius:.45em;color:var(--gold);font-size:1em}
#dialog .who:empty{display:none}
#dialog .txt{font-size:1.12em;line-height:1.65;white-space:pre-wrap;min-height:3.3em}
#dialog .nx{position:absolute;right:1em;bottom:.5em;color:var(--gold);animation:bob .9s infinite}
#dialog .choices{display:flex;flex-direction:column;gap:.15em;margin-top:.4em;max-width:22em}
#dialog .choices:empty{display:none}
@keyframes bob{50%{transform:translateY(.25em)}}
/* menus */
.mi{position:relative;padding:.4em .8em .4em 1.55em;border-radius:.4em;cursor:pointer;display:flex;align-items:center;gap:.55em;line-height:1.3}
.mi.sel{background:linear-gradient(90deg,rgba(242,193,78,.3),rgba(242,193,78,.03));color:#fff}
.mi.sel:before{content:'▶';position:absolute;left:.45em;color:var(--gold);font-size:.72em;animation:nud .5s infinite alternate}
@keyframes nud{to{transform:translateX(.2em)}}
.mi.dis{opacity:.4}
.mi .r{margin-left:auto;color:var(--dim);font-size:.9em;white-space:nowrap}
.mi .ic{width:1.3em;text-align:center}
.empty{color:var(--dim);padding:.6em 1em}
/* panel */
#panel{position:absolute;inset:5% 4.5%;display:grid;grid-template-columns:11.5em 1fr;gap:1em;padding:1em;z-index:5}
#panel.full{display:block;overflow:hidden}
#pnav{overflow:auto;border-right:1px solid rgba(242,193,78,.2);padding-right:.6em}
#pbody{overflow:auto;padding-right:.3em;position:relative}
.h2{font-size:1.35em;color:var(--gold);margin-bottom:.5em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.3em 1.4em}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08);padding:.2em 0}
.kv span:first-child{color:var(--dim)}
.box{background:rgba(0,0,0,.25);border:1px solid rgba(242,193,78,.18);border-radius:.5em;padding:.7em .9em;margin-top:.6em}
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:1em;height:100%}
.list{overflow:auto;max-height:100%}
.tabs{display:flex;gap:.5em;margin-bottom:.6em}
.tab{padding:.25em 1em;border-radius:2em;border:1px solid var(--gold2);cursor:pointer;font-size:.92em}
.tab.on{background:var(--gold);color:#1c1408}
textarea{width:100%;height:6em;background:#0b0914;color:#e8e0cc;border:1px solid var(--gold2);border-radius:.4em;padding:.5em;font-family:monospace;font-size:.8em;resize:none}
input.name{background:#0b0914;color:#fff;border:2px solid var(--gold2);border-radius:.4em;padding:.4em .7em;font-size:1.1em;font-family:inherit;width:12em;text-align:center;outline:none}
input.name:focus{border-color:var(--gold)}
.btn{display:inline-block;padding:.4em 1.1em;border:1px solid var(--gold2);border-radius:.4em;cursor:pointer;background:rgba(242,193,78,.12);margin:.3em .3em 0 0}
.btn:hover{background:rgba(242,193,78,.28)}
/* battle */
#bui{position:absolute;inset:0;pointer-events:none}
#bmsg{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);padding:.5em 1.4em;font-size:1.06em;min-width:44%;max-width:90%;text-align:center;min-height:2.3em}
#bmsg:empty{opacity:0}
#bbot{position:absolute;left:2%;right:2%;bottom:2.5%;display:grid;grid-template-columns:15em 1fr;gap:.8em;pointer-events:auto;height:26.5%}
#bcmd{padding:.35em;overflow:auto}
#bcmd .mi{padding-top:.26em;padding-bottom:.26em}
#bstat{padding:.6em 1.1em;display:flex;flex-direction:column;justify-content:center}
#bstat .bar{height:1.15em}
#bstat .bar>b{font-size:.75em;line-height:1.5em}
.sts{display:flex;gap:.35em;flex-wrap:wrap;margin-top:.4em;min-height:1.4em}
.sts span{font-size:.72em;padding:.08em .55em;border-radius:1em;background:#0008;border:1px solid #fff3}
/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4}
#title h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:5em;line-height:1.05;background:linear-gradient(#fff8dc,#f2c14e 55%,#b0661a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #2a1600) drop-shadow(0 0 26px rgba(242,193,78,.45));text-align:center}
#title .sub{letter-spacing:.55em;color:#e6d9bb;margin:.4em 0 1.6em;text-shadow:0 2px 6px #000;font-size:1.05em;padding-left:.55em}
#tmenu{width:16em;padding:.5em}
#title .foot{position:absolute;bottom:3%;font-size:.75em;color:#cfc4ad;text-shadow:0 1px 3px #000;text-align:center;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em;width:100%}
.card{padding:.8em;border-radius:.7em;border:2px solid rgba(242,193,78,.25);background:rgba(0,0,0,.3);text-align:center;transition:transform .15s}
.mi.sel .card{border-color:var(--gold);box-shadow:0 0 18px rgba(242,193,78,.35);transform:translateY(-.25em)}
.cards .mi{padding:0;display:block}.cards .mi.sel:before{display:none}
.card canvas{width:6em;height:6em;image-rendering:pixelated}
.card .cn{font-size:1.5em;color:var(--gold)}
.card .cd{font-size:.82em;color:#ddd3bd;min-height:3.2em;margin:.3em 0}
.card .cs{font-size:.78em;display:grid;grid-template-columns:1fr 1fr;gap:.1em .6em;text-align:left}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .4s;z-index:9}
#fade.off{opacity:0}
/* touch */
#touch{display:none}
@media (pointer:coarse){#touch{display:block}}
#dpad{position:fixed;left:2.5vmin;bottom:2.5vmin;width:36vmin;height:36vmin;z-index:20;touch-action:none}
#dpad div{position:absolute;width:33.3%;height:33.3%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);border-radius:22%;display:flex;align-items:center;justify-content:center;font-size:5vmin;color:#fffa}
#dpad .u{left:33.3%;top:0}#dpad .d{left:33.3%;bottom:0}#dpad .l{left:0;top:33.3%}#dpad .r{right:0;top:33.3%}
.tb{position:fixed;z-index:20;width:16vmin;height:16vmin;border-radius:50%;background:rgba(242,193,78,.2);border:2px solid rgba(242,193,78,.6);color:#fff;font:400 6vmin 'Black Han Sans',sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
#ta{right:3vmin;bottom:14vmin}#tbb{right:21vmin;bottom:3vmin;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}

#panel.lv{inset:18% 14%;display:block;background:radial-gradient(ellipse at center,rgba(60,40,10,.97),rgba(14,11,24,.98))}
.lvt{text-align:center;font-size:2.2em;color:var(--gold);text-shadow:0 0 18px rgba(242,193,78,.7);margin-bottom:.2em}
#panel.lv .card{padding:1.2em .8em}
#panel.lv .cd{white-space:pre-line;font-size:.95em}
#bossname{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:7;opacity:0}
#bossname.go{animation:bn 3.1s forwards}
@keyframes bn{0%{opacity:0;transform:scale(1.15);letter-spacing:.6em}15%{opacity:1;transform:scale(1);letter-spacing:.15em}80%{opacity:1}100%{opacity:0}}
.bn1{font-size:1.3em;color:#e8dcc0;letter-spacing:.6em;text-shadow:0 2px 6px #000}
.bn2{font-size:5em;color:#fff;text-shadow:0 0 30px #ff2020,0 0 60px #ff2020,0 4px 0 #300}
.bn3{height:3px;width:40%;margin:.3em auto 0;background:linear-gradient(90deg,transparent,#ff4040,transparent)}
#reel{position:absolute;inset:0;z-index:8;background:rgba(5,4,12,.94);display:grid;grid-template-columns:1.45fr 1fr;gap:1.2em;padding:3% 3.5%;align-items:center}
.rv canvas{width:100%;display:block;border-radius:.5em;border:2px solid var(--gold2);background:#000}
.rh{display:flex;justify-content:space-between;margin-bottom:.4em;font-size:1.1em}
.rbar{height:4px;background:#333;border-radius:2px;margin-top:.4em;overflow:hidden}.rbar i{display:block;height:100%;background:#ff4040;width:0}
.rn{font-size:.9em;line-height:1.55}.rni{padding:.28em 0;border-bottom:1px dashed rgba(255,255,255,.08)}
#clear{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,30,10,.9),rgba(0,0,0,.96))}
.cl1{font-size:1.6em;color:#e8dcc0;letter-spacing:.3em}.cl2{font-size:6em;color:var(--gold);text-shadow:0 0 30px rgba(242,193,78,.8);animation:clp 1.2s ease-out}
@keyframes clp{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.clst{width:24em;margin:1em 0}.cl3{animation:bob 1s infinite}
#cine{position:absolute;inset:0;z-index:8;background:#000}#cine canvas{width:100%;height:100%;display:block}.cskip{position:absolute;right:2%;bottom:2%;font-size:.8em}
#tpot{right:3vmin;bottom:32vmin;width:11vmin;height:11vmin;font-size:4.5vmin}#tmenu2{right:16vmin;bottom:32vmin;width:11vmin;height:11vmin;font-size:4.5vmin}#thelp{right:29vmin;bottom:32vmin;width:11vmin;height:11vmin;font-size:4.5vmin}
kbd{display:inline-block;min-width:1.4em;padding:.05em .4em;margin:0 .1em;border-radius:.3em;background:#2a2438;border:1px solid #8a7a50;border-bottom-width:3px;color:#ffe08a;font:700 .85em 'Gowun Dodum',sans-serif;text-align:center}
.gd{display:grid;grid-template-columns:auto 1fr;gap:.45em 1em;align-items:center}.helpb ul,.tipl{margin:.3em 0;padding-left:1.2em;line-height:1.7}.helpb li{margin:.15em 0}.helpb .box{margin:.5em 0}
.tipc{max-width:34em;margin:0 auto}.tipi{font-size:3.2em;text-align:center}.tipc .h2{text-align:center}.tipl{font-size:1.05em;line-height:1.9}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" width="960" height="640"></canvas>
  <div id="banner"><div class="ttl" id="bnT"></div><div id="bnS"></div></div>
  <div id="bossname" class="hide"></div>
  <div id="panel" class="pnl hide"></div>
  <div id="dialog" class="pnl hide"><div class="who ttl"></div><div class="txt"></div><div class="choices"></div><div class="nx">▼</div></div>
  <div id="reel" class="hide"></div>
  <div id="clear" class="hide"></div>
  <div id="cine" class="hide"></div>
  <div id="toast"></div>
  <div id="fade"></div>
</div>
<div id="touch">
  <div id="dpad"><div class="u" data-d="up">▲</div><div class="d" data-d="down">▼</div><div class="l" data-d="left">◀</div><div class="r" data-d="right">▶</div></div>
  <div class="tb" id="tbb" data-a="roll">B</div><div class="tb" id="ta" data-a="ok">A</div><div class="tb" id="tpot" data-a="potion">🧪</div><div class="tb" id="tmenu2" data-a="menu">☰</div><div class="tb" id="thelp" data-a="help">?</div>
</div>
<script>
'use strict';
/* ===================== CORE ===================== */
const W=960,H=640,TS=32;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(x,y,s){let h=(x*374761393+y*668265263+(s||0)*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b)}
function wpick(list){let s=0;for(const x of list)s+=x[1];let r=Math.random()*s;for(const x of list){r-=x[1];if(r<=0)return x[0]}return list[0][0]}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);const f=v=>Math.round(clamp(amt>0?v+(255-v)*amt:v*(1+amt),0,255));return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function rgba(hex,a){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return`rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const G={mode:'boot',p:null,map:null,ents:[],t:0,lock:0,skipper:null,dlg:false,memSave:null,cam:{x:0,y:0},shake:0,cut:false,
  parts:[],amb:[],tele:[],proj:[],pops:[],waves:[],boss:null,bossBar:0,dark:0,darkT:0,lvq:0,set:{music:true,sfx:true,fast:false}};
function wait(ms){return new Promise(r=>setTimeout(r,G.set.fast?ms*.55:ms))}
function unlock(){G.lock=Math.max(0,G.lock-1)}

/* ===================== TILES ===================== */
// s: solid
const TD={'u':{},'c':{s:1},'n':{},'N':{s:1},'b':{s:1},'S':{},'K':{s:1},'q':{},'Q':{s:1},'G':{},'.':{},',':{},'f':{},'d':{},'=':{},'T':{s:1},'Y':{s:1},'~':{s:1},'B':{},'H':{s:1},'R':{s:1},'D':{s:1},'x':{s:1},'r':{s:1},'F':{s:1},
  'o':{},'#':{s:1},'L':{s:1},'E':{},'k':{},'W':{s:1},'C':{},'P':{s:1},'V':{},'v':{},'I':{},'h':{}};
const MINI={'u':'#e2c283','c':'#4a8a3a','n':'#b8935a','N':'#5a4020','b':'#2f7a2a','S':'#b88a5a','K':'#5a3a28','q':'#4a5a6a','Q':'#1a2028','G':'#4ad8ff','.':'#4f9a3e',',':'#5aa846','f':'#3f7a36','d':'#356b2f','=':'#c9a46b','T':'#1f5a24','Y':'#143a1b','~':'#2b67ad','B':'#8b5a2b','H':'#e8d8b8','R':'#b3412f','D':'#6b4423','x':'#8b6b3e','r':'#888','F':'#7fb6e6',
  'o':'#6a5848','#':'#17110d','L':'#ff5a1f','E':'#000','k':'#4a4160','W':'#110e18','C':'#a3263a','P':'#8a83a0','V':'#05030a','v':'#8a6a3a','I':'#231c18','h':'#05030a'};
const TEX={};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function speck(c,R,cols,n,sz){sz=sz||2;for(let i=0;i<n;i++){c.fillStyle=cols[Math.floor(R()*cols.length)];c.fillRect(Math.floor(R()*TS/sz)*sz,Math.floor(R()*TS/sz)*sz,sz,sz)}}
function texGrass(c,R,base,dk,lt){base=base||'#4f9a3e';dk=dk||'#3f8433';lt=lt||'#62b24c';c.fillStyle=base;c.fillRect(0,0,TS,TS);speck(c,R,[dk,lt,dk],24);
  for(let i=0;i<4;i++){const x=Math.floor(R()*13)*2+2,y=Math.floor(R()*12)*2+6;c.fillStyle=lt;c.fillRect(x,y,2,4);c.fillRect(x+2,y-2,2,4);c.fillStyle=dk;c.fillRect(x,y+4,4,2)}}
function texTree(c,R,a,b,l){c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(16,28,12,4,0,0,7);c.fill();

function grid(w,h,ch){return Array.from({length:h},()=>Array(w).fill(ch))}
function rect(g,x,y,w,h,ch,only){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(g[j]&&g[j][i]!==undefined&&(!only||g[j][i]===only))g[j][i]=ch}
function circ(g,cx,cy,r,ch,prot){for(let j=cy-r;j<=cy+r;j++)for(let i=cx-r;i<=cx+r;i++){if(j<1||i<1||j>=g.length-1||i>=g[0].length-1)continue;if((i-cx)**2+(j-cy)**2<=r*r+1){g[j][i]=g[j][i]==='~'?'B':ch;prot&&prot.add(i+','+j)}}}
function carve(g,x0,y0,x1,y1,ch,wid,R,prot){let x=x0,y=y0;const h=g.length,w=g[0].length;
  const put=(cx,cy)=>{for(let j=0;j<wid;j++)for(let i=0;i<wid;i++){const X=cx+i-(wid>>1),Y=cy+j-(wid>>1);if(Y>0&&Y<h-1&&X>0&&X<w-1){g[Y][X]=g[Y][X]==='~'||g[Y][X]==='B'?'B':ch;prot&&prot.add(X+','+Y)}}};
  put(x,y);let guard=0;while((x!==x1||y!==y1)&&guard++<5000){const dx=Math.sign(x1-x),dy=Math.sign(y1-y);if(dx&&(!dy||R()<.5))x+=dx;else y+=dy;put(x,y)}}
function ca(g,wall,open,keep){const h=g.length,w=g[0].length,n=grid(w,h,open);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let c=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=w||Y>=h||g[Y][X]===wall)c++}n[y][x]=c>=5?wall:open}return n}
function house(g,x,y,w,h){rect(g,x,y,w,h-2,'R');rect(g,x,y+h-2,w,2,'H');const dx=x+Math.floor(w/2);g[y+h-1][dx]='D';return[dx,y+h-1]}

function curSw(){return G.p.swords[G.p.eq]||G.p.swords[0]}
function pAtk(){return 2+G.p.pow*2+swAtk(curSw())}
function maxHp(){return Math.round(G.p.hearts*4)}
function recalcHearts(){const p=G.p;p.hearts=clamp(3+(p.lv-1)*.25-(p.heartLoss||0),3,10);p.hp=Math.min(p.hp,maxHp())}
function xpNeed(l){return Math.round(10*Math.pow(l,2.15))}
function addItem(id,n){n=n===undefined?1:n;G.p.inv[id]=(G.p.inv[id]||0)+n;if(G.p.inv[id]<=0)delete G.p.inv[id]}
function has(id){return G.p.inv[id]||0}
function zoneLv(id){return{field:'Lv.1~3',wood:'Lv.4~6',canyon:'Lv.7~10',desert:'Lv.10~20',tomb:'Lv.20',ruins:'Lv.20~24',lair1:'지역 보스',lair2:'지역 보스',castle1:'Lv.22+',castle2:'Lv.22+',castle3:'Lv.22+'}[id]}
function keyCount(){let n=0;for(let i=1;i<=5;i++)if(G.p.flags['pz'+i])n++;return n}
function gainXp(n){const p=G.p;if(p.lv>=30)return;p.xp+=n;while(p.xp>=xpNeed(p.lv)&&p.lv<30){p.xp-=xpNeed(p.lv);p.lv++;G.lvq++;const before=maxHp();recalcHearts();p.hp+=maxHp()-before}}

/* ===================== QUESTS ===================== */
function qs(id){return G.p.quests[id]&&G.p.quests[id].s}
function killsOf(list){return list.reduce((a,k)=>a+(G.p.kills[k]||0),0)}
function qStart(id){const Q=QS[id];G.p.quests[id]={s:'a',b:Q.kill?killsOf(Q.kill):0};toast('📜 퀘스트 시작: '+Q.n,'gold');sfx('quest');saveGame()}
function qProg(id){const Q=QS[id],q=G.p.quests[id];if(!q)return{done:false,txt:''};if(Q.prog)return Q.prog();
  if(Q.keys){const c=keyCount();return{done:c>=Q.keys,txt:`열쇠 ${c}/${Q.keys}`}}
  if(Q.flag){const d=!!G.p.flags[Q.flag];return{done:d,txt:d?'달성!':'진행 중'}}
  if(Q.kill){const c=Math.min(Q.need,killsOf(Q.kill)-q.b);return{done:c>=Q.need,txt:`처치 ${c}/${Q.need}`}}
  if(Q.col){const k=Object.keys(Q.col)[0];const c=Math.min(Q.col[k],has(k));return{done:c>=Q.col[k],txt:`${IT[k].n} ${c}/${Q.col[k]}`}}
  return{done:false,txt:'대화하기'}}
function qReady(id){return qs(id)==='a'&&qProg(id).done}
async function qFinish(id){const Q=QS[id];G.p.quests[id].s='d';if(Q.col)for(const k in Q.col)addItem(k,-Q.col[k]);const rw=Q.rw||{};sfx('fanfare');toast('✅ 퀘스트 완료: '+Q.n,'gold');
  const parts=[];if(rw.g){G.p.gold+=rw.g;parts.push('💰 '+rw.g+'G')}if(rw.it)for(const k in rw.it){addItem(k,rw.it[k]);parts.push(IT[k].ic+' '+IT[k].n+(rw.it[k]>1?' x'+rw.it[k]:''))}
  if(rw.xp){parts.push('✨ 경험치 '+rw.xp);gainXp(rw.xp)}
  if(parts.length)await say('',`퀘스트 「${Q.n}」 완료!\n보상: ${parts.join(', ')}`);saveGame()}

const SAVEKEY='tryrpg-save-v1';
function serialize(){return JSON.stringify({v:2,p:G.p,set:G.set})}
function saveGame(){if(!G.p)return false;G.p.x=Math.round(G.pl.x);G.p.y=Math.round(G.pl.y);G.p.dir=G.pl.dir;G.memSave=serialize();try{localStorage.setItem(SAVEKEY,G.memSave);return true}catch(e){return false}}
function loadSave(){try{const s=localStorage.getItem(SAVEKEY);if(!s)return null;const o=JSON.parse(s);if(!o||!o.p||o.p.v!==2)return null;return o}catch(e){return null}}
function encodeSave(){return btoa(unescape(encodeURIComponent(serialize())))}
function decodeSave(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}

G.pl={x:0,y:0,dir:'down',mv:false,anim:0,sw:null,combo:0,comboT:0,buf:false,charge:0,roll:null,inv:0,kbx:0,kby:0,stam:100,sd:0,swid:0,pose:null,stamShow:0};
G.cutB=new Set();G.rects=[];G.falls=[];G.hitstop=0;G.flash=null;G.hurtFlash=0;G.camFocus=null;G.bossShown=0;
const held=[];let atkHeld=false;
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const easeOut=q=>1-Math.pow(1-clamp(q,0,1),3);
function angOf(d){return{right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[d]}
function adiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)}
function fpop(x,y,text,col,big){G.pops.push({x,y,text,col:col||'#fff',life:1,max:1,big})}
function bursts(x,y,n,col,o){burst(G.parts,x,y,n,col,o)}

/* ---------- collision ---------- */
function solidTileAt(px,py){const m=G.map,tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=m.w||ty>=m.h)return true;const ch=m.g[ty][tx];if(ch==='b'&&G.cutB.has(tx+','+ty))return false;if(ch==='V')return !!G._mvE;return !!TD[ch].s}
function objSolid(e){if(e.gone||!e.solid)return false;if(e.solidF)return e.solidF(e);if(e.type==='door')return e.open<.85;if(e.type==='sdoor')return e.open<1;return true}
function buildRects(){G.rects=[];for(const e of G.ents){if(!objSolid(e))continue;if(e.type==='npc')G.rects.push({x:e.tx*TS+5,y:e.ty*TS+10,w:22,h:20});else G.rects.push({x:e.tx*TS+2,y:e.ty*TS+(e.type==='sign'||e.type==='rune'?12:4),w:(e.w||1)*TS-4,h:(e.h||1)*TS-(e.type==='sign'||e.type==='rune'?12:4)})}}
function blocked(x,y,r){const x0=x-r,x1=x+r,y0=y-r*.7,y1=y+r*.35;
  for(const[px,py]of[[x0,y0],[x1,y0],[x0,y1],[x1,y1],[x,y0],[x,y1],[x0,y],[x1,y]])if(solidTileAt(px,py))return true;
  for(const R of G.rects)if(x1>R.x&&x0<R.x+R.w&&y1>R.y&&y0<R.y+R.h)return true;return false}
function moveE(e,dx,dy,r){G._mvE=e!==G.pl;let hit=false;const n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/8)||1;for(let i=0;i<n;i++){if(dx){if(!blocked(e.x+dx/n,e.y,r))e.x+=dx/n;else hit=true}if(dy){if(!blocked(e.x,e.y+dy/n,r))e.y+=dy/n;else hit=true}}return hit}
function rayLen(x,y,a,max){for(let d=0;d<max;d+=8)if(solidTileAt(x+Math.cos(a)*d,y+Math.sin(a)*d))return d;return max}

/* ---------- telegraphs ---------- */
function tele(o){o.t0=G.t;G.tele.push(o);return o}
function clearTele(owner){G.tele=owner?G.tele.filter(t=>t.owner!==owner):[]}
function inSector(p,x,y,r,a,half){const dx=p.x-x,dy=p.y-10-y,d=Math.hypot(dx,dy);return d<r+8&&(d<20||adiff(Math.atan2(dy,dx),a)<half)}

/* ---------- player ---------- */
function hurt(dmg,sx,sy){const pl=G.pl,p=G.p;if(G.dead||G.cut||pl.inv>0||pl.pose)return false;
  if(pl.roll&&pl.roll.t<.3){if(!pl.roll.dodged){pl.roll.dodged=1;fpop(pl.x,pl.y-44,'회피!','#7dff9a');sfx('dodge')}return false}
  p.hp=Math.max(0,p.hp-dmg);pl.inv=1.1;const a=Math.atan2(pl.y-sy,pl.x-sx);pl.kbx=Math.cos(a)*280;pl.kby=Math.sin(a)*280;G.shake=Math.max(G.shake,8);sfx('hurt');G.hurtFlash=.35;
  fpop(pl.x,pl.y-40,'-'+(dmg/4)+'♥','#ff6b6b',1);if(G.shr)G.shr.dmg+=dmg;pl.sw=null;pl.charge=0;if(p.hp<=0)die();return true}
function startSwing(){const pl=G.pl;if(pl.roll||G.cut||pl.pose)return;
  if(pl.sw){if(!pl.sw.spin&&pl.sw.t>pl.sw.dur*.4)pl.buf=true;return}
  const combo=pl.comboT>0?pl.combo%3+1:1;pl.combo=combo;pl.sw={t:0,dur:combo===3?.3:.21,id:++pl.swid,combo,hit:new Set(),rev:combo===2};sfx(combo===3?'swing3':'swing');
  const[dx,dy]=DV[pl.dir];moveE(pl,dx*(combo===3?12:5),dy*(combo===3?12:5),9);
  const s=curSw();if(SW[s.b].beam&&G.p.hp>=maxHp()){G.proj.push({k:'beam',x:pl.x+dx*16,y:pl.y-12+dy*16,vx:dx*400,vy:dy*400,life:.75,dmg:Math.round(pAtk()*.7),from:'p',hit:new Set(),a:angOf(pl.dir)});sfx('beam')}}
function startSpin(){const pl=G.pl;pl.sw={t:0,dur:.42,id:++pl.swid,spin:true,hit:new Set()};pl.charge=0;sfx('spin');bursts(pl.x,pl.y-12,20,['#bff4ff','#fff'],{glow:1,sp:200,shrink:1})}
function doRoll(){const pl=G.pl;if(pl.roll||G.cut||pl.pose)return;if(pl.stam<25){sfx('err');pl.stamShow=1.5;return}pl.stam-=25;pl.sd=.7;pl.stamShow=2;
  let ix=0,iy=0;for(const d of held){ix+=DV[d][0];iy+=DV[d][1]}if(!ix&&!iy){[ix,iy]=DV[pl.dir]}const n=Math.hypot(ix,iy);pl.roll={t:0,dx:ix/n,dy:iy/n};pl.sw=null;pl.charge=0;sfx('roll')}
function drinkPotion(){const p=G.p;if(p.hp>=maxHp()){toast('하트가 이미 가득하다');sfx('err');return}const k=has('potion')?'potion':has('bigpotion')?'bigpotion':null;if(!k){toast('회복약이 없다! (상인 포피에게서 살 수 있다)');sfx('err');return}
  addItem(k,-1);p.hp=Math.min(maxHp(),p.hp+IT[k].heal);sfx('heal');bursts(G.pl.x,G.pl.y-20,22,['#7dff9a','#fff','#ff8fb1'],{glow:1,round:1,sp:90,vy:-60});toast(`${IT[k].ic} ${IT[k].n}! (남은 개수 ${has(k)})`)}
function frontPoint(){const pl=G.pl,[dx,dy]=DV[pl.dir];return[pl.x+dx*24,pl.y-8+dy*24]}
function interactTarget(){const[fx,fy]=frontPoint();let best=null,bd=1e9;
  for(const e of G.ents){if(e.gone||!(['npc','sign','tablet','chest','statue','sdoor','rune','door'].includes(e.type)||e.inter))continue;if(e.hidden&&e.hidden())continue;if(e.type==='chest'&&e.opened)continue;if(e.type==='door'&&e.open>.5)continue;
    const cx=e.tx*TS+(e.w||1)*TS/2,cy=e.ty*TS+(e.h||1)*TS/2+4;const d=Math.abs(fx-cx)/((e.w||1)*16+10)+Math.abs(fy-cy)/((e.h||1)*16+12);if(d<1&&d<bd){bd=d;best=e}}return best}
async function interact(e){G.lock++;atkHeld=false;try{
  if(e.type==='npc'){e.dir={up:'down',down:'up',left:'right',right:'left'}[G.pl.dir];await e.talk(e)}
  else if(e.type==='sign')await say('📜 표지판',e.text);
  else if(e.type==='tablet')await say('📜 고대 석판',['「빛의 결정은 새겨진 별의 수가 적은 것부터 차례로 깨어난다.」','(결정 받침대에 새겨진 별의 개수를 보고, 검으로 순서대로 내리쳐 보자)']);
  else if(e.type==='statue')await say('','무릎 꿇은 고대 전사의 석상이다. 어딘가 경기장 쪽을 바라보고 있는 것 같다...');
  else if(e.type==='rune')await say('',G.p.flags.shrineClear?'문양이 황금빛으로 고요히 빛나고 있다.':'푸른 고대 문양이 맥박치듯 빛나고 있다. 무언가를 기다리는 듯하다...');
  else if(e.type==='door')await say('','거대한 석문이 굳게 닫혀 있다.');
  else if(e.type==='sdoor')await say('',G.p.lv>=10&&!G.p.flags.fb1?['돌문의 문양이 희미하게 깜빡이다 꺼진다. 무언가 사나운 기운이 숲 너머에서 문양을 짓누르고 있다…','(지역 보스: 거인의 협곡 북쪽 동굴의 「고르곤」을 쓰러뜨리자)']:G.p.lv>=10?'돌문이 낮게 울리고 있다...':`고대 문양이 희미하게 빛나다 사라진다...\n아직 문이 반응하지 않는다. (Lv.10 이상 필요 — 현재 Lv.${G.p.lv})`);
  else if(e.onInter)await e.onInter(e);
  else if(e.type==='chest')await openGuardChest(e);}finally{unlock()}}
function updPlayer(dt){const pl=G.pl,p=G.p;if(pl.inv>0)pl.inv-=dt;if(pl.comboT>0)pl.comboT-=dt;if(pl.stamShow>0&&pl.stam>=p.mstam)pl.stamShow-=dt;
  if(pl.pose){pl.pose.t+=dt;return}
  if(blocked(pl.x,pl.y,9)){let best=null;for(let r=4;r<160&&!best;r+=4)for(let a=0;a<16;a++){const x=pl.x+Math.cos(a/16*Math.PI*2)*r,y=pl.y+Math.sin(a/16*Math.PI*2)*r;if(!blocked(x,y,9)){best=[x,y];break}}if(best){pl.x=best[0];pl.y=best[1]}}
  const ctrl=!G.cut&&!G.dead;
  if(!pl.roll){if(pl.sd>0)pl.sd-=dt;else pl.stam=Math.min(p.mstam,pl.stam+38*dt)}
  if(Math.abs(pl.kbx)+Math.abs(pl.kby)>4){moveE(pl,pl.kbx*dt,pl.kby*dt,9);const f=Math.pow(.002,dt);pl.kbx*=f;pl.kby*=f}else pl.kbx=pl.kby=0;
  if(pl.roll){const r=pl.roll;r.t+=dt;const sp=340*(1-r.t/.36*.55);moveE(pl,r.dx*sp*dt,r.dy*sp*dt,9);pl.anim+=dt*16;if(Math.random()<.6)G.parts.push({x:pl.x+rnd(-6,6),y:pl.y,vx:rnd(-20,20),vy:rnd(-30,-5),life:.4,max:.4,col:G.map.id==='canyon'?'#c9a27a':'#d8d0c0',size:rnd(3,6),round:1,shrink:1});if(r.t>=.36)pl.roll=null;return}
  if(pl.sw){const sw=pl.sw;sw.t+=dt;if(sw.t>=.035&&sw.t<=(sw.spin?.38:.15))swordHit(sw);if(sw.t>=sw.dur){pl.sw=null;pl.comboT=sw.combo===3?0:.3;if(pl.buf&&ctrl){pl.buf=false;startSwing()}}}
  let ix=0,iy=0;if(ctrl)for(const d of held){ix+=DV[d][0];iy+=DV[d][1]}ix=clamp(ix,-1,1);iy=clamp(iy,-1,1);
  if((ix||iy)&&(!pl.sw||pl.sw.spin)){if(!pl.sw&&held.length)pl.dir=held[held.length-1];const n=Math.hypot(ix,iy),sp=(pl.sw?60:pl.charge>.12?70:128)*(G.slow||1);moveE(pl,ix/n*sp*dt,iy/n*sp*dt,9);pl.mv=true;pl.anim+=dt*(sp/16)}else pl.mv=false;
  if(atkHeld&&!pl.sw&&ctrl){const before=pl.charge;pl.charge+=dt;if(before<.7&&pl.charge>=.7)sfx('charged')}else if(!atkHeld)pl.charge=0;
  // portals
  if(!G.cut){const tx=Math.floor(pl.x/TS),ty=Math.floor(pl.y/TS);const pt=G.map.portals.find(q=>q.x===tx&&q.y===ty);if(pt)enterMap(pt.to,pt.tx*TS+16,pt.ty*TS+20,pt.dir)}}
function swordHit(sw){const pl=G.pl,cx=pl.x,cy=pl.y-10,R=sw.spin?60:44,fa=angOf(pl.dir);
  const inArc=(x,y,r)=>{const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d>R+r)return false;if(sw.spin)return true;return d<r+6||adiff(Math.atan2(dy,dx),fa)<1.3};
  const base=pAtk()*(sw.spin?2:sw.combo===3?1.5:1);
  for(const e of G.ents){if(e.gone||sw.hit.has(e))continue;
    if(e.type==='mob'&&e.hp>0&&!(e.spawnT>0)&&inArc(e.x,e.y-e.d.r,e.d.r)){sw.hit.add(e);hitMob(e,base,cx,cy)}
    else if(e.type==='ore'&&inArc(e.x,e.y-12,14)){sw.hit.add(e);hitOre(e)}
    else if(e.type==='crystal'&&inArc(e.x,e.y-14,14)){sw.hit.add(e);hitCrystal(e)}
    else if(e.onHit&&inArc(e.x,e.y-14,16)){sw.hit.add(e);e.onHit(e)}}
  if(G.worm&&!sw.hit.has(G.worm)&&wormHittable()){const h=wormHead();if(inArc(h.x,h.y,40)){sw.hit.add(G.worm);hitWorm(base)}}
  const b=G.boss;if(b&&!sw.hit.has(b)&&inArc(b.x,b.y-40,b.r+6)){sw.hit.add(b);hitBoss(b,base)}
  if(G.fb&&!sw.hit.has(G.fb)&&fbHittable()){const h=fbPoint(G.fb);if(inArc(h.x,h.y,h.r)){sw.hit.add(G.fb);fbHit(base,cx,cy)}}
  const m=G.map;for(let ty=Math.floor((cy-R)/TS);ty<=Math.floor((cy+R)/TS);ty++)for(let tx=Math.floor((cx-R)/TS);tx<=Math.floor((cx+R)/TS);tx++){if(m.g[ty]&&m.g[ty][tx]==='b'&&!G.cutB.has(tx+','+ty)&&inArc(tx*TS+16,ty*TS+16,12))cutBush(tx,ty)}}
function cutBush(tx,ty){G.cutB.add(tx+','+ty);sfx('cut');const x=tx*TS+16,y=ty*TS+16;bursts(x,y,16,['#3f9a35','#6fd35a','#2a6b25'],{sp:140,g:300,s1:2,s2:5});
  const r=Math.random();if(r<.12&&G.p.hp<maxHp())spawnPick('heart',x,y);else if(r<.3)spawnPick('gold',x,y,1);if(G.map.id==='wood'&&tx>=22&&tx<=27&&ty<=14)toast('🌿 덤불 너머로 길이 보인다…')}
function hitOre(e){e.hp--;sfx('clang');G.shake=Math.max(G.shake,3);bursts(e.x,e.y-12,10,['#c9c2b6','#ffcc55','#8a8a8a'],{sp:160,g:300});
  if(e.hp<=0){e.gone=1;sfx('rock');bursts(e.x,e.y-10,24,['#8a8a8a','#6a6a6a','#c9a27a'],{sp:200,g:400,s1:3,s2:7});const n=ri(1,2);for(let i=0;i<n;i++)spawnPick('mat',e.x,e.y-6,1,'ore');if(Math.random()<.4)spawnPick('gold',e.x,e.y,ri(2,5))}}

/* ---------- mobs ---------- */
function mkMob(k,x,y){const d=MOB[k];return{type:'mob',k,d,x,y,hp:d.hp,st:'idle',t:Math.random(),face:1,kbx:0,kby:0,flash:0,hitT:0,cd:rnd(.5,1.5),z:0,seed:Math.random()*9}}
function spawnMob(){const m=G.map;if(!m.pool)return;for(let tries=0;tries<50;tries++){const[x,y]=m.reach[Math.floor(Math.random()*m.reach.length)];if(m.noSpawnC&&m.noSpawnC.some(([cx,cy,r])=>(x-cx)**2+(y-cy)**2<r*r))continue;if(m.g[y][x]==='c'||m.g[y][x]==='V'||m.g[y][x]==='h'||m.g[y][x]==='v')continue;
    if(m.g[y][x]==='b'||m.g[y][x]==='=')continue;if(Math.hypot(x*TS-G.pl.x,y*TS-G.pl.y)<9*TS)continue;if(m.portals.some(p=>Math.abs(p.x-x)+Math.abs(p.y-y)<6))continue;
    const B=m.noSpawnBox;if(B&&x>=B[0]&&x<=B[2]&&y>=B[1]&&y<=B[3])continue;if(G.ents.some(e=>e.solid&&e.tx===x&&e.ty===y))continue;
    const pool=m.zones?(m.zones.find(z=>x>=z[0]&&x<z[1])||m.zones[0])[2]:m.pool;G.ents.push(mkMob(wpick(pool),x*TS+16,y*TS+20));return}}
function wander(e,dt){e.wt=(e.wt||0)-dt;if(e.wt<=0){e.wt=rnd(1,2.6);const a=Math.random()*7;e.wx=Math.random()<.35?0:Math.cos(a);e.wy=e.wx?Math.sin(a):0}if(e.wx||e.wy){moveE(e,e.wx*e.d.spd*.4*dt,e.wy*e.d.spd*.4*dt,e.d.r);if(e.wx)e.face=e.wx}}
function mobAI(e,dt){const pl=G.pl,d=e.d,dx=pl.x-e.x,dy=pl.y-e.y,dist=Math.hypot(dx,dy)||1,aggro=dist<(e.k==='archer'?270:210)&&!G.dead;

function pz4Update(){if(G.p.flags.pz4s)return;const pl=G.pl,z=G.dz;const tx=Math.floor(pl.x/TS),ty=Math.floor((pl.y-4)/TS),k=tx+','+ty;if(z.p4last===k)return;z.p4last=k;
  const ts=G.ents.filter(e=>e.type==='ltile');const t=ts.find(e=>e.tx===tx&&e.ty===ty);if(!t)return;pz4Toggle(t,ts);sfx('tele');if(ts.every(o=>o.on))pzSolve(4,'별빛의 퍼즐 해결!')}
/* ---------- puzzle 5: race ---------- */
function bfsDist(m,a,b){const seen=new Map([[a+'',0]]),q=[a];while(q.length){const[x,y]=q.shift();const d=seen.get(x+','+y);if(x===b[0]&&y===b[1])return d;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||nx<0||ny<0||nx>=m.w||ny>=m.h||TD[m.g[ny][nx]].s)continue;seen.set(k,d+1);q.push([nx,ny])}}return 200}
async function pz5Start(){if(G.p.flags.pz5s){await say('📜 바람의 석판','바람이 잔잔하다. (해결됨)');return}const z=G.dz;
  const c=await ask('📜 바람의 석판','「모래바람보다 빨리 남동쪽의 깃발에 닿아라.」\n제한 시간 안에 남동쪽 끝의 붉은 깃발에 도착해야 한다. (구르기를 활용하자!)',['도전한다','그만둔다']);if(c!==0)return;
  const d=bfsDist(G.map,[DZ.z5s[0],DZ.z5s[1]],DZ.z5g);z.p5={on:1,t:0,lim:Math.round(d/4*1.2+3)};sfx('fanfare');toast(`🏁 출발! 제한 시간 ${z.p5.lim}초`,'gold')}
function pz5Update(dt){const z=G.dz;if(!z.p5||!z.p5.on)return;z.p5.t+=dt;const gx=DZ.z5g[0]*TS+16,gy=DZ.z5g[1]*TS+24;
  if(Math.hypot(G.pl.x-gx,G.pl.y-gy)<34){z.p5.on=0;pzSolve(5,`바람의 퍼즐 해결! (${z.p5.t.toFixed(1)}초)`)}else if(z.p5.t>z.p5.lim){z.p5.on=0;sfx('buzz');toast('⌛ 시간 초과… 석판에서 다시 도전하자')}}

  if(!qs('q7')){setTimeout(()=>{qStart('q7');setTimeout(()=>qStart('q8'),900)},1800)}
  const zp=[[['scarab',3],['mummy',2]],[['mummy',2],['skarch',3]],[['colossus',2],['scorp',2],['skarch',1]]];
  ['c1','c2','c3'].forEach((k,i)=>{const[cx,cy]=DZ[k];G.dz.camps[k]={i,done:0};const n=i===2?4:5;for(let j=0;j<n;j++){const a=j/n*Math.PI*2;const m=mkMob(wpick(zp[i]),(cx+Math.cos(a)*2.6)*TS+16,(cy+Math.sin(a)*2.2)*TS+20);m.camp=k;G.ents.push(m)}})}

    G.ents.push({type:'cchest',tx:cx,ty:cy+2,solid:1,inter:1,x:cx*TS+16,y:(cy+2)*TS+28,lv:c.i,onInter:async e=>{e.gone=1;const g=[60,110,170][e.lv]+ri(0,40);G.p.gold+=g;const it=[];if(Math.random()<.7){addItem('potion');it.push('🧪 회복약')}if(e.lv>=1&&Math.random()<.6){addItem('relic');it.push('🏺 유물 조각')}if(e.lv===2&&Math.random()<.5){addItem('chitin');it.push('🦂 전갈 껍질')}gainXp([60,110,180][e.lv]);sfx('chest');await say('',`⛺ 캠프 보상: 💰 ${g}G${it.length?', '+it.join(', '):''}, ✨ 경험치 ${[60,110,180][e.lv]}`);saveGame()}});

    else if(d.open<1&&dist<60&&G.p.lv>=20&&keyCount()>=5&&G.p.flags.fb2){d.opening=1;sfx('rumble');for(let i=0;i<5;i++)setTimeout(()=>sfx('chime3'),i*250)}
    else if(d.open>=1&&pl.y<14*TS+6&&Math.abs(pl.x-fx)<20)enterMap('tomb',22*TS,103*TS+16,'up')}}

  if(k==='gorgon')toast('🏛️ 이제 「잊혀진 수호자의 사당」의 문양이 반응할 것이다 (Lv.10)','gold');if(k==='azrak')toast('🔺 피라미드의 봉인이 약해졌다 — Lv.20 · 열쇠 5개로 문이 열린다','gold');

/* ---------- GORGON ---------- */
function gorgonUpdate(b,dt){const pl=G.pl,P2=b.phase===2,dx=pl.x-b.x,dy=pl.y-b.y,dist=Math.hypot(dx,dy)||1;b.t+=dt;b.cd-=dt;if(b.flash>0)b.flash-=dt;
  for(const p of G.ents)if(p.type==='gpillar'&&p.hp<=0){p.regrow+=dt;if(p.regrow>16){p.hp=2;p.regrow=0;p.rise=0;sfx('rumble');bursts(p.x,p.y,16,['#8a6a4a','#c9a27a'],{sp:120,g:300});buildRects()}}else if(p.type==='gpillar'&&p.rise<1)p.rise=Math.min(1,(p.rise||0)+dt*2);
  switch(b.st){
    case'idle':b.raise=0;if(Math.abs(dx)>4)b.face=Math.sign(dx);if(b.cd<=0){if(dist<105)gStart(b,'stomp');else if(P2&&dist>200&&Math.random()<.35)gStart(b,'rocks');else gStart(b,'aim')}else moveE(b,dx/dist*(P2?66:48)*dt,dy/dist*(P2?66:48)*dt,b.r);break;
    case'stomp':b.raise=Math.min(1,b.t/b.wd);if(b.t>=b.wd){sfx('slam');G.shake=14;bursts(b.x,b.y,40,['#8a6a4a','#c9a27a','#fff'],{sp:260,g:400});if(Math.hypot(pl.x-b.x,pl.y-b.y)<100)hurt(5,b.x,b.y);if(P2)G.waves.push({x:b.x,y:b.y,R:30,sp:250,max:330,w:14,dmg:3,col:'#c9a27a'});b.st='rec';b.t=0;b.rd=.8}break;
    case'aim':b.raise=.35;if(b.t<b.wd*.55){b.la=Math.atan2(dy,dx);b.tl.a=b.la;b.tl.len=rayLen(b.x,b.y-6,b.la,560)}b.face=Math.cos(b.la)>=0?1:-1;if(b.t>=b.wd){b.st='charge';b.t=0;sfx('roar2')}break;
    case'charge':{const sp=P2?480:410;const hit=moveE(b,Math.cos(b.la)*sp*dt,Math.sin(b.la)*sp*dt,b.r);if(Math.random()<.7)G.parts.push({x:b.x+rnd(-20,20),y:b.y,vx:rnd(-40,40),vy:-30,life:.5,max:.5,col:'#c9a27a',size:6,round:1,shrink:1});
      if(Math.hypot(pl.x-b.x,pl.y-b.y)<b.r+14)hurt(5,b.x,b.y);
      const pil=G.ents.find(p=>p.type==='gpillar'&&p.hp>0&&Math.hypot(p.x-b.x,p.y-b.y)<b.r+26);
      if(pil){pil.hp--;sfx('crash');G.shake=20;G.hitstop=.08;bursts(pil.x,pil.y-30,40,['#8a6a4a','#c9a27a','#fff'],{sp:300,g:400,s1:3,s2:7});fpop(b.x,b.y-110,'갑옷 균열!','#ffdd33',1);if(pil.hp<=0){pil.regrow=0;buildRects()}b.st='stun';b.t=0;b.sd=P2?3.0:3.6;clearTele(b);break}
      if(hit||b.t>1.35){G.shake=Math.max(G.shake,hit?10:4);if(hit){sfx('slam');bursts(b.x+Math.cos(b.la)*30,b.y,20,['#8a6a4a','#c9a27a'],{sp:200,g:300})}
        if(P2&&!b.chain){b.chain=1;gStart(b,'aim');b.wd=.6}else{b.chain=0;b.st='rec';b.t=0;b.rd=hit?.9:.6}}break}
    case'stun':b.raise=0;if(Math.random()<.2)bursts(b.x+rnd(-30,30),b.y-rnd(40,90),2,['#ffe066'],{sp:40});if(b.t>=b.sd){b.st='rec';b.t=0;b.rd=.4;sfx('roar2')}break;
    case'rocks':b.raise=Math.min(1,b.t*2);if(!b.done&&b.t>.5){b.done=1;sfx('slam');G.shake=8;for(let i=0;i<4;i++){const a=Math.random()*7,r=i?rnd(40,120):0;dropRock(pl.x+Math.cos(a)*r,pl.y+Math.sin(a)*r*.7,1.1+i*.12,4,'rock')}}if(b.t>1){b.st='rec';b.t=0;b.rd=.6;b.done=0}break;
    case'rec':b.raise=Math.max(0,b.raise-dt*3);if(b.t>=(b.rd||.7)){b.st='idle';b.t=0;b.cd=P2?.5:1.0}break}}
function gStart(b,k){b.st=k;b.t=0;b.done=0;const P2=b.phase===2,pl=G.pl;
  if(k==='stomp'){b.wd=P2?.68:.85;tele({k:'circle',x:b.x,y:b.y,r:100,dur:b.wd,owner:b})}
  if(k==='aim'){b.wd=P2?.75:1.0;b.la=Math.atan2(pl.y-b.y,pl.x-b.x);b.tl=tele({k:'line',x:b.x,y:b.y-6,a:b.la,len:rayLen(b.x,b.y-6,b.la,560),w:64,dur:b.wd,owner:b})}}
function dropRock(x,y,dur,dmg,kind){tele({k:'circle',x,y,r:46,dur,owner:G.fb});G.drops.push({x,y,t0:G.t,dur,dmg,kind})}
function updDrops(dt){for(const d of G.drops){if(!d.done&&G.t-d.t0>=d.dur){d.done=1;sfx('slam');G.shake=Math.max(G.shake,6);bursts(d.x,d.y,20,d.kind==='rock'?['#8a6a4a','#c9a27a']:d.kind==='ghost'?['#a060ff','#fff']:['#d8b878','#fff'],{sp:200,g:300});if(Math.hypot(G.pl.x-d.x,G.pl.y-d.y)<46)hurt(d.dmg,d.x,d.y)}}G.drops=G.drops.filter(d=>G.t-d.t0<d.dur+.4)}

function hitPylon(e){const b=G.fb;sfx('clang');if(!b||!b.fight){fpop(e.x,e.y-60,'고요하다…','#ccc');return}
  if(e.st==='cool'){fpop(e.x,e.y-60,'재충전 중','#aaa');return}if(e.st!=='idle')return;e.hits++;const need=b.phase===2?2:1;bursts(e.x,e.y-50,12,['#ffe08a','#fff'],{glow:1,sp:160});
  if(e.hits>=need){e.st='charge';e.t=0;e.hits=0;sfx('charged');fpop(e.x,e.y-70,'충전 시작!','#ffe08a')}else fpop(e.x,e.y-70,`${e.hits}/${need}`,'#ffe08a')}
function azrakUpdate(b,dt){const pl=G.pl,P2=b.phase===2,dx=pl.x-b.x,dy=pl.y-b.y,dist=Math.hypot(dx,dy)||1;b.t+=dt;b.cd-=dt;b.flap+=dt*(b.st==='ground'?0:b.st==='swoop'?4:9);if(b.flash>0)b.flash-=dt;if(Math.abs(dx)>4)b.face=Math.sign(dx);
  G.storm=lerp(G.storm,G.stormT,Math.min(1,dt*1.2));
  // pylons
  for(const p of G.ents)if(p.type==='pylon'){p.t+=dt;
    if(p.st==='charge'){p.ch=Math.min(1,p.ch+dt/(P2?3.4:2.4));if(Math.random()<.3)G.parts.push({x:p.x+rnd(-16,16),y:p.y-rnd(10,60),vx:0,vy:-40,life:.6,max:.6,col:'#ffe08a',size:2,round:1,glow:1});if(p.ch>=1){p.st='ready';p.t=0;sfx('chime3')}}
    else if(p.st==='ready'){const inR=Math.hypot(b.x-p.x,b.y-p.y)<330&&(b.st==='fly'||b.st==='spit'||b.st==='swoop'||b.st==='aim');
      if(inR){p.st='cool';p.t=0;p.ch=0;fireBeam(p,b)}else if(p.t>9){p.st='idle';p.ch=0;fpop(p.x,p.y-70,'빛이 흩어졌다','#aaa')}}
    else if(p.st==='cool'&&p.t>10){p.st='idle';sfx('tele')}}
  const hover=()=>{const a=b.orb+=dt*(P2?.9:.6);const tx=pl.x+Math.cos(a)*190,ty=pl.y+Math.sin(a)*110-30;b.x=lerp(b.x,clamp(tx,6*TS,26*TS),Math.min(1,dt*1.4));b.y=lerp(b.y,clamp(ty,4*TS,20*TS),Math.min(1,dt*1.4));b.z=lerp(b.z,120,Math.min(1,dt*2))};
  switch(b.st){
    case'fly':hover();if(b.cd<=0){const r=Math.random();if(P2&&r<.3)azStart(b,'rain');else if(r<.62)azStart(b,'aim');else azStart(b,'spit')}break;
    case'aim':b.z=lerp(b.z,90,Math.min(1,dt*3));if(b.t<b.wd*.5){b.la=Math.atan2(pl.y-b.y,pl.x-b.x);b.tl.a=b.la;b.tl.x=b.x;b.tl.y=b.y}if(b.t>=b.wd){b.st='swoop';b.t=0;sfx('wave')}break;
    case'swoop':{b.z=lerp(b.z,14,Math.min(1,dt*10));b.x+=Math.cos(b.la)*560*dt;b.y+=Math.sin(b.la)*560*dt;b.x=clamp(b.x,5*TS,27*TS);b.y=clamp(b.y,3*TS,21*TS);if(Math.random()<.8)G.parts.push({x:b.x+rnd(-30,30),y:b.y,vx:rnd(-60,60),vy:-30,life:.5,max:.5,col:'#d8b878',size:5,round:1,shrink:1});
      if(Math.hypot(pl.x-b.x,pl.y-b.y)<44)hurt(6,b.x,b.y);if(b.t>.62){if(P2&&!b.chain){b.chain=1;azStart(b,'aim');b.wd=.55}else{b.chain=0;b.st='fly';b.t=0;b.cd=P2?1.0:1.6}}break}
    case'spit':hover();if(b.t>.55&&!b.done){b.done=1;const n=P2?5:3;for(let i=0;i<n;i++){const a=Math.atan2(pl.y-10-(b.y-b.z),pl.x-b.x)+(i-(n-1)/2)*.2;G.proj.push({k:'sand',x:b.x,y:b.y-b.z,vx:Math.cos(a)*250,vy:Math.sin(a)*250,life:2.4,dmg:4,from:'e',a,fly:1})}sfx('fire')}if(b.t>1){b.st='fly';b.t=0;b.cd=P2?1:1.5;b.done=0}break;
    case'rain':hover();if(!b.done&&b.t>.3){b.done=1;sfx('wave');for(let i=0;i<6;i++){const a=Math.random()*7,r=i?rnd(50,170):0;dropRock(pl.x+Math.cos(a)*r,pl.y+Math.sin(a)*r*.7,1.05+i*.1,4,'sand')}}if(b.t>1.6){b.st='fly';b.t=0;b.cd=1.1;b.done=0}break;
    case'fall':b.z=Math.max(0,b.z-dt*420);if(b.z<=0){b.st='ground';b.t=0;b.gd=P2?3.8:4.6;sfx('slam');G.shake=16;bursts(b.x,b.y,50,['#d8b878','#c9a26a','#fff'],{sp:260,g:300});toast('⬇ 아즈라크가 추락했다 — 지금이다!','gold')}break;
    case'ground':if(Math.random()<.2)bursts(b.x+rnd(-40,40),b.y-rnd(20,60),2,['#ffe066'],{sp:40});if(b.t>=b.gd){b.st='takeoff';b.t=0;tele({k:'circle',x:b.x,y:b.y,r:88,dur:.7,owner:b})}break;
    case'takeoff':if(b.t>.7&&!b.done){b.done=1;sfx('wave');G.shake=8;if(Math.hypot(pl.x-b.x,pl.y-b.y)<88){hurt(3,b.x,b.y)}for(let i=0;i<30;i++){const a=Math.random()*7;G.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*300,vy:Math.sin(a)*180,life:.6,max:.6,col:'#e8c888',size:4,round:1,shrink:1})}}b.z=Math.min(120,b.z+dt*(b.t>.7?260:0));if(b.t>1.3){b.st='fly';b.t=0;b.cd=1.2;b.done=0}break}}
function azStart(b,k){b.st=k;b.t=0;b.done=0;const P2=b.phase===2,pl=G.pl;if(k==='aim'){b.wd=P2?.7:.95;b.la=Math.atan2(pl.y-b.y,pl.x-b.x);b.tl=tele({k:'line',x:b.x,y:b.y,a:b.la,len:440,w:60,dur:b.wd,owner:b})}if(k==='spit')b.cd=0}
function fireBeam(p,b){sfx('beam');G.shake=10;G.flash={col:'#ffe08a',a:.35};const t0=G.t,sx=p.x,sy=p.y-70;
  G.fxs.push({t0,dur:.6,draw(c,q){c.save();c.globalCompositeOperation='lighter';const ex=b.x,ey=b.y-(b.z||0)-20;for(const[w,a]of[[22,.25],[10,.5],[4,1]]){c.strokeStyle=`rgba(255,230,140,${a*(1-q)})`;c.lineWidth=w;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke()}c.restore()}});
  clearTele(b);b.st='fall';b.t=0;b.chain=0;b.flash=.3;fpop(b.x,b.y-b.z-60,'명중!','#ffe08a',1);bursts(b.x,b.y-b.z,40,['#ffe08a','#fff'],{glow:1,sp:300})}

function drawFB(b,x,y,t){if(b.st==='sleep'&&b.kind!=='velos'&&b.kind!=='gorgon')return;ctx.save();if(b.fade!==undefined)ctx.globalAlpha=b.fade;
  if(b.kind==='gorgon')drawGorgon(b,x,y,t);else if(b.kind==='azrak')drawAzrak(b,x,y,t);else if(b.kind==='velos')drawVelos(b,x,y,t);
  if(b.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.45;if(b.kind==='gorgon')drawGorgon(b,x,y,t);else if(b.kind==='azrak')drawAzrak(b,x,y,t);else drawVelos(b,x,y,t)}
  ctx.restore();
  if(b.st==='stun'||b.st==='ground'){const hy=b.kind==='azrak'?y-70:y-150;for(let i=0;i<3;i++){const a=t*5+i*2.1;ctx.fillStyle='#ffe066';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('★',x+Math.cos(a)*30,hy+Math.sin(a)*8)}}}
function drawGorgon(b,x,y,t,X){X=X||ctx;const s=170,sl=b.st==='sleep';X.save();X.translate(x,y);if(b.face<0)X.scale(-1,1);if(b.st==='stun')X.rotate(Math.sin(t*20)*.02);
  if(sl){X.scale(1,.8);X.translate(0,10)}
  SPR.garen(X,s,t*(sl?.2:1),['#5d4a3c','#b8a080'],{raise:b.raise||0});
  // rock armor plates
  const cracked=b.st==='stun';for(const[px,py,r]of[[-30,-110,30],[6,-122,34],[38,-104,26],[-12,-84,24],[24,-80,22]]){X.fillStyle=cracked?'#5a5450':'#7a7068';X.beginPath();X.ellipse(px,py,r,r*.62,.2,0,7);X.fill();X.fillStyle=cracked?'#47423e':'#958b82';X.beginPath();X.ellipse(px-r*.2,py-r*.2,r*.55,r*.3,.2,0,7);X.fill();
    if(cracked){X.strokeStyle='#ff9a3a';X.lineWidth=2;X.beginPath();X.moveTo(px-r*.5,py-r*.2);X.lineTo(px,py+r*.1);X.lineTo(px+r*.4,py-r*.3);X.stroke()}}
  if(!sl){X.fillStyle=b.phase===2?'#ff4020':'#ffb030';X.shadowColor=X.fillStyle;X.shadowBlur=12;X.beginPath();X.arc(52,-96,4,0,7);X.fill()}
  X.restore()}
function drawAzrak(b,x,y,t,X){X=X||ctx;const z=b.z||0,P2=b.phase===2,fl=b.flap||0;
  X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(x,y,70*(1-Math.min(.5,z/400)),18,0,0,7);X.fill();
  X.save();X.translate(x,y-z-30);if(b.face<0)X.scale(-1,1);const gr=b.st==='ground';const wa=gr?.1:Math.sin(fl)*.9;
  const body=P2?'#b8783a':'#c9a26a',dark=P2?'#7a4a1a':'#8a6a3a',mem=P2?'rgba(200,90,40,.85)':'rgba(220,180,110,.85)';
  for(const sd of[-1,1]){X.save();X.scale(1,1);X.rotate(sd*.05);X.fillStyle=mem;X.beginPath();X.moveTo(-6,-10);const wy=-60*Math.cos(wa)*(sd<0?1:.8),wx=110;X.quadraticCurveTo(-30,wy-30,-wx*.9+sd*10,wy);X.lineTo(-wx*.5,wy*.3+10);X.lineTo(-wx*.2,wy*.1+14);X.lineTo(10,0);X.closePath();X.globalAlpha=sd<0?.75:1;X.fill();X.strokeStyle=dark;X.lineWidth=3;X.beginPath();X.moveTo(-6,-10);X.quadraticCurveTo(-30,wy-30,-wx*.9+sd*10,wy);X.stroke();X.restore()}
  X.fillStyle=dark;X.beginPath();X.moveTo(-40,4);X.quadraticCurveTo(-90,20+Math.sin(t*3)*8,-120,4+Math.sin(t*3)*12);X.lineTo(-40,14);X.fill();
  X.fillStyle=body;X.beginPath();X.ellipse(0,0,46,22,0,0,7);X.fill();X.fillStyle='#e8d0a0';X.beginPath();X.ellipse(4,8,30,10,0,0,7);X.fill();
  X.strokeStyle=body;X.lineWidth=14;X.lineCap='round';X.beginPath();X.moveTo(30,-6);X.quadraticCurveTo(54,-30,62,-40);X.stroke();X.lineCap='butt';
  X.fillStyle=body;X.beginPath();X.moveTo(56,-50);X.lineTo(96,-38);X.lineTo(60,-30);X.closePath();X.fill();X.fillStyle=dark;X.beginPath();X.moveTo(56,-50);X.lineTo(40,-70);X.lineTo(64,-48);X.fill();
  X.fillStyle=P2?'#ff3020':'#ffcc33';X.shadowColor=X.fillStyle;X.shadowBlur=12;X.beginPath();X.arc(70,-44,4,0,7);X.fill();X.shadowBlur=0;
  if(b.st==='spit'&&b.t<.6){X.globalCompositeOperation='lighter';X.fillStyle=`rgba(255,200,100,${b.t})`;X.beginPath();X.arc(94,-38,10+b.t*14,0,7);X.fill()}
  X.restore()}
function drawVelos(b,x,y,t,X){X=X||ctx;const s=104;X.save();X.translate(x,y);const fx=Math.cos(b.fa||0)>=0?1:-1;

    ctx.fillStyle='#7a5a32';ctx.fillRect(x-4,y-24,8,20);const b2=Math.sin(t*3)*2,cy2=y-62+b2;if(on||o.st==='ready'){const g=ctx.createRadialGradient(x,cy2,2,x,cy2,40);g.addColorStop(0,`rgba(255,230,140,${.3+ch*.6})`);g.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=g;ctx.fillRect(x-40,cy2-40,80,80)}

    if(!won){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,60,40,${.18+Math.sin(t*3)*.08})`;ctx.beginPath();ctx.ellipse(X+w/2,Y+o.h*TS-10,w*.35,16,0,0,7);ctx.fill();ctx.restore()}break}

function updLair(dt){const b=G.fb,pl=G.pl;if(!b)return;
  if(b.st==='sleep'&&pl.y<19*TS&&!G.cut&&!G.dead)fbIntro();
  if(!b.fight||G.cut||b.st==='dying')return;
  if(b.kind==='gorgon')gorgonUpdate(b,dt);else if(b.kind==='azrak')azrakUpdate(b,dt);
  const d=Math.hypot(pl.x-LC.x,(pl.y-LC.y)*1.15);if(d>11.4*TS&&pl.y<20*TS){const a=Math.atan2(pl.y-LC.y,pl.x-LC.x);pl.x=LC.x+Math.cos(a)*11*TS;pl.y=LC.y+Math.sin(a)*11*TS/1.15}}

  const nm={1:'별의 시계탑',2:'바람의 수로',3:'수호의 제단'}[n];banner('고대 장치 복구!',`${nm} — ${(f.dev1?1:0)+(f.dev2?1:0)+(f.dev3?1:0)} / 3`);await wait(1600);G.camFocus=null;

function velosBlocks(b){if(!['walk','bash','aimL','idle'].includes(b.st))return false;const a=Math.atan2(G.pl.y-b.y,G.pl.x-b.x);return adiff(a,b.fa)<1.15}
function velosStart(b,k){const P2=b.phase===2,pl=G.pl;b.st=k;b.t=0;b.done=0;clearTele(b);
  if(k==='combo'){b.n=0;b.wd=P2?.36:.5;b.fa=Math.atan2(pl.y-b.y,pl.x-b.x);tele({k:'sector',x:b.x,y:b.y-10,r:90,a:b.fa,half:1.0,dur:b.wd,owner:b})}

  if(k==='ghost'){sfx('dark');for(let i=0;i<5;i++){const a=Math.random()*7,r=i?rnd(50,150):0;dropRock(pl.x+Math.cos(a)*r,pl.y+Math.sin(a)*r*.7,1.0+i*.1,4,'ghost')}}}
function velosUpdate(b,dt){const pl=G.pl,P2=b.phase===2,dx=pl.x-b.x,dy=pl.y-b.y,dist=Math.hypot(dx,dy)||1;b.t+=dt;b.cd-=dt;if(b.flash>0)b.flash-=dt;
  const turn=(rate)=>{const ta=Math.atan2(dy,dx);let d=ta-b.fa;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;b.fa+=clamp(d,-rate*dt,rate*dt)};
  switch(b.st){

      if(b.cd<=0){if(P2&&Math.random()<.25)velosStart(b,'ghost');else if(dist<82)velosStart(b,Math.random()<.72?'combo':'bash');else if(dist>140)velosStart(b,'aimL')}break;
    case'combo':if(b.t>=b.wd){sfx('swing');slashFx(b.x,b.y-30,90,b.fa,'#7ff0ff');if(inSector(pl,b.x,b.y-10,90,b.fa,1.0))hurt(5,b.x,b.y);moveE(b,Math.cos(b.fa)*26,Math.sin(b.fa)*26,b.r);b.n++;
        if(b.n<3){b.t=0;b.wd=P2?.3:.42;b.fa=Math.atan2(pl.y-b.y,pl.x-b.x);tele({k:'sector',x:b.x,y:b.y-10,r:90,a:b.fa,half:1.0,dur:b.wd,owner:b})}else if(P2&&Math.random()<.45)velosStart(b,'aimL');else{b.st='rec';b.t=0;b.rd=.8}}break;
    case'aimL':if(b.t<b.wd*.5){b.la=Math.atan2(dy,dx);b.fa=b.la;b.tl.a=b.la;b.tl.len=Math.min(380,rayLen(b.x,b.y-8,b.la,380))}if(b.t>=b.wd){b.st='lunge';b.t=0;sfx('dash')}break;
    case'lunge':{const hit=moveE(b,Math.cos(b.la)*640*dt,Math.sin(b.la)*640*dt,b.r);if(Math.random()<.7)G.parts.push({x:b.x,y:b.y-30,vx:0,vy:0,life:.3,max:.3,col:P2?'#a060ff':'#7ff0ff',size:8,round:1,glow:1,shrink:1});
      if(!b.done&&Math.hypot(pl.x-b.x,pl.y-b.y)<34){b.done=1;hurt(6,b.x,b.y)}if(hit||b.t>.5){b.st='rec';b.t=0;b.rd=P2?.9:1.2;if(hit){G.shake=8;sfx('slam')}}break}
    case'bash':if(b.t>=b.wd&&!b.done){b.done=1;sfx('slam');G.shake=6;const bx=b.x+Math.cos(b.fa)*28,by=b.y+Math.sin(b.fa)*18;if(Math.hypot(pl.x-bx,pl.y-by)<70&&hurt(4,bx,by)){pl.kbx*=1.6;pl.kby*=1.6}}if(b.t>b.wd+.3){b.st='rec';b.t=0;b.rd=.5}break;
    case'ghost':turn(2);if(b.t>1.2){b.st='walk';b.t=0;b.cd=.6}break;
    case'rec':if(b.t>=b.rd){b.st='walk';b.t=0;b.cd=P2?.35:.8}break}
  const d=Math.hypot(b.x-VC.x,b.y-VC.y),R=7.4*TS;if(d>R){b.x=VC.x+(b.x-VC.x)/d*R;b.y=VC.y+(b.y-VC.y)/d*R}}

function nextHop(from,to){if(from===to)return null;const prev={[from]:null},q=[from];while(q.length){const a=q.shift();for(const b in GRAPH[a]||{}){if(b in prev)continue;prev[b]=a;q.push(b)}}if(!(to in prev))return null;let c=to;while(prev[c]!==from)c=prev[c];return GRAPH[from][c]}

/* ===================== INPUT ===================== */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'ok',Space:'ok',KeyJ:'ok',Enter:'ok',NumpadEnter:'ok',KeyE:'ok',KeyX:'roll',KeyK:'roll',ShiftLeft:'roll',ShiftRight:'roll',Escape:'menu',Tab:'menu',KeyI:'menu',KeyM:'map',KeyQ:'potion',KeyH:'help',F1:'help'};
function act(a){
  if(G.skipper&&(a==='ok'||a==='roll'||a==='menu'||a==='map')){const f=G.skipper;G.skipper=null;f();return}
  if(G.dlg&&!focus.length)return;
  const m=topM();if(m){m.handle(a==='roll'||a==='menu'||a==='map'?'cancel':a);return}
  if(G.mode!=='play'||G.lock||G.cut||G.dead)return;
  if(a==='ok'){const e=interactTarget();if(e){interact(e);return}startSwing()}
  else if(a==='help')openHelp();else if(a==='roll')doRoll();else if(a==='potion')drinkPotion();else if(a==='menu')openPause();else if(a==='map')openWorldMap()}
function release(){const pl=G.pl;atkHeld=false;if(pl.charge>=.7&&!pl.sw&&!G.cut&&!G.lock&&G.mode==='play')startSpin();pl.charge=0}
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return}auInit();const a=KEYMAP[e.code];if(!a)return;e.preventDefault();
  if(DIRS[a]){if(!held.includes(a))held.push(a)}if(a==='ok'&&!e.repeat)atkHeld=true;if(e.repeat&&!DIRS[a])return;if(DIRS[a]&&!focus.length)return;act(a)});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(!a)return;if(DIRS[a]){const i=held.indexOf(a);if(i>=0)held.splice(i,1)}if(a==='ok')release()});
addEventListener('blur',()=>{held.length=0;atkHeld=false});
addEventListener('pointerdown',()=>auInit(),{capture:true});
document.querySelectorAll('#dpad div').forEach(el=>{const d=el.dataset.d;let rep=null;
  const on=e=>{e.preventDefault();if(!held.includes(d))held.push(d);if(focus.length){act(d);clearInterval(rep);rep=setInterval(()=>act(d),200)}};const off=()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1);clearInterval(rep)};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off)});
document.querySelectorAll('.tb').forEach(el=>{el.addEventListener('pointerdown',e=>{e.preventDefault();const a=el.dataset.a;if(a==='ok')atkHeld=true;act(a)});if(el.dataset.a==='ok'){el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release)}});

/* ===================== MAP FLOW ===================== */
async function enterMap(id,x,y,dir,skipFade){G.lock++;if(!skipFade)await fadeOut();const m=MAPS[id],first=G.map!==m;G.map=m;G.p.map=id;
  Object.assign(G.pl,{x,y,dir:dir||G.pl.dir,sw:null,roll:null,kbx:0,kby:0,charge:0,pose:null});G.cutB=new Set();G.ents=mkObjs(id);G.proj=[];G.tele=[];G.waves=[];G.falls=[];G.parts=[];G.amb=[];G.pops=[];G.fxs=[];G.boss=null;G.bossBar=0;G.shr=null;G.camFocus=null;
  G.worm=null;G.fb=null;G.drops=[];G.torn=[];G.stormT=0;G.storm=0;G.slow=1;G.beamPts=null;G.tb=null;G.dz=null;
  if(id==='shrine')initShrine();if(id==='desert')initDesert();if(id==='tomb')initTomb();initCh3(id);for(let i=0;i<(m.count||0);i++)spawnMob();G.dark=G.darkT=m.dark;G.mode='play';G.camSnap=1;buildRects();camera(0);music(m.bgm);G.pl.inv=1;saveGame();await fadeIn();
  if(first)banner(m.name,m.sub);unlock()}
async function newGame(){G.p=newPlayer();recalcHearts();G.p.hp=maxHp();G.lock++;await fadeOut();G.mode='intro';music('title');await fadeIn();
  await say('',['아득한 옛날, 이 땅은 고대 수호자들이 지키는 빛의 왕국이었다.','세월이 흘러 수호자들은 잠들었고, 그들의 사당은 숲속 깊이 잊혀졌다.','그리고 지금— 마물이 깨어나는 시대에, 한 젊은이가 눈을 뜬다.']);
  await fadeOut();G.lock=0;await enterMap('village',20*TS+16,11*TS+20,'up',true);await wait(300);G.lock++;
  await say('','💡 방향키(WASD)로 이동 · Z로 대화/베기 · X로 구르기 · Q로 회복약 · Esc 일시정지\n먼저 앞에 있는 촌장(머리 위 「!」)과 이야기해 보자.');unlock()}

/* ===================== LOOP ===================== */
let last=performance.now();
function update(dt){G.t+=dt;if(G.flash){G.flash.a-=dt*1.6;if(G.flash.a<=0)G.flash=null}if(G.hurtFlash>0)G.hurtFlash-=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.life-=dt;p.y-=dt*(p.big?32:44);if(p.life<=0)G.pops.splice(i,1)}
  updParts(G.parts,dt);updParts(G.amb,dt);
  if(G.mode!=='play'||!G.map)return;const paused=G.lock>0||focus.length>0||G.dlg||G.reel;G.dark=lerp(G.dark,G.darkT,Math.min(1,dt*2.2));
  if(paused)return;if(G.hitstop>0){G.hitstop-=dt;return}
  G.p.time+=dt;buildRects();updPlayer(dt);
  for(const e of G.ents){if(e.gone)continue;if(e.type==='mob')mobAI(e,dt);else if(e.type==='pick')updPick(e,dt)}
  G.ents=G.ents.filter(e=>!e.gone||e.type==='ore'&&false);
  if(G.boss)bossUpdate(G.boss,dt);updProj(dt);updWaves(dt);updShrine(dt);updSdoor(dt);updDesert(dt);updTomb(dt);updCh3(dt);updTips(dt);
  if(G.map.count&&!G.cut){G.resp=(G.resp||0)+dt;if(G.resp>16){G.resp=0;if(G.ents.filter(e=>e.type==='mob').length<G.map.count)spawnMob()}}
  ambSpawn2(dt);if((G.asave=(G.asave||0)+dt)>30){G.asave=0;saveGame()}
  if(G.lvq>0&&!G.cut&&!G.dead)openLevelUp()}
function ambSpawn2(dt){const m=G.map,A=G.amb;if(A.length>60)return;const cx=G.cam.x,cy=G.cam.y;
  if(m.amb==='firefly'&&Math.random()<dt*5)A.push({x:cx+rnd(0,W),y:cy+rnd(0,H),vx:rnd(-10,10),vy:rnd(-12,-2),life:4,max:4,col:'#d9ff7a',size:2.5,round:1,glow:1,wob:2,ph:Math.random()*9});
  if(m.amb==='petal'&&Math.random()<dt*2.5)A.push({x:cx+rnd(0,W),y:cy-5,vx:rnd(10,30),vy:rnd(18,32),life:12,max:12,col:pick(['#ffc0d8','#ffe0ec','#fff']),size:3,wob:2,ph:Math.random()*9});
  if(m.amb==='dust'&&Math.random()<dt*4)A.push({x:cx-5,y:cy+rnd(0,H),vx:rnd(40,90),vy:rnd(-5,5),life:9,max:9,col:'rgba(220,180,130,.5)',size:2,wob:1,ph:Math.random()*9});
  if(m.amb==='mote'&&Math.random()<dt*6)A.push({x:cx+rnd(0,W),y:cy+rnd(0,H),vx:rnd(-5,5),vy:rnd(-15,-4),life:5,max:5,col:G.boss&&G.boss.phase===2?'#ff6060':'#8fe8ff',size:2,round:1,glow:1,wob:1.5,ph:Math.random()*9})}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);
    if(G.mode==='play'&&G.map)drawWorld(dt);else{ctx.fillStyle='#05040f';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,500);g.addColorStop(0,'rgba(74,216,255,.12)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
async function init(){ctx.imageSmoothingEnabled=false;try{const s=JSON.parse(localStorage.getItem('tryrpg-set-v1')||'null');if(s)Object.assign(G.set,s)}catch(e){}
  genTex();buildMaps();try{await Promise.race([document.fonts.ready,wait(1200)])}catch(e){}requestAnimationFrame(frame);
  const sv=loadSave();if(sv){G.p=sv.p;for(const k of['flags','quests','kills','inv'])G.p[k]=G.p[k]||{};recalcHearts();if(G.p.flags.shrineClear)G.p.flags.fb1=1;if(G.p.flags.tombOpen||G.p.flags.tombClear)G.p.flags.fb2=1;if(G.p.hp<=0)G.p.hp=maxHp();G.pl.stam=G.p.mstam;
    const m=MAPS[G.p.map]&&G.p.map!=='shrine'?G.p.map:'wood';const x=G.p.map==='shrine'?25*TS+16:G.p.x,y=G.p.map==='shrine'?4*TS+20:G.p.y;await enterMap(m,x,y,G.p.dir,true);toast(`📖 Lv.${G.p.lv} ${G.p.name}의 모험을 이어갑니다`)}
  else{if(needReel()){G.mode='intro';await fadeIn();await showReel()}await newGame();return}
  if(needReel())await showReel()}
init();
</script>
</body></html>
