<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>당구 마스터 3D</title>
<meta name="description" content="실제 같은 3D 당구. 포켓볼 · 4구 · 3구(3승 해금), AI 대전 · 2인 · 온라인">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--fg:#f2f4f8;--muted:#9aa4b5;--card:rgba(20,24,32,.82);--line:rgba(255,255,255,.12);--gold:#ffd166;--good:#3ddc84;--bad:#ff5a5f;--acc:#4ea8ff;--display:"Black Han Sans",sans-serif;--body:"IBM Plex Sans KR",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07080b;color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:16px;background:linear-gradient(180deg,#7cc0ff,#4ea8ff);color:#06121f;box-shadow:0 4px 0 #1f6fc0,0 8px 18px rgba(0,0,0,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f6fc0}
.btn.alt{background:linear-gradient(180deg,#323b4c,#242b38);color:var(--fg);box-shadow:0 4px 0 #0c1017,0 8px 18px rgba(0,0,0,.4)}
.btn.good{background:linear-gradient(180deg,#7af0ab,#3ddc84);color:#04210f;box-shadow:0 4px 0 #1c8a4c}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
/* 메뉴 */
#menu{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(1000px 600px at 50% -10%,rgba(78,168,255,.18),transparent),linear-gradient(180deg,rgba(5,7,10,.55),rgba(5,7,10,.92));display:flex;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
#menu .in{width:min(640px,100%);display:grid;gap:14px;align-content:start}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,64px);margin:6px 0 0;text-align:center;letter-spacing:.02em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
h1 small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:4px}
.sec{font-weight:700;color:var(--muted);font-size:13px;margin:6px 2px -4px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 10px;background:var(--card);backdrop-filter:blur(8px);display:grid;justify-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 #0c1017}
.mode .ic{font-size:34px;line-height:1}.mode b{font-size:16px}.mode small{color:var(--muted);font-size:11.5px;line-height:1.35}
.mode.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(36,64,106,.9),rgba(26,44,71,.9));box-shadow:0 5px 0 #1f6fc0,0 0 22px rgba(78,168,255,.35)}
.mode.lock{opacity:.55}.mode .lk{position:absolute;top:6px;right:8px;font-size:12px;font-weight:700;color:var(--gold)}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.diff{display:flex;gap:8px;justify-content:center}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px}
input[type=text]{background:#0f131b;border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:11px 12px;font:inherit;font-size:17px;text-transform:uppercase;letter-spacing:.15em;text-align:center;width:100%}
.stat{display:flex;justify-content:center;gap:16px;color:var(--muted);font-weight:700;font-size:13px}
.stat b{color:var(--fg)}
/* 게임 화면 */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;justify-content:center;pointer-events:none}
.sb{display:flex;align-items:stretch;gap:6px;background:rgba(10,12,16,.72);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pl{display:grid;grid-template-columns:auto auto;align-items:center;gap:0 8px;padding:4px 10px;border-radius:11px;min-width:118px}
.pl.on{background:linear-gradient(180deg,rgba(78,168,255,.35),rgba(78,168,255,.12));box-shadow:inset 0 0 0 1px rgba(124,192,255,.6)}
.pl .nm{font-weight:700;font-size:13px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{grid-row:span 2;font-family:var(--display);font-size:28px;line-height:1}
.pl .sub{font-size:11px;color:var(--muted);font-weight:700}
.vs{display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:700;padding:0 2px}
#topBtns{position:fixed;top:calc(74px + env(safe-area-inset-top));left:10px;z-index:11;display:flex;gap:6px}
#topBtns2{position:fixed;top:calc(74px + env(safe-area-inset-top));right:10px;flex-direction:column;z-index:11;display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(10,12,16,.7);backdrop-filter:blur(6px);font-size:19px;display:grid;place-items:center;text-decoration:none;color:var(--fg)}
#msg{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);z-index:12;font-family:var(--display);font-size:clamp(28px,8vw,52px);text-align:center;opacity:0;pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.7);transition:all .25s;white-space:nowrap}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#msg small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:#dfe6f2}
#tip{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:rgba(10,12,16,.72);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
/* 조작 */
#ctrl{position:fixed;left:0;right:0;bottom:0;top:0;z-index:10;pointer-events:none;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
#spinBox{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;display:grid;justify-items:center;gap:4px}
#spinBall{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8e8e2 45%,#b9b9b2 100%);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 -6px 12px rgba(0,0,0,.18);position:relative;touch-action:none}
#spinBall::before,#spinBall::after{content:"";position:absolute;background:rgba(0,0,0,.12)}
#spinBall::before{left:50%;top:8%;bottom:8%;width:1px}#spinBall::after{top:50%;left:8%;right:8%;height:1px}
#spinDot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#e03131;box-shadow:0 0 0 3px rgba(224,49,49,.3)}
#spinBox small{font-size:11px;font-weight:700;color:var(--muted);background:rgba(10,12,16,.6);border-radius:8px;padding:2px 6px}
#powBox{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;display:grid;justify-items:center;gap:4px}
#powBar{width:64px;height:min(40vh,260px);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
#powFill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,#3ddc84,#ffd166 55%,#ff5a5f);opacity:.9}
#powCue{position:absolute;left:50%;top:6px;width:10px;margin-left:-5px;height:calc(100% - 12px);border-radius:5px;background:linear-gradient(90deg,#c69a5b,#f0d5a5,#a67a3c);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#powCue::before{content:"";position:absolute;left:0;right:0;bottom:-2px;height:10px;border-radius:5px 5px 3px 3px;background:#3b6fd8}
#powTxt{font-size:12px;font-weight:800;background:rgba(10,12,16,.6);border-radius:8px;padding:2px 6px}
#powBox small{font-size:11px;font-weight:700;color:var(--muted)}
#fine{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#fine .ib{width:52px;height:46px;font-size:18px;font-weight:800}
#placeBar{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:flex;gap:8px;align-items:center}
/* 결과 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,7,10,.72);display:grid;place-items:center;padding:16px}
.mbox{width:min(440px,100%);background:#141922;border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
#think{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);z-index:11;background:rgba(10,12,16,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
#tray{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;display:flex;gap:3px;pointer-events:none}
#tray i{width:16px;height:16px;border-radius:50%;box-shadow:inset -2px -2px 4px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:50;background:rgba(20,24,32,.95);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700}

#hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(6px + env(safe-area-inset-top)) 8px 0;display:flex;justify-content:center;align-items:stretch;gap:6px;pointer-events:none}
.pc{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(34,38,48,.92),rgba(18,20,26,.92));border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:5px 6px 5px 10px;min-width:0;flex:0 1 230px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pc.r{padding:5px 10px 5px 6px}
.pc.on{border-color:#e9eef7;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.45)}
.pc .av{width:46px;height:46px;border-radius:10px;background:linear-gradient(180deg,#3a4152,#232834);display:grid;place-items:center;font-size:28px;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.pc .info{display:grid;gap:4px;min-width:0;flex:1}
.pc .nrow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pc .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .grp{font-size:11px;font-weight:700;color:#c9d2e0;white-space:nowrap}
.pc .balls{display:flex;gap:3px;justify-content:flex-end}
.pc.r .balls{justify-content:flex-start}
.pc .balls i{width:17px;height:17px;border-radius:50%;flex:0 0 auto;border:1.5px solid rgba(255,255,255,.12);box-shadow:inset -2px -2px 4px rgba(0,0,0,.35)}
.pc .balls i.e{background:rgba(0,0,0,.35)}
.pc .balls b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.coin{display:grid;justify-items:center;align-content:center;background:linear-gradient(180deg,rgba(34,38,48,.92),rgba(18,20,26,.92));border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:4px 10px;min-width:58px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.coin span{font-size:22px;line-height:1}.coin b{font-size:14px;color:var(--gold)}.coin small{font-size:10px;color:var(--muted);font-weight:700}
#powBox{left:10px;right:auto!important;top:calc(84px + env(safe-area-inset-top));bottom:auto!important}
#powBar{width:46px!important;height:min(52vh,300px)!important;border-radius:12px!important;background:linear-gradient(180deg,#1b1f27,#101318)!important;border:2px solid rgba(255,255,255,.12)!important}
#powBar .ticks{position:absolute;inset:8px 6px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 1px,transparent 1px 10%);pointer-events:none;mask:linear-gradient(90deg,#000 22%,transparent 22% 78%,#000 78%);-webkit-mask:linear-gradient(90deg,#000 22%,transparent 22% 78%,#000 78%)}
#powFill{background:linear-gradient(180deg,rgba(61,220,132,.5),rgba(255,209,102,.6) 55%,rgba(255,90,95,.7))!important}
#powTxt{font-size:13px!important;padding:3px 8px!important}
#spinBox{left:auto!important;right:14px;bottom:calc(12px + env(safe-area-inset-bottom))}
#spinBall{width:96px!important;height:96px!important}
#spinBall::before,#spinBall::after{display:none}
#spinDot{width:22px!important;height:22px!important;margin:-11px 0 0 -11px!important;background:transparent!important;border:3px solid #e03131;box-shadow:0 0 6px rgba(224,49,49,.5)!important}
#spinBall .up{position:absolute;left:50%;top:6px;transform:translateX(-50%);color:#e03131;font-size:11px}
#fine{display:none!important}
body.v3d #fine{display:flex!important}
#topBtns,#topBtns2{top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom))}
#topBtns{left:14px!important;flex-direction:row}
#topBtns2{right:124px!important;flex-direction:row!important}
#tip{bottom:calc(16px + env(safe-area-inset-bottom))!important;top:auto}
#tray{display:none!important}
#think{top:calc(72px + env(safe-area-inset-top))!important}
@media (max-width:520px){.pc .av{width:36px;height:36px;font-size:22px}.pc .balls i{width:12px;height:12px}.pc .nm{font-size:12px}.pc .grp{display:none}#tip{bottom:calc(120px + env(safe-area-inset-bottom))!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden><div class="pc" id="p0"><div class="info"><div class="nrow"><small class="grp"></small><b class="nm"></b></div><div class="balls"></div></div><div class="av"></div></div><div class="coin"><span>🪙</span><b id="coins">0</b><small id="goal"></small></div><div class="pc r" id="p1"><div class="av"></div><div class="info"><div class="nrow"><b class="nm"></b><small class="grp"></small></div><div class="balls"></div></div></div></div>
<div id="tray" hidden></div>
<div id="topBtns" hidden><button class="ib" id="bMenu" aria-label="메뉴">☰</button></div>
<div id="topBtns2" hidden><button class="ib" id="bView" aria-label="시점 바꾸기">🎥</button><button class="ib" id="bGuide" aria-label="가이드">📏</button></div>
<div id="think" hidden>🤖 생각 중…</div>
<div id="msg"></div>
<div id="tip" hidden></div>
<div id="ctrl" hidden>
  <div id="spinBox"><div id="spinBall"><span class="up">▲</span><div id="spinDot"></div></div></div>
  <div id="fine"><button class="ib" id="bL">◀</button><button class="ib" id="bR">▶</button></div>
  <div id="powBox"><span id="powTxt">0%</span><div id="powBar"><div id="powFill"></div><div id="powCue"></div><div class="ticks"></div></div></div>
</div>
<div id="placeBar" hidden><span class="card" style="padding:8px 12px;font-weight:700;font-size:13px">✋ 수구를 끌어서 놓으세요</span><button class="btn good sm" id="bPlace">여기에 놓기</button></div>
<div id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<div id="menu">
 <div class="in">
  <h1>🎱 당구 마스터 3D<small>실제처럼 치는 3D 당구</small></h1>
  <div class="stat"><span>🪙 <b id="stC">0</b></span><span>승리 <b id="stW">0</b></span><span>패배 <b id="stL">0</b></span><span>최고 연속 <b id="stS">0</b></span></div>
  <div class="sec">게임 종류</div>
  <div class="modes">
   <button class="mode" data-mode="pool"><span class="ic">🎱</span><b>포켓볼</b><small>공 15개를 구멍에!<br>8번 공은 마지막에</small></button>
   <button class="mode" data-mode="four"><span class="ic">🔴</span><b>4구</b><small>내 공으로 빨간 공<br>2개를 다 맞히기</small></button>
   <button class="mode" data-mode="three"><span class="lk" id="lk3"></span><span class="ic">🟡</span><b>3구</b><small>쿠션 3번 맞고<br>공 2개 맞히기</small></button>
  </div>
  <div class="sec">상대</div>
  <div class="opps">
   <button class="mode" data-opp="ai"><span class="ic">🤖</span><b>AI</b><small>컴퓨터와 대결</small></button>
   <button class="mode" data-opp="local"><span class="ic">👥</span><b>2인</b><small>한 폰으로 번갈아</small></button>
   <button class="mode" data-opp="online"><span class="ic">🌐</span><b>온라인</b><small>친구 코드로 대결</small></button>
  </div>
  <div id="aiOpt" class="card"><div class="sec" style="margin:0 0 8px">AI 실력</div><div class="diff"><button class="btn sm alt" data-diff="0">🙂 쉬움</button><button class="btn sm alt" data-diff="1">😎 보통</button><button class="btn sm alt" data-diff="2">🔥 어려움</button></div></div>
  <div id="onOpt" class="card" hidden>
   <div style="display:grid;gap:10px">
    <div>내 코드 <b id="myCode" style="font-size:20px;letter-spacing:.15em;color:var(--gold)"></b></div>
    <button class="btn" id="bHost">🏠 방 만들기 (친구가 내 코드로 들어와요)</button>
    <div style="display:flex;gap:8px"><input type="text" id="joinCode" maxlength="6" placeholder="친구 코드"><button class="btn good" id="bJoin" style="white-space:nowrap">참가</button></div>
    <div id="onMsg" class="muted" style="font-size:13px;color:var(--muted)"></div>
   </div>
  </div>
  <button class="btn" id="bStart" style="font-size:20px;padding:16px">▶ 게임 시작</button>
  <a class="btn alt" href="../hub/" style="text-align:center;text-decoration:none">🏠 허브로</a>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const T=THREE;

/* ======================= 저장 ======================= */
const SK='billiards_v1';
let SAVE={w:0,l:0,streak:0,best:0,mode:'pool',opp:'ai',diff:1,guide:1};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SK)||'{}'));}catch(e){}
const saveS=()=>{try{localStorage.setItem(SK,JSON.stringify(SAVE));}catch(e){}};

/* ======================= 테이블 규격 =======================
   단위: 미터. 테이블 가운데가 (0,0), x = 긴 쪽, z = 짧은 쪽, y = 위 */
const TABLES={
  pool:{W:2.54,H:1.27,R:.028575,cloth:'#0b5ad4',rail:'#0a4cb3',mus:.2,mur:.012,musp:9,ecu:.75,eb:.95,pockets:true,cush:.12},
  carom:{W:2.844,H:1.422,R:.03075,cloth:'#0b52c4',rail:'#0944a6',mus:.2,mur:.0085,musp:7,ecu:.8,eb:.95,pockets:false,cush:.13},
};
function buildTableGeo(TB){const W=TB.W,H=TB.H;const segs=[],pockets=[];
  if(TB.pockets){const cg=.11,sg=.068;
    pockets.push({x:-W/2-.012,z:-H/2-.012,r:.068},{x:W/2+.012,z:-H/2-.012,r:.068},{x:-W/2-.012,z:H/2+.012,r:.068},{x:W/2+.012,z:H/2+.012,r:.068},{x:0,z:-H/2-.035,r:.062},{x:0,z:H/2+.035,r:.062});
    const add=(ax,az,bx,bz)=>segs.push({ax,az,bx,bz});
    // 긴 쿠션 (위·아래) — 가운데 구멍에서 끊겨요
    for(const s of [-1,1]){add(-W/2+cg,s*H/2,-sg,s*H/2);add(sg,s*H/2,W/2-cg,s*H/2);

function simShot(B0,cueI,dir,pow,a,b,maxT=12){const B=B0.map(x=>({...x}));const S={first:null,hits:[],cush:0,cushBefore:[],pocketed:[],scratch:false};

  if(NET.role==='host'&&r.g&&r.st==='wait'){const first=Math.random()<.5?0:1;nreq(NET.room,'PATCH',{st:'play',start:{mode:NET.mode,first,hn:r.h.nick,gn:r.g.nick,n:Date.now()}}).catch(()=>{});}
  if(r.start&&!NET.started){NET.started=r.start.n;NET.seen={};const s=r.start;SAVE.mode=s.mode;
    newGame(s.mode,'online',1,{names:[s.hn,s.gn],hostSide:NET.role==='host'?0:1,first:s.first});say('🌐 온라인 대결 시작!',`${s.hn} vs ${s.gn}`,1800);}
  if(!G||!G.net)return;
  const msgs=r.m||{};const keys=Object.keys(msgs).sort();for(const k of keys){if(NET.seen[k])continue;NET.seen[k]=1;const m=msgs[k];if(!m||m.f===me.code)continue;netApply(m);}
  if(r.aim&&r.aim.f!==me.code&&G.phase==='aim'&&cur().ctrl==='net'){G.dir=r.aim.d;G.pow=r.aim.p||0;G.spinA=r.aim.a||0;G.spinB=r.aim.b||0;}}
function netApply(m){if(m.k==='shot'){if(G.phase==='place'){G.ballInHand=null;$('#placeBar').hidden=true;}const c=G.B[cueIdx()];c.x=m.cx;c.z=m.cz;G.dir=m.dir;G.pow=m.pow;G.spinA=m.a;G.spinB=m.b;G.phase='aim';shoot(true);}
  else if(m.k==='sync'){NET.pendSync=m;if(G.phase==='aim'||G.phase==='place'||G.phase==='over')applySync();}}
const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[]);
function applySync(){const m=NET.pendSync;if(!m)return;NET.pendSync=null;m.b=arr(m.b).map(arr);m.s=arr(m.s);m.g=arr(m.g);m.b.forEach((q,i)=>{const b=G.B[i];b.x=q[0];b.z=q[1];b.on=!!q[2];b.rest=true;b.vx=b.vz=b.wx=b.wy=b.wz=0;});
  G.players.forEach((p,i)=>{p.score=m.s[i];p.group=m.g[i]||null;});G.turn=m.t;G.ballInHand=m.bih||null;G.break=false;hud();
  if(m.over!=null){if(!G.over){G.over=true;gameOver(m.over,m.why||'');}return;}startTurn(false);}
function netSend(o){const me=myBlip();o.f=me.code;const k=String(Date.now()).padStart(15,'0')+'_'+me.code+'_'+(NET.seq++);NET.seen[k]=1;nreq(NET.room+'/m/'+k,'PUT',o).catch(()=>toast('보내기 실패… 인터넷을 확인해요'));}
function netSync(extra){netSend(Object.assign({k:'sync',b:G.B.map(b=>[+b.x.toFixed(5),+b.z.toFixed(5),b.on?1:0]),s:G.players.map(p=>p.score),g:G.players.map(p=>p.group||''),t:G.turn,bih:G.ballInHand||''},extra||{}));}
function netAim(){const now=performance.now();if(now-NET.aimT<180||!G||cur().ctrl!=='me')return;NET.aimT=now;nreq(NET.room+'/aim','PUT',{f:myBlip().code,d:+G.dir.toFixed(4),p:+G.pow.toFixed(3),a:+G.spinA.toFixed(2),b:+G.spinB.toFixed(2)}).catch(()=>{});}
function netLeave(){if(NET.es){NET.es.close();NET.es=null;}clearInterval(NET.hb);if(NET.room&&NET.role==='host')nreq(NET.room,'DELETE').catch(()=>{});NET.room='';NET.role=null;NET.started=0;NET.peerT=0;}
// 받은 샷이 끝나면 동기화를 적용해요
const _endShot=endShot;endShot=function(){if(G.net&&cur().ctrl==='net'){G.shot=null;G.phase='wait';const iv=setInterval(()=>{if(!G||!G.net){clearInterval(iv);return;}if(NET.pendSync){clearInterval(iv);applySync();}},100);return;}_endShot();};

/* ======================= 메뉴 ======================= */
function renderMenu(){$('#stC').textContent=(SAVE.coins||0).toLocaleString('ko-KR');$('#stW').textContent=SAVE.w;$('#stL').textContent=SAVE.l;$('#stS').textContent=SAVE.best;
  const lock3=SAVE.w<3;$('#lk3').textContent=lock3?`🔒 ${SAVE.w}/3승`:'';$('[data-mode="three"]').classList.toggle('lock',lock3);if(lock3&&SAVE.mode==='three')SAVE.mode='pool';
  $$('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===SAVE.mode));$$('[data-opp]').forEach(b=>b.classList.toggle('on',b.dataset.opp===SAVE.opp));
  $$('[data-diff]').forEach(b=>b.classList.toggle('alt',+b.dataset.diff!==SAVE.diff));
  $('#aiOpt').hidden=SAVE.opp!=='ai';$('#onOpt').hidden=SAVE.opp!=='online';$('#bStart').hidden=SAVE.opp==='online';$('#myCode').textContent=myBlip().code;
  if(!G){buildTable(MODES[SAVE.mode].table,MODES[SAVE.mode].n);ballMeshes.forEach(m=>scene.remove(m));ballMeshes=[];
    const kind=SAVE.mode==='pool'?'pool':'carom';const R=TB.R;const pts=SAVE.mode==='pool'?[[0,-.6,0],[1,.5,.0],[9,.55,.03],[8,.6,-.02]]:[['#f6f4ee',-.5,.1],['#f2c624',-.6,-.1],['#d42a2a',.5,0]];
    for(const [n,x,z] of pts){const m=makeBallMesh(kind,n);m.position.set(x,R,z);ballMeshes.push(m);}cueHold.visible=false;aimLine.visible=ghost.visible=objLine.visible=cueLine.visible=false;}}
$$('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='three'&&SAVE.w<3){toast(`🔒 3구는 3승을 하면 열려요 (지금 ${SAVE.w}승)`);return;}SAVE.mode=b.dataset.mode;saveS();renderMenu();});
$$('[data-opp]').forEach(b=>b.onclick=()=>{SAVE.opp=b.dataset.opp;saveS();renderMenu();});
$$('[data-diff]').forEach(b=>b.onclick=()=>{SAVE.diff=+b.dataset.diff;saveS();renderMenu();});
$('#bStart').onclick=()=>{ac();newGame(SAVE.mode,SAVE.opp,SAVE.diff);if(SAVE.opp==='local')say('👥 2인 대결','번갈아 쳐요',1500);};
$('#bHost').onclick=()=>{ac();netHost();};$('#bJoin').onclick=()=>{ac();netJoin($('#joinCode').value);};
addEventListener('load',()=>{renderMenu();});renderMenu();
window.__bl={get G(){return G;},newGame,physStep,simShot,predict,shoot,get TB(){return TB;},get GEO(){return GEO;},NET,aiPlan,SAVE};
</script>
