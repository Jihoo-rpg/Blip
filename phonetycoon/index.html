<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>폰 공장 타이쿤</title>
<meta name="description" content="부품 하나하나 골라 휴대폰을 설계하고, 연구로 더 좋은 부품을 열고, 폴더폰부터 폴더블까지 만들어 파는 휴대폰 회사 경영 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f1218;--bg2:#161b24;--card:#1b212c;--card2:#222a37;--line:rgba(255,255,255,.1);--fg:#eef1f6;--muted:#97a1b3;--accent:#4ea8ff;--accent2:#7c5cff;--good:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--gold:#ffd35a;--display:"Black Han Sans",sans-serif;--body:"IBM Plex Sans KR",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
body{min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);letter-spacing:.01em}
/* 상단 */
#top{position:sticky;top:0;z-index:20;background:rgba(15,18,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#co{display:flex;align-items:center;gap:8px;min-width:0}
#logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
#coName{font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
#money{font-family:var(--display);font-size:20px;color:var(--gold);margin-left:auto;white-space:nowrap}
#money small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);text-align:right;font-weight:600}
#date{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
#date b{color:var(--fg);font-size:15px}
#speed{display:flex;gap:4px}
#speed button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:700}
#speed button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
/* 탭 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,18,24,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700}
#tabs button i{font-style:normal;font-size:22px}
#tabs button.on{color:var(--fg);background:var(--card)}
#tabs button .dot{position:absolute}
main{max-width:1100px;margin:0 auto;padding:12px}
.sect{margin:18px 0 8px;font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px}
.sect small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.btn{background:var(--accent);color:#06121f;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#04210f}
.btn.warn{background:var(--warn);color:#2a1900}
.btn.bad{background:var(--bad);color:#2a0507}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
/* 설계 */
#designWrap{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){#designWrap{grid-template-columns:360px 1fr}#preview{position:sticky;top:76px;align-self:start}}
#preview{background:radial-gradient(circle at 50% 30%,#26324a,#141924);border:1px solid var(--line);border-radius:18px;padding:12px}
#pv{display:flex;justify-content:center;gap:14px;align-items:flex-end;min-height:230px}
#pv svg{filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
#pvStats{display:grid;gap:5px;margin-top:10px}
.st{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700}
.st span:last-child{text-align:right;color:var(--muted)}
#pvSum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
#pvSum div{background:rgba(0,0,0,.25);border-radius:10px;padding:7px;text-align:center}
#pvSum b{display:block;font-size:16px}#pvSum small{color:var(--muted);font-size:11px;font-weight:700}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px}
.steps button.on{background:var(--fg);color:#0f1218}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:grid;gap:3px;position:relative}
.opt b{font-size:14px}.opt small{color:var(--muted);font-size:11.5px;line-height:1.35}
.opt .cost{font-size:12px;font-weight:700;color:var(--gold)}
.opt.on{border-color:var(--accent);background:#1b2a40}
.opt.lock{opacity:.45}
.opt .tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;background:var(--card2);border-radius:6px;padding:1px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
input[type=text],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font:inherit;width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:#fff}
.cam{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.cam .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.cam .hd .x{margin-left:auto;background:none;border:0;color:var(--bad);font-size:18px}
select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
.chk{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.chk.on{border-color:var(--good);background:#16301f}
.chk.lock{opacity:.45}
.chk b{font-size:13.5px}.chk small{display:block;color:var(--muted);font-size:11.5px}
.chk .cost{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
/* 제품 */
.prod{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:start}
.prod .meta{display:grid;gap:6px}
.prod h3{font-size:19px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.kv div{background:var(--bg2);border-radius:10px;padding:7px 9px}
.kv small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.kv b{font-size:14px}
.score{font-family:var(--display);font-size:26px;line-height:1}
canvas.chart{width:100%;height:120px;background:var(--bg2);border-radius:12px}
/* 연구 */
.rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;display:grid;gap:5px}
.ri.done{opacity:.5}.ri.cur{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.ri b{font-size:14px}.ri small{color:var(--muted);font-size:12px}
/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.7);display:grid;place-items:center;padding:12px}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px;display:grid;gap:12px}
.mbox h2{font-size:26px}
.review{background:var(--card);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.review .s{font-family:var(--display);font-size:24px;width:48px;text-align:center}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#news{display:grid;gap:6px}
#news div{background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}
#news div b{color:var(--accent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.big{font-family:var(--display);font-size:clamp(34px,9vw,64px);line-height:1}
#start{position:fixed;inset:0;z-index:70;background:radial-gradient(900px 500px at 50% 0%,rgba(78,168,255,.25),transparent),var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#start .in{max-width:520px;width:100%;display:grid;gap:14px;text-align:center}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-decoration:none;font-size:15px}
</style>
</head>
<body>
<header id="top">
  <a class="hb" href="../hub/" aria-label="허브로 돌아가기">🏠</a><div id="co"><div id="logo">P</div><div id="coName">내 회사</div></div>
  <div id="date"><b id="yr">2000</b>년 <span id="wk">1</span>주</div>
  <div id="speed"><button data-sp="0">⏸</button><button data-sp="1" class="on">▶</button><button data-sp="2">▶▶</button><button data-sp="4">▶▶▶</button></div>
  <div id="money">₩0<small id="wkProfit">이번 주 +0</small></div>
</header>
<main id="main"></main>
<nav id="tabs">
  <button data-tab="design" class="on"><i>🛠️</i>설계</button>
  <button data-tab="prods"><i>📱</i>내 제품</button>
  <button data-tab="research"><i>🔬</i>연구</button>
  <button data-tab="market"><i>📈</i>시장</button>
  <button data-tab="company"><i>🏢</i>회사</button>
</nav>
<div id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="start">
  <div class="in">
    <div style="font-size:64px">📱</div>
    <h1 class="big">폰 공장 타이쿤</h1>
    <p class="muted" style="margin:0;line-height:1.7">2000년, 5억 원으로 작은 휴대폰 회사를 세웠어요. 화면·칩·카메라 렌즈 하나하나 골라 폰을 설계하고, 연구로 더 좋은 부품을 열고, 폴더폰부터 폴더블까지 만들어 세계 1등 회사가 되세요.</p>
    <input type="text" id="nameIn" maxlength="10" placeholder="회사 이름 (예: 우주전자)" style="text-align:center;font-size:17px">
    <button class="btn" id="bNew" style="font-size:18px;padding:14px">회사 세우기 ▶</button>
    <button class="btn alt" id="bCont" hidden>이어서 하기</button>
  </div>
</div>

<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const pick=a=>a[(Math.random()*a.length)|0];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function won(n){n=Math.round(n);const s=n<0?'-':'';n=Math.abs(n);if(n>=1e12)return s+'₩'+(n/1e12).toFixed(n>=1e13?0:1)+'조';if(n>=1e8)return s+'₩'+(n/1e8).toFixed(n>=1e9?0:1)+'억';if(n>=1e4)return s+'₩'+Math.round(n/1e4).toLocaleString('ko-KR')+'만';return s+'₩'+n.toLocaleString('ko-KR');}
const units=n=>n>=1e8?(n/1e8).toFixed(1)+'억대':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+'만대':Math.round(n).toLocaleString('ko-KR')+'대';
function toast(t,ms=2400){const d=$('#toast');d.textContent=t;d.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>d.hidden=true,ms);}

 {id:'glass',n:'강화유리 + 메탈',y:2012,des:52,dur:48,c:30000,rp:280,desc:'반짝이는 유리 뒷면'},

const PANELS=[

/* ======================= 점수 계산 =======================
   각 분야 점수 → 그 해 시장 최고 수준 대비 비율 → 매력도 */
const L=(k,id)=>ALL_LISTS[k].find(x=>x.id===id)||ALL_LISTS[k][0];
function camScore(d){
  let s=0;const mods=d.cams||[];const used={};
  mods.forEach((m,i)=>{const se=L('sensor',m.sensor),ro=L('role',m.role);let q=se.q*(1+(m.ois?.12:0))*(1+(2.4-(m.ap||2.2))*.12);
    if(ro.id==='main'&&!used.main){s+=q;used.main=1;}else{const first=!used[ro.id];used[ro.id]=1;s+=first?ro.v*(.5+se.q/100)+q*.12:q*.04;}});
  s+=L('flash',d.flash).q+L('front',d.front).q*.5+L('video',d.video).q*.5;
  if(d.feats&&(d.feats.includes('ai')||d.feats.includes('odai')))s*=1.08;
  s*=1+L('chip',d.chip).q/400;
  return s;}
function scores(d){
  const f=L('form',d.form),m=L('mat',d.mat),p=L('panel',d.panel),r=L('res',d.res),h=L('hz',d.hz),cu=L('cut',d.cut),ch=L('chip',d.chip),ra=L('ram',d.ram),st=L('stor',d.stor),b=L('batt',d.batt),cg=L('chg',d.chg);
  const feats=(d.feats||[]).map(id=>L('feat',id));
  const size=d.size||f.sz[0];
  const des=f.des*.55+m.des*.35+(d.thin?(10-d.thin)*2:0)+(cu.q*.6);
  const scr=p.q*.55+r.q*.35+h.q*.9+size*4+cu.q*.4;
  const perf=ch.q*.75+ra.q*.35+st.q*.25+(f.perf||0)+feats.reduce((a,x)=>a+(x.perf||0),0);
  const cam=camScore(d);
  const draw=(p.pw+h.pw)*size*.35+ch.pw*1.2+(d.feats||[]).length*.03+(f.id==='fold'||f.id==='tri'||f.id==='roll'?.8:0);
  const bat=(d.mah||900)*b.e/(draw*80+60)*10+cg.q*.9+((d.feats||[]).includes('wchg')?4:0);
  const fea=feats.reduce((a,x)=>a+x.s,0);
  const dur=m.dur*.7+(f.dur||0)+feats.reduce((a,x)=>a+(x.dur||0),0)-(f.id==='fold'||f.id==='tri'||f.id==='roll'?14:0);
  return {des,scr,perf,cam,bat,fea,dur};}
// 그 해 시장 최고 수준 (해마다 기준이 올라가요)
const FRONTIER={};
function frontier(year){if(FRONTIER[year])return FRONTIER[year];
  const best=(list)=>list.filter(x=>x.y<=year).reduce((a,x)=>(x.q??x.des??0)>(a.q??a.des??0)?x:a,list[0]);
  const forms=FORMS.filter(x=>x.y<=year);const fb=forms.reduce((a,x)=>x.des>a.des?x:a,forms[0]);
  const matB=MATS.filter(x=>x.y<=year).reduce((a,x)=>x.des>a.des?x:a,MATS[0]);
  const sens=best(SENSORS);const roles=ROLES.filter(r=>r.y<=year&&r.id!=='main');
  const d={form:fb.id,mat:matB.id,panel:best(PANELS).id,res:best(RES).id,hz:best(HZ).id,cut:best(CUTS).id,chip:best(CHIPS).id,ram:best(RAM).id,stor:best(STOR).id,
    batt:(BATT.filter(x=>x.y<=year).slice(-1)[0]||BATT[0]).id,chg:best(CHG).id,flash:best(FLASH).id,front:best(FRONT).id,video:(VIDEO.filter(x=>x.y<=year).slice(-1)[0]||VIDEO[0]).id,
    mah:maxMah(year)*.85,size:6.4,thin:6,cams:year>=2002?[{role:'main',sensor:sens.id,ois:year>=2015,ap:apMin(year)},...roles.slice(0,3).map(r=>({role:r.id,sensor:sens.id,ois:false,ap:2.2}))]:[],
    feats:FEATS.filter(x=>x.y<=year).sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.id)};
  if(year<2007){d.size=2.4;}
  const s=scores(d);for(const k in s)s[k]=Math.max(8,s[k]*.97);
  s._cost=rawCost(Object.assign({},d,{form:year>=2007?'smart':'bar',size:year>=2007?6.4:2.4}));FRONTIER[year]=s;return s;}
const maxMah=y=>Math.round(900+Math.max(0,y-2000)*190+Math.max(0,y-2015)*60);
const apMin=y=>y>=2020?1.4:y>=2016?1.7:y>=2012?2:2.4;
function appeal(d,year=S.year){
  const s=scores(d),fr=frontier(year);const w=Object.assign({},W0);if(S.trend&&S.trend.y===year)w[S.trend.k]*=1.6;
  let tw=0,a=0;const norm={};for(const k in w){norm[k]=clamp(s[k]/fr[k],0,1.35);a+=w[k]*norm[k];tw+=w[k];}a/=tw;
  const f=L('form',d.form);const nov=f.novel?f.novel*Math.max(0,1-(year-f.y)/6):0;
  // 스마트폰 시대에 피처폰은 매력 감소
  const featAge=!f.smart&&year>=2009?clamp((year-2009)*.07,0,.55):0;
  return {a:clamp(a+nov-featAge,0,1.6),norm,s};}
function unitCost(d){return Math.round(rawCost(d)+asm());}
function rawCost(d){
  let c=0;const g=(k,id)=>L(k,id).c||0;
  c+=g('form',d.form)+g('mat',d.mat)+g('panel',d.panel)*(d.size||2)/5+g('res',d.res)+g('hz',d.hz)+g('cut',d.cut)+g('chip',d.chip)+g('ram',d.ram)+g('stor',d.stor)+g('chg',d.chg)+g('flash',d.flash)+g('front',d.front)+g('video',d.video);
  c+=(d.mah||900)*L('batt',d.batt).c;
  for(const m of d.cams||[])c+=L('sensor',m.sensor).c+L('role',m.role).c+(m.ois?6000:0)+Math.max(0,(2.4-(m.ap||2.4)))*12000;
  for(const id of d.feats||[])c+=g('feat',id);
  c+=(d.thin?(10-d.thin)*2500:0);
  c*=1.2;
  return c;}
const asm=()=>[0,9000,7000,5500,4500,3500,2500][S.fac]||5000;
const FAC=[null,{cap:15000,cost:0},{cap:50000,cost:1e10},{cap:150000,cost:5e10},{cap:400000,cost:2e11},{cap:1e6,cost:8e11},{cap:3e6,cost:3e12}];

function fairPrice(d,a){const f=L('form',d.form);const fc=frontier(S.year)._cost*.6+40000;return Math.round(Math.max(20000,fc*(.9+1.8*Math.pow(clamp(a,0,1.4),2))*f.prem)/1000)*1000;}

  const f=L('form',d.form);d.size=+(f.sz[0]+(f.sz[1]-f.sz[0])*.5).toFixed(1);
  if(has('sensor','vga')&&S.year>=2002)d.cams=[{role:'main',sensor:best('sensor'),ois:false,ap:2.4}];

    const cams=d.cams||[];if(cams.length){const big=Math.max(...cams.map(m=>L('sensor',m.sensor).sz));
      const rad=m=>2.6+L('sensor',m.sensor).sz*4.2;const lay=d.layout||'col';const n=cams.length;const pts=[];
      let ox=X+(feature?w/2:w*.3),oy=Y+(f.id==='flip'?h*.45:feature?14:h*.17);
      const gap=Math.max(...cams.map(rad))*2.3;
      for(let i=0;i<n;i++){let px=0,py=0;if(lay==='col'){py=(i-(n-1)/2)*gap;}else if(lay==='row'){px=(i-(n-1)/2)*gap;}else if(lay==='sq'){px=(i%2-.5)*gap;py=(Math.floor(i/2)-(Math.ceil(n/2)-1)/2)*gap;}
        else if(lay==='circle'){const a=i/n*Math.PI*2-Math.PI/2;px=n>1?Math.cos(a)*gap*.62:0;py=n>1?Math.sin(a)*gap*.62:0;}else if(lay==='diag'){px=(i-(n-1)/2)*gap*.7;py=(i-(n-1)/2)*gap*.7;}else{px=(i%2)*gap*1.1-gap*.55;py=Math.floor(i/2)*gap*1.15-gap*.5;}
        pts.push([px,py]);}
      if(lay==='col'||lay==='row'||lay==='diag')ox=X+(lay==='row'?w/2:feature?w/2:w*.27);
      if(lay==='row')oy=Y+h*.14;
      {const ys0=pts.map(p=>p[1]);const top=oy+Math.min(...ys0)-Math.max(...cams.map(rad))-5;if(top<Y+4)oy+=Y+4-top;}
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const mr=Math.max(...cams.map(rad));
      if(lay!=='free'){if(lay==='circle')s+=`<circle cx="${ox}" cy="${oy}" r="${(n>1?gap*.62:0)+mr+4}" fill="${dark}" stroke="${metal?'#ccc':'#000'}" stroke-opacity=".4"/>`;
        else s+=`<rect x="${ox+Math.min(...xs)-mr-4}" y="${oy+Math.min(...ys)-mr-4}" width="${Math.max(...xs)-Math.min(...xs)+mr*2+8}" height="${Math.max(...ys)-Math.min(...ys)+mr*2+8}" rx="${mr+3}" fill="${dark}" stroke="#000" stroke-opacity=".35"/>`;}
      cams.forEach((m,i)=>{const R=rad(m),cx=ox+pts[i][0],cy=oy+pts[i][1];const peri=m.role==='peri';
        if(peri)s+=`<rect x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}" rx="2" fill="#111" stroke="#666" stroke-width="1.2"/><rect x="${cx-R*.55}" y="${cy-R*.55}" width="${R*1.1}" height="${R*1.1}" fill="#1b2a4a"/>`;
        else s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#0c0d10" stroke="${m.ois?'#c9a227':'#777'}" stroke-width="1.3"/><circle cx="${cx}" cy="${cy}" r="${R*.62}" fill="#1b2a4a"/><circle cx="${cx-R*.25}" cy="${cy-R*.25}" r="${R*.2}" fill="#fff" opacity=".55"/>`;});
      if(d.flash!=='none'){const fx=ox+Math.max(...xs)+mr+(lay==='row'?6:2),fy=oy+Math.min(...ys)-(lay==='row'?0:0);s+=d.flash==='ring'?`<circle cx="${fx+2}" cy="${fy}" r="3" fill="none" stroke="#ffe9a8" stroke-width="1.6"/>`:`<circle cx="${fx+2}" cy="${fy}" r="${d.flash==='dual'?2.6:2.2}" fill="#ffe9a8"/>`;}}
    if(f.id==='gaming')s+=`<path d="M${X+w*.62} ${Y+h*.35} l6 4 l-6 4z" fill="#ff3b5c"/><rect x="${X+w*.55}" y="${Y+h*.48}" width="${w*.3}" height="3" rx="1.5" fill="#3bf0ff" opacity=".8"/>`;
  }
  return s+'</svg>';}

    <div class="row" style="justify-content:space-between"><h3>${esc(p.d.name)}</h3><span class="pill" style="color:${p.rt>=8?'var(--good)':p.rt>=6?'var(--warn)':'var(--bad)'}">⭐ ${p.rt}</span></div>
    <div class="muted" style="font-size:12px">${esc(L('form',p.d.form).n)} · ${p.y}년 출시 · ${p.on?(p.stock<=0&&!(p.queue||[]).length?'<b style="color:var(--bad)">품절!</b>':'판매 중'):'단종'}</div>
    <div class="kv"><div><small>가격</small><b>${won(p.d.price)}</b></div><div><small>적정가</small><b style="color:${pf>1.15?'var(--bad)':pf<.9?'var(--good)':'inherit'}">${won(p.fair||0)}</b></div><div><small>이번 주 판매</small><b>${units(p.last||0)}</b></div><div><small>재고</small><b>${units(p.stock)}${(p.queue||[]).length?` <small style="display:inline">+${units(p.queue.reduce((a,q)=>a+q.n,0))}</small>`:''}</b></div><div><small>총 판매</small><b>${units(p.sold)}</b></div><div><small>총 매출</small><b>${won(p.rev)}</b></div></div>
    ${p.on&&(p.wantLast||0)>(p.last||0)?`<div class="pill" style="color:var(--warn)">⚠️ 재고 부족으로 ${units(p.wantLast-p.last)} 못 팔았어요</div>`:''}
    <canvas class="chart" data-chart="${p.id}"></canvas>
    ${p.on?`<div class="row"><button class="btn sm" data-ord="${p.id}">🏭 생산</button><button class="btn sm alt" data-pr="${p.id}">💰 가격</button><button class="btn sm alt" data-ad="${p.id}">📣 광고</button><button class="btn sm alt" data-auto="${p.id}">${p.auto?'🔁 자동 보충 켜짐':'🔁 자동 보충 꺼짐'}</button><button class="btn sm bad" data-end="${p.id}">단종</button></div>`:''}
   </div></div>`;};
  $('#main').innerHTML=`<div class="sect">📱 판매 중 <small>${on.length}종</small></div><div class="grid">${on.map(card).join('')||'<p class="muted">판매 중인 폰이 없어요</p>'}</div>${off.length?`<div class="sect">📦 단종된 폰</div><div class="grid">${off.slice(0,8).map(card).join('')}</div>`:''}`;
  drawCharts();bindProds();}
function drawCharts(){$$('canvas[data-chart]').forEach(cv=>{const p=S.prods.find(x=>x.id==cv.dataset.chart);if(!p)return;const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;const c=cv.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);
  const h=p.hist,W=r.width,H=r.height;if(h.length<2){c.fillStyle='#97a1b3';c.font='12px sans-serif';c.fillText('판매 그래프는 몇 주 뒤에 나와요',10,H/2);return;}const mx=Math.max(...h,1);
  c.strokeStyle='rgba(255,255,255,.08)';for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,H*i/4);c.lineTo(W,H*i/4);c.stroke();}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(78,168,255,.45)');g.addColorStop(1,'rgba(78,168,255,0)');c.beginPath();h.forEach((v,i)=>{const x=i/(h.length-1)*W,y=H-6-v/mx*(H-20);i?c.lineTo(x,y):c.moveTo(x,y);});
  c.lineTo(W,H);c.lineTo(0,H);c.fillStyle=g;c.fill();c.beginPath();h.forEach((v,i)=>{const x=i/(h.length-1)*W,y=H-6-v/mx*(H-20);i?c.lineTo(x,y):c.moveTo(x,y);});c.strokeStyle='#4ea8ff';c.lineWidth=2;c.stroke();
  c.fillStyle='#97a1b3';c.font='11px sans-serif';c.fillText('주간 판매 최고 '+units(mx),8,14);});}
function bindProds(){
  $$('[data-ord]').forEach(b=>b.onclick=()=>{const p=S.prods.find(x=>x.id==b.dataset.ord);const cap=FAC[S.fac].cap;const maxN=Math.max(100,Math.min(cap*2,Math.floor(S.money/p.uc)));
    openModal(`<h2>🏭 「${esc(p.d.name)}」 생산</h2><p class="muted">개당 원가 ${won(p.uc)} · 2주 뒤에 창고로 들어와요 · 공장 한 주 최대 ${units(cap)}</p><div class="field"><label>수량 <b id="oqV"></b></label><input type="range" id="oq" min="1" max="100" value="30"></div><button class="btn good" id="bOrd">생산 주문</button><button class="btn alt" onclick="closeModal()">취소</button>`);
    const q=()=>Math.max(100,Math.round(maxN*(+$('#oq').value/100)/100)*100);const u=()=>{$('#oqV').textContent=units(q())+' · '+won(q()*p.uc);};$('#oq').oninput=u;u();$('#bOrd').onclick=()=>{if(order(p,q())){closeModal();renderProds();}};});
  $$('[data-pr]').forEach(b=>b.onclick=()=>{const p=S.prods.find(x=>x.id==b.dataset.pr);const fair=p.fair||fairPrice(p.d,appeal(p.d).a);
    openModal(`<h2>💰 가격 바꾸기</h2><p class="muted">지금 사람들이 생각하는 적정가: <b>${won(fair)}</b> · 개당 원가 ${won(p.uc)}</p><div class="field"><label>가격 <b id="npV"></b></label><input type="range" id="np" min="${Math.round(p.uc*.5/1000)}" max="${Math.round(Math.max(fair*2.2,p.uc*3)/1000)}" value="${Math.round(p.d.price/1000)}"><small class="muted" id="npH"></small></div><button class="btn good" id="bNp">적용</button>`);
    const u=()=>{const v=+$('#np').value*1000;$('#npV').textContent=won(v);const r=v/fair;$('#npH').textContent=`개당 이익 ${won(v-p.uc)} · ${r<.85?'싸요 · 잘 팔려요':r<1.05?'적당해요':r<1.3?'조금 비싸요':'너무 비싸요'}`;};$('#np').oninput=u;u();
    $('#bNp').onclick=()=>{p.d.price=+$('#np').value*1000;closeModal();renderProds();save();};});
  $$('[data-ad]').forEach(b=>b.onclick=()=>{const p=S.prods.find(x=>x.id==b.dataset.ad);const k=1+(S.year-2000)*.05;const AD=[['📱 SNS 광고',.5,2e7],['📺 TV 광고',1.2,1.5e8],['🌟 아이돌 모델',2.2,6e8],['🏟️ 월드 투어 광고',3.5,2e9]];
    openModal(`<h2>📣 「${esc(p.d.name)}」 광고</h2><p class="muted">광고하면 몇 주 동안 판매가 늘어나요 (지금 열기 ×${(1+p.hype).toFixed(1)})</p><div class="grid">${AD.map((a,i)=>`<button class="btn ${S.money<a[2]*k?'alt':''}" data-adi="${i}" ${S.money<a[2]*k?'disabled':''}>${a[0]} · ${won(a[2]*k)} · 판매 +${Math.round(a[1]*100)}%</button>`).join('')}</div><button class="btn alt" onclick="closeModal()">닫기</button>`);
    $$('[data-adi]').forEach(x=>x.onclick=()=>{const a=AD[+x.dataset.adi];S.money-=a[2]*k;p.hype=(p.hype||0)+a[1];closeModal();toast(a[0]+' 시작!');updTop();renderProds();save();});});
  $$('[data-auto]').forEach(b=>b.onclick=()=>{const p=S.prods.find(x=>x.id==b.dataset.auto);p.auto=!p.auto;renderProds();save();});
  $$('[data-end]').forEach(b=>b.onclick=()=>{const p=S.prods.find(x=>x.id==b.dataset.end);if(!confirm(`「${p.d.name}」을 단종할까요? 남은 재고는 반값에 정리돼요`))return;S.money+=p.stock*p.uc*.5;p.stock=0;p.queue=[];p.on=0;renderProds();updTop();save();});}

/* ======================= 화면: 연구 ======================= */
function renderResearch(){
  const groups=Object.keys(ALL_LISTS);const rpw=LAB[S.lab].rp*(1+S.rep/200);
  const cur=S.research?ALL_LISTS[S.research.k].find(x=>x.id===S.research.id):null;
  let html=`<div class="card"><div class="row" style="justify-content:space-between"><div><b>🔬 연구소 Lv.${S.lab}</b><div class="muted" style="font-size:13px">한 주에 연구 점수 ${rpw.toFixed(0)} · 모아둔 점수 ${Math.floor(S.rp)}</div></div>
   ${cur?`<div style="min-width:180px"><b>연구 중: ${esc(cur.n)}</b><div class="bar" style="margin-top:6px"><i style="width:${S.research.p/cur.rp*100}%"></i></div><small class="muted">${Math.max(0,Math.ceil((cur.rp-S.research.p)/rpw))}주 남음</small></div>`:'<b class="muted">연구 쉬는 중 · 아래에서 골라요</b>'}</div></div>`;
  const avNow=[];for(const k of groups)for(const it of ALL_LISTS[k])if(!has(k,it.id)&&avail(it))avNow.push([k,it]);
  html+=`<div class="sect">✨ 지금 연구할 수 있어요 <small>${avNow.length}개</small></div><div class="rs">${avNow.sort((a,b)=>a[1].rp-b[1].rp).map(([k,it])=>{const isCur=S.research&&S.research.k===k&&S.research.id===it.id;
    return `<div class="ri ${isCur?'cur':''}"><small>${esc(GROUP_NAME[k])}</small><b>${esc(it.n)}</b><small>${it.rp}점 · 약 ${Math.ceil(it.rp/rpw)}주</small>${isCur?'<span class="pill">연구 중</span>':`<button class="btn sm" data-rs="${k}:${it.id}">연구 시작</button>`}</div>`;}).join('')||'<p class="muted">지금은 연구할 게 없어요. 해가 바뀌면 새 기술이 나와요</p>'}</div>`;
  const soon=[];for(const k of groups)for(const it of ALL_LISTS[k])if(it.y>S.year&&it.y<=S.year+3)soon.push([k,it]);
  html+=`<div class="sect">🔮 곧 나와요</div><div class="rs">${soon.sort((a,b)=>a[1].y-b[1].y).slice(0,12).map(([k,it])=>`<div class="ri" style="opacity:.6"><small>${esc(GROUP_NAME[k])} · ${it.y}년</small><b>${esc(it.n)}</b></div>`).join('')||'<p class="muted">-</p>'}</div>`;
  $('#main').innerHTML=html;
  $$('[data-rs]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.rs.split(':');S.research={k,id,p:Math.min(S.rp,ALL_LISTS[k].find(x=>x.id===id).rp)};S.rp-=S.research.p;toast('🔬 연구 시작');renderResearch();save();});}

/* ======================= 화면: 시장 ======================= */
function renderMarket(){
  const mine=S.prods.filter(p=>p.on);const M=marketWeek(S.year);const totMine=mine.reduce((a,p)=>a+(p.last||0),0);
  const share=Math.min(100,totMine/M*100);
  const rows=[...S.rivals.map(r=>({n:r.n,c:r.c,ph:r.ph})),...mine.slice(0,3).map(p=>({n:S.name,c:'#4ea8ff',ph:{n:p.d.name,rt:p.rt,a:p.app||0},me:1}))];
  $('#main').innerHTML=`<div class="grid g2"><div class="card"><small class="muted">${S.year}년 한 주 휴대폰 시장</small><div class="score">${units(M)}</div></div><div class="card"><small class="muted">내 점유율 (이번 주)</small><div class="score">${share.toFixed(1)}%</div></div>
    <div class="card"><small class="muted">브랜드 평판</small><div class="score">${S.rep.toFixed(0)}<small class="muted" style="font-size:14px"> / 100</small></div><div class="bar" style="margin-top:6px"><i style="width:${S.rep}%"></i></div></div><div class="card"><small class="muted">올해 유행</small><div class="score" style="font-size:22px">🔥 ${S.trend?CATS.find(c=>c[0]===S.trend.k)[1]:'-'}</div><small class="muted">이 분야가 좋은 폰이 더 잘 팔려요</small></div></div>
   <div class="sect">🏁 경쟁 폰</div><div class="grid">${rows.map(r=>`<div class="card row" style="justify-content:space-between"><div class="row"><span style="width:12px;height:12px;border-radius:50%;background:${r.c}"></span><b>${esc(r.n)}</b>${r.me?'<span class="pill">나</span>':''}</div><div class="muted">${r.ph?esc(r.ph.n)+' · ⭐ '+r.ph.rt:'준비 중'}</div></div>`).join('')}</div>
   <div class="sect">📰 뉴스</div><div id="news">${S.news.slice(0,20).map(n=>`<div><small class="muted">${n.y}.${n.w}주</small> ${n.t}</div>`).join('')}</div>`;}

/* ======================= 화면: 회사 ======================= */
function renderCompany(){
  const fc=FAC[S.fac+1],lc=LAB[S.lab+1];
  const ACH=achList();
  $('#main').innerHTML=`<div class="grid g2">
   <div class="card grid"><b style="font-size:17px">🏭 공장 Lv.${S.fac}</b><div class="muted" style="font-size:13px">한 주 생산 ${units(FAC[S.fac].cap)} · 조립비 개당 ${won(asm())}</div>${fc?`<button class="btn" data-up="fac" ${S.money<fc.cost?'disabled':''}>Lv.${S.fac+1}로 확장 · ${won(fc.cost)}</button><small class="muted">→ 한 주 ${units(fc.cap)} · 조립비 ${won([0,9000,7000,5500,4500,3500,2500][S.fac+1])}</small>`:'<b>최고 레벨!</b>'}</div>
   <div class="card grid"><b style="font-size:17px">🔬 연구소 Lv.${S.lab}</b><div class="muted" style="font-size:13px">한 주 연구 점수 ${LAB[S.lab].rp}</div>${lc?`<button class="btn" data-up="lab" ${S.money<lc.cost?'disabled':''}>Lv.${S.lab+1}로 확장 · ${won(lc.cost)}</button><small class="muted">→ 한 주 ${lc.rp}점</small>`:'<b>최고 레벨!</b>'}</div>
   <div class="card grid"><b style="font-size:17px">📊 회사 기록</b><div class="kv"><div><small>총 판매</small><b>${units(S.totalSold)}</b></div><div><small>총 매출</small><b>${won(S.totalRev)}</b></div><div><small>팬</small><b>${Math.floor(S.fans).toLocaleString('ko-KR')}명</b></div><div><small>지난주 이익</small><b style="color:${(S.lastProfit||0)>=0?'var(--good)':'var(--bad)'}">${won(S.lastProfit||0)}</b></div></div></div>
   <div class="card grid"><b style="font-size:17px">🏆 업적 ${Object.keys(S.ach).length}/${ACH.length}</b>${ACH.map(a=>`<div class="row" style="opacity:${S.ach[a.id]?1:.45}"><span>${S.ach[a.id]?'🏆':'🔒'}</span><div><b style="font-size:13px">${a.n}</b><div class="muted" style="font-size:12px">${a.d}</div></div></div>`).join('')}</div>
   <div class="card grid"><b>⚙️ 게임</b><button class="btn alt" id="bReset">처음부터 다시 하기</button></div></div>`;
  $$('[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up;const T=k==='fac'?FAC:LAB;const nx=T[S[k]+1];if(!nx||S.money<nx.cost)return;S.money-=nx.cost;S[k]++;toast(k==='fac'?'🏭 공장 확장!':'🔬 연구소 확장!');updTop();renderCompany();save();});
  $('#bReset').onclick=()=>{if(confirm('정말 처음부터 다시 할까요? 지금 회사가 사라져요')){localStorage.removeItem(SK);location.reload();}};}
function achList(){return [
 {id:'first',n:'첫 출시',d:'처음으로 폰을 출시해요',t:()=>S.prods.length>0},
 {id:'m1',n:'100만 대',d:'총 100만 대 판매',t:()=>S.totalSold>=1e6},
 {id:'m10',n:'1000만 대',d:'총 1000만 대 판매',t:()=>S.totalSold>=1e7},
 {id:'m100',n:'1억 대',d:'총 1억 대 판매',t:()=>S.totalSold>=1e8},
 {id:'b1',n:'억만장자 회사',d:'돈 100억 모으기',t:()=>S.money>=1e10},
 {id:'b2',n:'조 단위 회사',d:'돈 1조 모으기',t:()=>S.money>=1e12},

 {id:'smart',n:'스마트폰 시대',d:'스마트폰 출시',t:()=>S.prods.some(p=>L('form',p.d.form).smart)},
 {id:'fold',n:'접히는 미래',d:'폴더블이나 플립 출시',t:()=>S.prods.some(p=>['fold','flip','tri'].includes(p.d.form))},
 {id:'cam5',n:'카메라 괴물',d:'렌즈 5개짜리 폰 출시',t:()=>S.prods.some(p=>(p.d.cams||[]).length>=5)},
 {id:'rep90',n:'국민 브랜드',d:'평판 90 이상',t:()=>S.rep>=90},
 {id:'roll',n:'끝판왕',d:'롤러블 폰 출시',t:()=>S.prods.some(p=>p.d.form==='roll')},
];}
function checkAch(){for(const a of achList())if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;toast('🏆 업적: '+a.n,2800);news(`🏆 업적 달성: <b>${a.n}</b>`);}}

/* ======================= 공통 UI ======================= */
function openModal(h){$('#mbox').innerHTML=h;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function updTop(){$('#coName').textContent=S.name;$('#logo').textContent=S.name[0]||'P';$('#money').firstChild.nodeValue=won(S.money);$('#yr').textContent=S.year;$('#wk').textContent=S.week;
  const pr=S.lastProfit||0;$('#wkProfit').textContent='이번 주 '+(pr>=0?'+':'')+won(pr);$('#wkProfit').style.color=pr>=0?'var(--good)':'var(--bad)';}

function render(){({design:renderDesign,prods:renderProds,research:renderResearch,market:renderMarket,company:renderCompany})[tab]();}

$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$$('#speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;$$('#speed button').forEach(x=>x.classList.toggle('on',x===b));});
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.25,(now-last)/1000);last=now;if(!S||!$('#start').hidden)return;if(!$('#modal').hidden)return;
  tickT+=dt*speed;if(tickT>=1.6){tickT=0;weekTick();}}
requestAnimationFrame(loop);
window.__pt={get S(){return S;},weekTick,appeal,unitCost,fairPrice,frontier,blankDesign,scores};
// 시작
{const o=load();if(o){$('#bCont').hidden=false;$('#bCont').textContent=`이어서 하기 · ${o.name} (${o.year}년)`;}
 $('#bCont').onclick=()=>{S=load();$('#start').hidden=true;updTop();render();};
 $('#bNew').onclick=()=>{if(load()&&!confirm('새 회사를 세우면 저장된 회사가 사라져요. 계속할까요?'))return;newGame(($('#nameIn').value||'').trim()||'우주전자');$('#start').hidden=true;updTop();render();
   setTimeout(()=>openModal(`<h2>👋 ${esc(S.name)} 사장님, 환영해요!</h2><p style="line-height:1.7">지금은 <b>2000년</b>. 휴대폰은 아직 키패드 달린 폰이에요.</p><ol style="line-height:1.9;padding-left:20px;margin:0"><li><b>🛠️ 설계</b>에서 모양·화면·칩·카메라·배터리를 골라 폰을 만들어요</li><li>개발이 끝나면 <b>가격</b>과 <b>생산 수량</b>을 정해 출시해요</li><li><b>🔬 연구</b>로 더 좋은 부품을 열어요. 해가 지날수록 새 기술이 나와요</li><li>2007년엔 <b>스마트폰</b>, 2019년엔 <b>폴더블</b>! 특별한 폰일수록 비싸게 팔려요</li></ol><button class="btn" onclick="closeModal()">시작하기</button>`),300);};
 $('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bNew').click();});}
