<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>폰 공장 타이쿤</title>
<meta name="description" content="부품 하나하나 골라 휴대폰을 설계하고, 연구로 더 좋은 부품을 열고, 폴더폰부터 폴더블까지 만들어 파는 휴대폰 회사 경영 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f1218;--bg2:#161b24;--card:#1b212c;--card2:#222a37;--line:rgba(255,255,255,.1);--fg:#eef1f6;--muted:#97a1b3;--accent:#4ea8ff;--accent2:#7c5cff;--good:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--gold:#ffd35a;--display:"Black Han Sans",sans-serif;--body:"IBM Plex Sans KR",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(124,92,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(78,168,255,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px}
body{min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);letter-spacing:.01em}
/* 상단 */
#top{position:sticky;top:0;z-index:20;background:rgba(15,18,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#co{display:flex;align-items:center;gap:8px;min-width:0}
#logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 3px 0 #3b2a99,0 6px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
#coName{font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
#money{font-family:var(--display);font-size:20px;color:var(--gold);margin-left:auto;white-space:nowrap}
#money small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);text-align:right;font-weight:600}
#date{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
#date b{color:var(--fg);font-size:15px}
#repB{font-weight:700;font-size:13px;color:var(--gold);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px;white-space:nowrap}
/* 탭 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,18,24,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700}
#tabs button i{font-style:normal;font-size:22px}
#tabs button.on{color:var(--fg);background:linear-gradient(180deg,#2c3a52,#1f2836);box-shadow:0 3px 0 #0c1017,inset 0 1px 0 rgba(255,255,255,.12)}
#tabs button.on i{transform:translateY(-2px) scale(1.12);filter:drop-shadow(0 4px 6px rgba(78,168,255,.5))}
#tabs button i{transition:transform .15s}
#tabs button .dot{position:absolute}
main{max-width:1100px;margin:0 auto;padding:12px}
.sect{margin:18px 0 8px;font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px}
.sect small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600}
.card{background:linear-gradient(180deg,#232b39,#1a202b);border:1px solid var(--line);border-top-color:rgba(255,255,255,.16);border-radius:16px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.btn{--sh:#1f6fc0;background:linear-gradient(180deg,#7cc0ff,var(--accent));color:#06121f;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--sh),0 8px 16px rgba(0,0,0,.35);transform:translateY(0);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sh),0 3px 8px rgba(0,0,0,.3)}
.btn.alt{--sh:#0c1017;background:linear-gradient(180deg,#2c3545,#222a37);color:var(--fg);border:1px solid var(--line)}
.btn.good{--sh:#1c8a4c;background:linear-gradient(180deg,#7af0ab,var(--good));color:#04210f}
.btn.warn{--sh:#a86c00;background:linear-gradient(180deg,#ffd06a,var(--warn));color:#2a1900}
.btn.bad{--sh:#a8262a;background:linear-gradient(180deg,#ff8a8d,var(--bad));color:#2a0507}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
/* 설계 */
#designWrap{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){#designWrap{grid-template-columns:360px 1fr}#preview{position:sticky;top:76px;align-self:start}}
#preview{background:linear-gradient(180deg,#1e2534,#141924);border:1px solid var(--line);border-top-color:rgba(255,255,255,.16);border-radius:18px;padding:12px;box-shadow:0 16px 36px rgba(0,0,0,.45)}
#pv3{position:relative;height:min(52vh,380px);margin:-4px -4px 0;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,rgba(120,160,255,.28),transparent 65%),linear-gradient(180deg,#1d2638,#0d1119)}
#pv3 .pvBtns{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px}
#pv3 .pvBtns button{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#pv3 .pvHint{position:absolute;left:12px;top:12px;z-index:2;font-size:11.5px;color:rgba(255,255,255,.55);font-weight:600;pointer-events:none}
#pv3 canvas{position:absolute;inset:0}
.p3img{display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
#pv{display:flex;justify-content:center;gap:14px;align-items:flex-end;min-height:230px}
#pv svg{filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
#pvStats{display:grid;gap:5px;margin-top:10px}
.st{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700}
.st span:last-child{text-align:right;color:var(--muted)}
#pvSum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
#pvSum div{background:rgba(0,0,0,.25);border-radius:10px;padding:7px;text-align:center}
#pvSum b{display:block;font-size:16px}#pvSum small{color:var(--muted);font-size:11px;font-weight:700}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px}
.steps button.on{background:linear-gradient(180deg,#fff,#cfd6e2);color:#0f1218;box-shadow:0 3px 0 #7d8799}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{background:linear-gradient(180deg,#252e3d,#1b212c);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:grid;gap:3px;position:relative;box-shadow:0 4px 0 #0c1017,0 8px 14px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1017}
.opt b{font-size:14px}.opt small{color:var(--muted);font-size:11.5px;line-height:1.35}
.opt .cost{font-size:12px;font-weight:700;color:var(--gold)}
.opt.on{border-color:var(--accent);background:linear-gradient(180deg,#24406a,#1a2c47);box-shadow:0 4px 0 #1f6fc0,0 0 18px rgba(78,168,255,.35)}
.opt.lock{opacity:.45}
.opt .tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;background:var(--card2);border-radius:6px;padding:1px 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
input[type=text],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font:inherit;width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:#fff}
.cam{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.cam .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.cam .hd .x{margin-left:auto;background:none;border:0;color:var(--bad);font-size:18px}
select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
.chk{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#252e3d,#1b212c);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;box-shadow:0 4px 0 #0c1017}
.chk.on{border-color:var(--good);background:linear-gradient(180deg,#1d4a2f,#16301f);box-shadow:0 4px 0 #1c8a4c,0 0 16px rgba(61,220,132,.25)}
.chk.lock{opacity:.45}
.chk b{font-size:13.5px}.chk small{display:block;color:var(--muted);font-size:11.5px}
.chk .cost{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
/* 제품 */
.prod{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.prod .meta{display:grid;gap:6px}
.prod h3{font-size:19px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.kv div{background:var(--bg2);border-radius:10px;padding:7px 9px}
.kv small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.kv b{font-size:14px}
.score{font-family:var(--display);font-size:26px;line-height:1}
canvas.chart{width:100%;height:120px;background:var(--bg2);border-radius:12px}
/* 연구 */
.rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;display:grid;gap:5px}
.ri.done{opacity:.5}.ri.cur{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.ri b{font-size:14px}.ri small{color:var(--muted);font-size:12px}
/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.7);display:grid;place-items:center;padding:12px}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px;display:grid;gap:12px}
.mbox h2{font-size:26px}
.review{background:var(--card);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.review .s{font-family:var(--display);font-size:24px;width:48px;text-align:center}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#news{display:grid;gap:6px}
#news div{background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}
#news div b{color:var(--accent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.big{font-family:var(--display);font-size:clamp(34px,9vw,64px);line-height:1}
#start{position:fixed;inset:0;z-index:70;background:radial-gradient(900px 500px at 50% 0%,rgba(78,168,255,.25),transparent),var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#start .in{max-width:520px;width:100%;display:grid;gap:14px;text-align:center}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-decoration:none;font-size:15px}

/* ---- 공통 추가 ---- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:radial-gradient(600px 200px at 0% 0%,rgba(124,92,255,.35),transparent),linear-gradient(180deg,#26304a,#1a202b)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tipG,.tipB{font-size:12.5px;font-weight:600;border-radius:9px;padding:6px 9px;margin-top:5px}
.tipG{background:rgba(61,220,132,.12);color:#9ff0c0}.tipB{background:rgba(255,90,95,.12);color:#ffb3b5}
.bar.big{height:14px;border-radius:8px}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
/* 프로젝트 단계 */
.pstep{display:flex;align-items:center;gap:0;margin:2px 0 12px;overflow-x:auto;scrollbar-width:none}
.pstep i{flex:1;min-width:10px;height:3px;background:var(--line);border-radius:2px}
.ps{display:grid;justify-items:center;gap:2px;flex:0 0 auto}
.ps span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-size:16px;box-shadow:0 3px 0 #0c1017}
.ps small{font-size:11px;font-weight:700;color:var(--muted)}
.ps.done span{background:linear-gradient(180deg,#7af0ab,#3ddc84);color:#04210f;border-color:#3ddc84;font-weight:900}
.ps.cur span{background:linear-gradient(180deg,#7cc0ff,#4ea8ff);border-color:#9fd0ff;transform:scale(1.12);box-shadow:0 0 0 4px rgba(78,168,255,.25),0 3px 0 #1f6fc0}
.ps.cur small{color:var(--fg)}
/* 칩 */
.chipCard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-align:left}
.chipCard img{width:96px;height:96px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.pickable{cursor:pointer;color:inherit;font:inherit;width:100%}
.pickable.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 22px rgba(78,168,255,.35)}
#ceWrap{display:grid;gap:12px;margin-top:10px}
@media(min-width:900px){#ceWrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}#ceBoard{position:sticky;top:76px;align-self:start}}
#dieGrid{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);aspect-ratio:1;margin-top:10px;border-radius:10px;overflow:hidden;
  background:linear-gradient(135deg,#3a3f4b,#22262f 55%,#2d323d);box-shadow:inset 0 0 0 2px #555c69,0 0 0 6px #14171c,0 0 0 8px #c9a227,0 12px 30px rgba(0,0,0,.5);touch-action:manipulation}
.dc{border:1px solid rgba(255,255,255,.06)}
.dc:hover{background:rgba(255,255,255,.06)}
.db{position:absolute;padding:2px;pointer-events:auto;cursor:pointer}
.db span{display:grid;place-items:center;width:100%;height:100%;border-radius:4px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:rgba(0,0,0,.65);font-weight:900;font-size:clamp(9px,2.6vw,15px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4);animation:drop .18s ease-out}
.db.bC span{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 6px),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000))}
.db.bG span{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 10px),linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000))}
@keyframes drop{from{transform:scale(1.25);opacity:.4}to{transform:none;opacity:1}}
.ghost{position:absolute;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 25%,transparent);border-radius:4px;pointer-events:none}
.ghost.bad{border-color:#ff5a5f;background:rgba(255,90,95,.2)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pb{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;background:linear-gradient(180deg,#252e3d,#1b212c);border:2px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 3px 0 #0c1017}
.pb i{grid-row:span 2;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pb b{font-size:13px}.pb small{font-size:10.5px;color:var(--muted);line-height:1.3}
.pb .cnt{position:absolute;top:5px;right:7px;font-size:11px;font-weight:800;color:var(--gold)}
.pb.on{border-color:var(--accent);background:linear-gradient(180deg,#24406a,#1a2c47);box-shadow:0 3px 0 #1f6fc0,0 0 14px rgba(78,168,255,.35)}
.pb.lock{opacity:.4}
.heat{display:grid;gap:4px;font-size:12.5px;font-weight:700;margin:4px 0}
.tips{display:flex;flex-wrap:wrap;gap:6px}.tips span{font-size:11.5px;font-weight:700;background:var(--bg2);border-radius:8px;padding:4px 8px}
/* 조립 */
#asmWrap{display:grid;gap:12px}
@media(min-width:900px){#asmWrap{grid-template-columns:1.3fr 1fr}}
#asm3d{position:relative;height:min(56vh,440px);border-radius:16px;overflow:hidden;background:#111827;border:1px solid var(--line);box-shadow:0 16px 36px rgba(0,0,0,.45)}
#asm3d canvas{position:absolute;inset:0}
.asmFloat{position:absolute;left:50%;top:18%;transform:translate(-50%,0) scale(.6);z-index:3;font-family:var(--display);font-size:30px;opacity:0;pointer-events:none;text-shadow:0 4px 16px rgba(0,0,0,.6);transition:all .25s}
.asmFloat.show{opacity:1;transform:translate(-50%,-10px) scale(1)}.asmFloat.good{color:#b6ff6a}.asmFloat.bad{color:#ff8a8d}
.asmHint{font-size:14px;background:var(--bg2);border-radius:10px;padding:10px 12px;line-height:1.5}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.part{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#2c3545,#222a37);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:13.5px;box-shadow:0 4px 0 #0c1017;text-align:left}
.part span{font-size:22px}
.part:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1017}
.part.picked{border-color:var(--good)}
.part.hintme{border-color:var(--gold);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 4px 0 #0c1017,0 0 18px rgba(255,211,90,.6)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tbox{display:grid;gap:10px}
.tbar{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#3a1f2a,#2b2f3a 30%,#2b2f3a 70%,#3a1f2a);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);overflow:hidden}
.tbar .zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#7af0ab,#3ddc84);opacity:.85}
.tbar .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff}
/* 광고 */
#adWrap{display:grid;gap:12px}
@media(min-width:900px){#adWrap{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}#adStage{position:sticky;top:76px;align-self:start}}

.chipBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0c1017}

.tool span{font-size:24px}

.hs-solder{width:36px;height:36px;font-size:15px;background:rgba(255,120,40,.3);border-color:#ffb27a}
.hs-solder em{position:absolute;inset:-6px;border-radius:50%;border:4px solid transparent}

.hs.ok{pointer-events:none;animation:none;background:rgba(61,220,132,.7);border-color:#3ddc84;transform:translate(-50%,-50%) scale(.6);opacity:.0;transition:all .4s}

const L=(k,id)=>ALL_LISTS[k].find(x=>x.id===id)||ALL_LISTS[k][0];
function camScore(d){
  let s=0;const mods=d.cams||[];const used={};
  mods.forEach((m,i)=>{const se=L('sensor',m.sensor),ro=L('role',m.role);let q=se.q*(1+(m.ois?.12:0))*(1+(2.4-(m.ap||2.2))*.12);
    if(ro.id==='main'&&!used.main){s+=q;used.main=1;}else{const first=!used[ro.id];used[ro.id]=1;s+=first?ro.v*(.5+se.q/100)+q*.12:q*.04;}});
  s+=L('flash',d.flash).q+L('front',d.front).q*.5+L('video',d.video).q*.5;
  if(d.feats&&(d.feats.includes('ai')||d.feats.includes('odai')))s*=1.08;

  const f=L('form',d.form),m=L('mat',d.mat),p=L('panel',d.panel),r=L('res',d.res),h=L('hz',d.hz),cu=L('cut',d.cut),ra=L('ram',d.ram),st=L('stor',d.stor),b=L('batt',d.batt),cg=L('chg',d.chg);

  const scr=p.q*.55+r.q*.35+h.q*.9+size*4+cu.q*.4;
  const yy=d._y||S.year;const lim=chipLimit(d);const cq=chipQ(d.chipSpec,yy,lim);const cst=d.chipSpec?chipStats(d.chipSpec,{limit:lim}):null;
  const perf=cq*.75+ra.q*.35+st.q*.25+(f.perf||0)+feats.reduce((a,x)=>a+(x.perf||0),0);
  const cam=camScore(d);
  const draw=(p.pw+h.pw)*size*.35+(cst?cst.power*.3:.4)-(cst&&cst.modem?.15:0)+(d.feats||[]).length*.03+(f.id==='fold'||f.id==='tri'||f.id==='roll'?.8:0);
  const bat=(d.mah||900)*b.e/(draw*80+60)*10+cg.q*.9+((d.feats||[]).includes('wchg')?4:0);
  const fea=feats.reduce((a,x)=>a+x.s,0);

const FRONTIER={};
function frontier(year){if(FRONTIER[year])return FRONTIER[year];
  const best=(list)=>list.filter(x=>x.y<=year).reduce((a,x)=>(x.q??x.des??0)>(a.q??a.des??0)?x:a,list[0]);
  const forms=FORMS.filter(x=>x.y<=year);const fb=forms.reduce((a,x)=>x.des>a.des?x:a,forms[0]);
  const matB=MATS.filter(x=>x.y<=year).reduce((a,x)=>x.des>a.des?x:a,MATS[0]);
  const sens=best(SENSORS);const _spec=frontierSpec(year);const roles=ROLES.filter(r=>r.y<=year&&r.id!=='main');
  const d={form:fb.id,mat:matB.id,panel:best(PANELS).id,res:best(RES).id,hz:best(HZ).id,cut:best(CUTS).id,chipSpec:_spec,_y:year,ram:best(RAM).id,stor:best(STOR).id,
    batt:(BATT.filter(x=>x.y<=year).slice(-1)[0]||BATT[0]).id,chg:best(CHG).id,flash:best(FLASH).id,front:best(FRONT).id,video:(VIDEO.filter(x=>x.y<=year).slice(-1)[0]||VIDEO[0]).id,
    mah:maxMah(year)*.85,size:6.4,thin:6,cams:year>=2002?[{role:'main',sensor:sens.id,ois:year>=2015,ap:apMin(year)},...roles.slice(0,3).map(r=>({role:r.id,sensor:sens.id,ois:false,ap:2.2}))]:[],
    feats:FEATS.filter(x=>x.y<=year).sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.id)};
  if(year<2007){d.size=2.4;}
  const s=scores(d);for(const k in s)s[k]=Math.max(8,s[k]*1.0);
  s._cost=rawCost(Object.assign({},d,{form:year>=2007?'smart':'bar',size:year>=2007?6.4:2.4}));FRONTIER[year]=s;return s;}
const maxMah=y=>Math.round(900+Math.max(0,y-2000)*190+Math.max(0,y-2015)*60);
const apMin=y=>y>=2020?1.4:y>=2016?1.7:y>=2012?2:2.4;
function appeal(d,year=S.year){
  const s=scores(d),fr=frontier(year);const w=Object.assign({},W0);if(S.trend&&S.trend.y===year)w[S.trend.k]*=1.6;
  let tw=0,a=0;const norm={};for(const k in w){norm[k]=clamp(s[k]/fr[k],0,1.35);a+=w[k]*norm[k];tw+=w[k];}a/=tw;
  const f=L('form',d.form);a+=((d.asmQ==null?85:d.asmQ)-85)/500;const nov=f.novel?f.novel*Math.max(0,1-(year-f.y)/6):0;
  // 스마트폰 시대에 피처폰은 매력 감소
  const featAge=!f.smart&&year>=2009?clamp((year-2009)*.07,0,.55):0;
  return {a:clamp(a+nov-featAge,0,1.6),norm,s};}
function unitCost(d){return Math.round(rawCost(d)+asm());}
function rawCost(d){
  let c=0;const g=(k,id)=>L(k,id).c||0;

  c+=(d.mah||900)*L('batt',d.batt).c;
  for(const m of d.cams||[])c+=L('sensor',m.sensor).c+L('role',m.role).c+(m.ois?6000:0)+Math.max(0,(2.4-(m.ap||2.4)))*12000;

const asm=()=>[0,9000,7000,5500,4500,3500,2500][S.fac]||5000;
const FAC=[null,{cap:15000,cost:0},{cap:50000,cost:2e9},{cap:150000,cost:1.5e10},{cap:400000,cost:8e10},{cap:1e6,cost:4e11},{cap:3e6,cost:2e12}];

function fixDesign(d){
  const f=L('form',d.form);d.size=clamp(d.size||f.sz[0],f.sz[0],f.sz[1]);
  if(!f.smart){d.cut='bezel';d.hz='60';}

/* ======================= 게임 진행 (1주) ======================= */
function weekTick(){
  const y=S.year;let rev=0,cost=0;
  // 연구
  // 판매
  const active=S.prods.filter(p=>p.on);
  const M=marketWeek(y)*(S.ev&&S.ev.k==='recess'?.7:1);const rivals=S.rivals.reduce((a,r)=>a+Math.pow(r.ph?r.ph.a:r.str*.8,3)*brandF(r.rep)*Math.max(.35,1-(((S.week+(y-(r.ph?r.ph.y:y))*52-(r.ph?r.ph.w||1:1))/52)*.25)),0);
  let mine=0;for(const p of active){const age=(S.week+(y-p.y)*52-p.w)/52;p.age=age;p.app=appeal(p.d).a;
    // 오래될수록 경쟁사가 값을 내려서 내 폰의 '적정가'도 떨어져요
    p.fair=Math.round(fairPrice(p.d,p.app)*Math.max(.45,1-age*.32)/1000)*1000;
    const pf=p.d.price/p.fair;p.pfac=pf<=1?1+.7*(1-pf):Math.exp(-4.2*(pf-1));
    p.hype=Math.max(0,(p.hype||0)*.88);p.wt=Math.pow(p.app,3)*brandF(S.rep)*(1+p.hype)*p.pfac*Math.max(.03,Math.exp(-age*1.5));mine+=p.wt;}
  const tot=mine+rivals;
  for(const p of active){let u=Math.round(M*p.wt/tot*rand(.9,1.1));p.queue=p.queue||[];p.queue.forEach(q=>q.wk--);p.stock+=p.queue.filter(q=>q.wk<=0).reduce((a,q)=>a+q.n,0);p.queue=p.queue.filter(q=>q.wk>0);
    if(S.ev&&S.ev.k==='viral'&&S.ev.pid===p.id)u=Math.round(u*1.8);const sold=Math.min(u,p.stock);p.lost=(p.lost||0)+(u-sold);p.stock-=sold;p.sold+=sold;p.rev+=sold*p.d.price;rev+=sold*p.d.price;p.last=sold;p.wantLast=u;
    p.hist.push(sold);if(p.hist.length>104)p.hist.shift();S.totalSold+=sold;
    if(p.auto){const need=Math.max(u,500)*3-p.stock-p.queue.reduce((a,q)=>a+q.n,0);const n=Math.floor(Math.min(need,capNow()*2-queued(),S.money*.6/p.uc)/100)*100;if(n>=100)order(p,n,true);}
    // 팬 · 평판
    S.fans+=sold*.02*(p.rt/10);
    if(sold>0&&p.rt>=6.5)S.rep=Math.min(100,S.rep+Math.min(.35,sold/2e5*(p.rt-6)));
    if(p.rt<6&&sold>0)S.rep=Math.max(0,S.rep-.05);
    // 창고비: 안 팔린 재고는 매주 원가의 2%
    const store=p.stock*p.uc*.02;
    // 반품 · 수리비: 내구성 · 조립 품질 · 폼팩터에 따라 달라요
    const dr=defectRate(p);const ret=sold*dr*p.d.price*.9;p.dr=dr;
    // 생산 라인 · A/S 센터 유지비 (팔든 안 팔든 매주 나가요)
    const line=lineCost(p);
    const pp=sold*(p.d.price-p.uc)-ret-store-line;p.wkProfit=pp;p.profit=(p.profit||0)+pp;
    p.lossWk=pp<0?(p.lossWk||0)+1:0;if(p.lossWk===4)news(`📉 <b>「${esc(p.d.name)}」 적자 중!</b> 4주째 손해 · 가격을 바꾸거나 단종을 생각해 보세요`);
    if(dr>.08&&sold>0)S.rep=Math.max(0,S.rep-dr*.4);
    cost+=store+ret+line;}
  if(S.rep>15)S.rep=Math.max(15,S.rep-.03);else S.rep=Math.min(15,S.rep+.02);S.rep=Math.max(3,S.rep);
  // 고정비 (월급 · 유지비)
  const fixed=(3e6+Math.pow(S.lab,2.4)*3e6+Math.pow(S.fac,2.4)*4e6)*(1+(y-2000)*.06);cost+=fixed;S.lastFixed=fixed;
  // 분기마다 법인세 (이익의 22%)
  if(S.qStart==null)S.qStart=S.money;if(S.week%13===0){const prof=S.money+rev-cost-S.qStart;if(prof>0){const tax=Math.round(prof*.22);cost+=tax;news(`🏛️ 분기 법인세 ${won(tax)} 냈어요 (이번 분기 이익의 22%)`);}S.qStart=S.money+rev-cost;}
  S.money+=rev-cost;S.totalRev+=rev;S.lastProfit=rev-cost;S.lastRev=rev;

function renderPreview(){const d=S.proj&&S.proj.d;if(!d||!$('#preview'))return;const ap=appeal(d),uc=unitCost(d),fair=fairPrice(d,ap.a);

    const sens=SENSORS.filter(x=>has('sensor',x.id)&&avail(x));const s=sens.length>1?sens[sens.length-2]:sens[0];d.cams.push({role:d.cams.length?roles[0].id:'main',sensor:(d.cams.length?s:sens[sens.length-1]).id,ois:false,ap:2.2});renderDesign();});

function drawCharts(){$$('canvas[data-chart]').forEach(cv=>{const p=S.prods.find(x=>x.id==cv.dataset.chart);if(!p)return;const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;const c=cv.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);
  const h=p.hist,W=r.width,H=r.height;if(h.length<2){c.fillStyle='#97a1b3';c.font='12px sans-serif';c.fillText('판매 그래프는 몇 주 뒤에 나와요',10,H/2);return;}const mx=Math.max(...h,1);
  c.strokeStyle='rgba(255,255,255,.08)';for(let i=1;i<4;i++){c.beginPath();c.moveTo(0,H*i/4);c.lineTo(W,H*i/4);c.stroke();}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(78,168,255,.45)');g.addColorStop(1,'rgba(78,168,255,0)');c.beginPath();h.forEach((v,i)=>{const x=i/(h.length-1)*W,y=H-6-v/mx*(H-20);i?c.lineTo(x,y):c.moveTo(x,y);});

function sfx(k){try{if(!SFX)SFX=new (window.AudioContext||window.webkitAudioContext)();const c=SFX,t=c.currentTime,g=c.createGain();g.connect(c.destination);
  if(k==='drill'){const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(220,t+.45);const l=c.createOscillator();l.frequency.value=38;const lg=c.createGain();lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.08,t);g.gain.linearRampToValueAtTime(0,t+.5);o.connect(g);o.start(t);l.start(t);o.stop(t+.5);l.stop(t+.5);}
  else{const n=c.createBuffer(1,c.sampleRate*.3,c.sampleRate),dd=n.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=n;const f=c.createBiquadFilter();f.type=k==='solder'?'highpass':'bandpass';f.frequency.value=k==='solder'?4000:k==='glue'?900:2500;
    const len=k==='solder'?.3:k==='glue'?.08:.05;g.gain.setValueAtTime(k==='glue'?.05:.25,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f);f.connect(g);s.start(t);s.stop(t+len+.02);}}catch(e){}}

function asmQuality(){return Math.round(clamp(100-ASM.wrong*3,60,100));}
function asmTools(){const need=ASM_SEQ[ASM.i]&&ASM_SEQ[ASM.i].t;$$('[data-tool]').forEach(b=>{b.classList.toggle('on',b.dataset.tool===ASM.tool);b.classList.toggle('need',b.dataset.tool===need&&ASM.tool!==need);});}
function asmStep(){const st=ASM_SEQ[ASM.i];$('#asmCnt').textContent=`${Math.min(ASM.i,ASM_SEQ.length)}/${ASM_SEQ.length}`;$('#asmBar').style.width=(ASM.i/ASM_SEQ.length*100)+'%';$('#asmQ').textContent=`품질 ${asmQuality()}%`;
  if(!st){asmFinish();return;}
  $('#asmHint').innerHTML=`<b>${ASM.i+1}.</b> ${st.x}`;asmTools();
  const ov=$('#asmOv');ov.innerHTML='';ASM.spots=[];ov.classList.toggle('glueMode',st.t==='glue');
  if(st.t==='flip'){ASM.busy=true;const go=()=>{ASM.busy=false;ASM.i++;asmStep();};if(ASM.ctl)ASM.ctl.flipOver().then(go);else setTimeout(go,300);return;}
  const pts=st.t==='hand'?(ASM.ctl?[ASM.ctl.partPos(st.p)]:[null]):(ASM.ctl?ASM.ctl.pts(st.p,st.t):[null,null]);
  pts.forEach((p,k)=>{const e=document.createElement(st.t==='glue'?'i':'button');e.className=st.t==='glue'?'gdot':'hs hs-'+st.t;
    if(st.t!=='glue'){e.innerHTML=st.t==='hand'?'<span>👆</span>':st.t==='drill'?'<span>⊕</span>':st.t==='plug'?'<span>🔌</span>':'<span>✦</span><em></em>';
      if(st.t==='solder'){e.onpointerdown=ev=>{ev.stopPropagation();asmSolderStart(k,e);};e.onpointerup=e.onpointerleave=()=>asmSolderStop(e);}else e.onclick=ev=>{ev.stopPropagation();asmTap(k,e);};}
    if(!ASM.ctl){e.style.left=(20+(k*25)%60)+'%';e.style.top=(35+Math.floor(k/3)*15)+'%';}

function asmPos(){if(!ASM.ctl||!ASM.spots.length)return;const st=ASM_SEQ[ASM.i];if(!st)return;

  const sc=ASM.ctl.project(ASM.spots.map(s=>s.p));sc.forEach((q,k)=>{const el=ASM.spots[k].el;el.style.left=q.x+'px';el.style.top=q.y+'px';});}
function asmNeed(t,el){if(ASM.tool===t)return true;ASM.wrong++;$('#asmQ').textContent=`품질 ${asmQuality()}%`;const T=TOOLS.find(x=>x[0]===t);floatTxt(`${T[1]} ${T[2]}(으)로 해요!`,'bad');buzz();
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}asmTools();return false;}
function asmSpotDone(k){const s=ASM.spots[k];s.done=true;s.el.classList.add('ok');if(ASM.spots.every(x=>x.done)){ASM.busy=true;setTimeout(()=>{ASM.busy=false;ASM.i++;asmStep();},350);}}

  if(st.t==='hand'){ASM.busy=true;el.classList.add('ok');sfx('click');floatTxt('👍 착!','good');const go=()=>{ASM.busy=false;ASM.i++;asmStep();};if(ASM.ctl)ASM.ctl.place(st.p).then(go);else setTimeout(go,300);return;}

function asmSolderStart(k,el){if(ASM.busy||ASM.done)return;const st=ASM_SEQ[ASM.i];const s=ASM.spots[k];if(s.done)return;if(!asmNeed(st.t,el))return;

function asmGlue(e){const st=ASM_SEQ[ASM.i];if(!st||st.t!=='glue'||ASM.busy)return;const r=$('#asmOv').getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;

function floatTxt(t,k){const f=$('#asmFloat');if(!f)return;f.textContent=t;f.className='asmFloat show '+k;clearTimeout(floatTxt.t);floatTxt.t=setTimeout(()=>{f.className='asmFloat';},900);}

function updTop(){if(!S)return;$('#coName').textContent=S.name;$('#logo').textContent=S.name[0]||'P';$('#money').firstChild.nodeValue=won(S.money);$('#yr').textContent=S.year;$('#mo').textContent=month();$('#rep').textContent=Math.round(S.rep);
  const pr=S.lastProfit||0;$('#wkProfit').textContent='지난주 '+(pr>=0?'+':'')+won(pr);$('#wkProfit').style.color=pr>=0?'var(--good)':'var(--bad)';}
function setTab(t){if(tab==='home'&&t!=='home'&&typeof adCleanup==='function')adCleanup();if(t!=='chips')CE=null;tab=t;$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();scrollTo(0,0);}
function render(){if(tab!=='home'&&typeof adCleanup==='function')adCleanup();({home:renderHome,chips:renderChips,prods:renderProds,research:renderResearch,company:renderCompany})[tab]();}
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
window.__pt={get S(){return S;},weekTick,appeal,unitCost,fairPrice,frontier,blankDesign,scores,chipStats,autoPack,frontierSpec,newProject,pickChip,devCost,devWeeks,rating};
// 시작
{const o=load();if(o){$('#bCont').hidden=false;$('#bCont').textContent=`이어서 하기 · ${o.name} (${o.year}년)`;}
 $('#bCont').onclick=()=>{S=load();$('#start').hidden=true;updTop();render();};
 $('#bNew').onclick=()=>{if(load()&&!confirm('새 회사를 세우면 저장된 회사가 사라져요. 계속할까요?'))return;newGame(($('#nameIn').value||'').trim()||'우주전자');$('#start').hidden=true;updTop();render();
