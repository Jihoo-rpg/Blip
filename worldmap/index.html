<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월드 아틀라스 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: full-screen cartography workstation — top menubar, left tool rail, map stage, right inspector. */
:root {
  --bg: #e9edf0;
  --panel: #f7f8f9;
  --panel-2: #eceff2;
  --panel-3: #e1e6ea;
  --line: #d2d8de;
  --line-2: #c0c8cf;
  --fg: #1a2228;
  --fg-2: #4f5b65;
  --fg-3: #85909a;
  --accent: #946512;
  --accent-fg: #ffffff;
  --accent-soft: rgba(148, 101, 18, .12);
  --danger: #b13a2c;
  --danger-soft: rgba(177, 58, 44, .1);
  --ok: #2e7a4c;
  --warn: #a46600;
  --scrim: rgba(18, 24, 30, .42);
  --shadow: 0 10px 32px rgba(16, 24, 32, .16), 0 2px 6px rgba(16, 24, 32, .08);
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mapfont: "Nanum Myeongjo", "AppleMyungjo", "Batang", "Noto Serif KR", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1316; --panel: #151b1f; --panel-2: #1b2327; --panel-3: #232d32; --line: #283238; --line-2: #34414a;
    --fg: #e3e8eb; --fg-2: #a3aeb5; --fg-3: #6b7780;
    --accent: #dba84a; --accent-fg: #1b1405; --accent-soft: rgba(219, 168, 74, .15);
    --danger: #e0705f; --danger-soft: rgba(224, 112, 95, .14); --ok: #5cbf85; --warn: #e2a640;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 12px 36px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1316; --panel: #151b1f; --panel-2: #1b2327; --panel-3: #232d32; --line: #283238; --line-2: #34414a;
  --fg: #e3e8eb; --fg-2: #a3aeb5; --fg-3: #6b7780;
  --accent: #dba84a; --accent-fg: #1b1405; --accent-soft: rgba(219, 168, 74, .15);
  --danger: #e0705f; --danger-soft: rgba(224, 112, 95, .14); --ok: #5cbf85; --warn: #e2a640;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 12px 36px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 13px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { display: grid; grid-template-rows: 44px 1fr; height: 100%; }

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--panel);
  border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 8px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line); height: 28px; flex: none; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.brand b { font-family: var(--mapfont); font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
#projName { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; padding: 4px 8px; border-radius: var(--r); cursor: pointer; border: 1px solid transparent; background: none; flex: none; }
#projName:hover { border-color: var(--line); }
.menus { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
.menubtn { background: none; border: 0; padding: 6px 9px; border-radius: var(--r); cursor: pointer; color: var(--fg-2); white-space: nowrap; }
.menubtn:hover, .menubtn.open { background: var(--panel-2); color: var(--fg); }
.spacer { flex: 1; min-width: 4px; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); border: 0; background: none; color: var(--fg-2); cursor: pointer; flex: none; }
.iconbtn:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }
#saveState { font-size: 12px; color: var(--fg-3); white-space: nowrap; padding: 0 8px; display: flex; align-items: center; gap: 6px; flex: none; }
#saveState i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
#saveState.dirty i { background: var(--warn); }
#saveState.err { color: var(--danger); }
#saveState.err i { background: var(--danger); }

.popmenu {
  position: fixed; z-index: 60; min-width: 230px; background: var(--panel); border: 1px solid var(--line-2);
  border-radius: 8px; box-shadow: var(--shadow); padding: 5px; max-height: calc(100% - 60px); overflow: auto;
}
.popmenu button { display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; text-align: left; padding: 7px 10px; border-radius: 5px; cursor: pointer; }
.popmenu button:hover:not(:disabled) { background: var(--accent-soft); }
.popmenu button:disabled { opacity: .4; cursor: default; }
.popmenu button .k { margin-left: auto; color: var(--fg-3); font-family: var(--mono); font-size: 11px; }
.popmenu button .chk { width: 14px; color: var(--accent); font-weight: 700; }
.popmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.popmenu .grp { font-size: 11px; color: var(--fg-3); padding: 6px 10px 3px; letter-spacing: .04em; }

/* ---------- main ---------- */
#main { display: grid; grid-template-columns: 52px 1fr 330px; min-height: 0; }
#main.nopanel { grid-template-columns: 52px 1fr 0; }
#toolbar { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; scrollbar-width: none; }
#toolbar .sep { width: 28px; border-top: 1px solid var(--line); margin: 5px 0; }
.tool { width: 38px; height: 36px; flex: none; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--fg-2); cursor: pointer; position: relative; }
.tool svg { width: 20px; height: 20px; }
.tool:hover { background: var(--panel-2); color: var(--fg); }
.tool.on { background: var(--accent); color: var(--accent-fg); }
.tool .tk { position: absolute; right: 2px; bottom: 1px; font-family: var(--mono); font-size: 8.5px; opacity: .65; }

#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
#optbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 12px; background: var(--panel-2);
  border-bottom: 1px solid var(--line); min-height: 40px; z-index: 5;
}
#optbar .tname { font-weight: 600; white-space: nowrap; }
#optbar .hint { color: var(--fg-3); font-size: 12px; min-width: 0; flex: 1 1 220px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
#optbar label { display: flex; align-items: center; gap: 6px; color: var(--fg-2); white-space: nowrap; font-size: 12px; }
#optbar input[type=range] { width: 110px; accent-color: var(--accent); }
#optbar .val { font-family: var(--mono); font-size: 11px; min-width: 26px; color: var(--fg); }
select, input[type=text], input[type=number], textarea {
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 7px; min-width: 0;
}
textarea { resize: vertical; width: 100%; min-height: 70px; line-height: 1.5; }
select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; }

#mapwrap { position: relative; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#map.c-pan { cursor: grab; } #map.c-panning { cursor: grabbing; } #map.c-cross { cursor: crosshair; } #map.c-none { cursor: none; } #map.c-pointer { cursor: default; } #map.c-move { cursor: move; }

#statusbar {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: flex-end; pointer-events: none; z-index: 4;
}
.chip {
  pointer-events: auto; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; gap: 2px; padding: 3px; backdrop-filter: blur(6px);
}
.chip .iconbtn { width: 28px; height: 28px; }
#zoomPct { font-family: var(--mono); font-size: 11.5px; min-width: 50px; text-align: center; background: none; border: 0; cursor: pointer; padding: 4px; border-radius: 5px; }
#zoomPct:hover { background: var(--panel-2); }
#coords { font-family: var(--mono); font-size: 11.5px; padding: 5px 9px; color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
#hoverInfo { padding: 5px 9px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#hoverInfo:empty { display: none; }
#yearChip { padding: 4px 10px; font-size: 12px; gap: 6px; cursor: pointer; }
#yearChip b { font-family: var(--mono); font-weight: 500; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; }

#compareBanner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 4; background: var(--panel); border: 1px solid var(--danger);
  border-radius: 8px; padding: 6px 8px 6px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; width: max-content; box-shadow: var(--shadow); font-size: 12px; max-width: calc(100% - 20px);
}
#compareBanner .legend { display: flex; gap: 10px; color: var(--fg-2); flex-wrap: wrap; }
#compareBanner .legend span { display: flex; gap: 5px; align-items: center; }

/* ---------- right panel ---------- */
#panel { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; overflow: hidden; }
#main.nopanel #panel { display: none; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 4px 9px; cursor: pointer; color: var(--fg-3); font-weight: 500; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
#panelBody { overflow-y: auto; min-height: 0; padding: 14px 14px 40px; }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ph .bigsw { width: 34px; height: 34px; border-radius: 8px; flex: none; border: 1px solid rgba(0,0,0,.2); position: relative; overflow: hidden; cursor: pointer; }
.ph .bigsw input { position: absolute; inset: -6px; width: 50px; height: 50px; opacity: 0; cursor: pointer; }
.ph h2 { font-family: var(--mapfont); font-size: 19px; margin: 0; font-weight: 800; text-wrap: balance; line-height: 1.25; }
.ph .sub { color: var(--fg-3); font-size: 12px; }
.eyebrow { font-size: 11px; letter-spacing: .06em; color: var(--fg-3); text-transform: uppercase; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.eyebrow::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.form { display: grid; grid-template-columns: 84px 1fr; gap: 7px 10px; align-items: center; }
.form > label { color: var(--fg-2); font-size: 12px; }
.form > .full { grid-column: 1 / -1; }
.form input[type=text], .form input[type=number], .form select { width: 100%; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-bottom: 4px; }
.stat > div { background: var(--panel-2); padding: 8px 9px; min-width: 0; }
.stat b { display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 10.5px; color: var(--fg-3); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--fg-3); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line-2)); }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.block { width: 100%; justify-content: center; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px 2px 7px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 20px; font-size: 12px; }
.tag button { border: 0; background: none; cursor: pointer; color: var(--fg-3); padding: 0 3px; font-size: 14px; line-height: 1; }
.tag button:hover { color: var(--danger); }
.empty { color: var(--fg-3); padding: 20px 4px; text-align: center; line-height: 1.6; }
.note { font-size: 12px; color: var(--fg-3); line-height: 1.55; margin: 6px 0; }

.search { width: 100%; margin-bottom: 10px; padding: 7px 10px !important; }
.clist { display: flex; flex-direction: column; }
.crow { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.crow:hover { background: var(--panel-2); }
.crow.sel { background: var(--accent-soft); }
.crow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .meta { font-family: var(--mono); font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.crow.fallen .nm { color: var(--fg-3); text-decoration: line-through; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; margin-bottom: 8px; background: var(--panel); }
.card h4 { margin: 0 0 5px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.pill { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.pill.war { background: var(--danger-soft); color: var(--danger); }
.pill.peace { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.cur { background: var(--accent-soft); color: var(--accent); }
.yr { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 500; color: var(--fg-3); padding: 4px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
.tbl td.n { text-align: right; font-family: var(--mono); font-size: 11.5px; }
.up { color: var(--ok); } .down { color: var(--danger); }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: calc(100% - 20px); display: grid; grid-template-rows: auto 1fr auto; }
.modal.wide { width: min(780px, 100%); }
.modal header { padding: 14px 16px 10px; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal .mb { padding: 2px 16px 14px; overflow: auto; line-height: 1.55; }
.modal footer { padding: 10px 16px 14px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.radio { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 6px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio input { margin-top: 3px; accent-color: var(--accent); }
.radio small { display: block; color: var(--fg-3); }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.swatches button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.25); cursor: pointer; padding: 0; }
.swatches button.on { outline: 2px solid var(--fg); outline-offset: 1px; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.pcard { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); display: flex; flex-direction: column; }
.pcard.cur { border-color: var(--accent); }
.pcard img { display: block; width: 100%; aspect-ratio: 240 / 152; object-fit: cover; background: var(--panel-3); max-width: 100%; }
.pcard .pi { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.pcard .pi b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .pi small { color: var(--fg-3); }
.vlist { display: flex; flex-direction: column; gap: 4px; }
.vrow { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; }
.vrow .t { font-family: var(--mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.vrow .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

/* ---------- toast ---------- */
#toasts { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 7px; box-shadow: var(--shadow); font-size: 12.5px; animation: tin .18s ease-out; pointer-events: auto; display: flex; gap: 10px; align-items: center; }
.toast.err { background: var(--danger); color: #fff; }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; font-size: 14px; color: var(--fg-2); }
#loading[hidden] { display: none !important; }
#warnBar { background: var(--danger-soft); color: var(--danger); padding: 6px 12px; font-size: 12px; border-bottom: 1px solid var(--line); }

/* map svg classes (only for UI overlays; map colors are inline so exports stay standalone) */
.mlabel { font-family: var(--mapfont); font-weight: 800; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.clabel { font-family: var(--ui); font-weight: 600; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.handle { cursor: grab; }
.handle.fixed { cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ---------- narrow screens ---------- */
@media (max-width: 860px) {
  #main { grid-template-columns: 46px 1fr 0; }
  #main.panelopen #panel { display: grid; position: fixed; right: 0; top: 44px; bottom: 0; width: min(360px, 92vw); z-index: 40; box-shadow: var(--shadow); }
  #panel { display: none; }
  .tool { width: 36px; height: 34px; }
  .menus { overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
  .menus .menubtn { padding: 6px 6px; }
  .spacer { display: none; }
  #panelToggle { display: none; }
  #projName, .brand b { display: none; }
  .brand { border: 0; padding-right: 0; }
  #saveState span { display: none; }
  #coords { display: none; }
  #optbar input[type=range] { width: 80px; }
}
@media (min-width: 861px) { #panelToggleMobile { display: none; } }
.hubbtn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:12px;white-space:nowrap;flex:none}.hubbtn:hover{background:var(--panel-2);color:var(--fg)}
</style>
</head>
<body>
<div id="loading">세계 지도를 불러오는 중…</div>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3.6 2.6 9.2 2.6 12.8 0M5.6 18.4c3.6-2.6 9.2-2.6 12.8 0"/></svg>
      <b>월드 아틀라스</b>
    </div>

/* ---------------------------------------------------------------

   Territory is stored as a fine ownership grid (one cell = one map unit).

   chaining the same arcs, so neighbouring borders always match exactly:
   no gaps, no overlaps, and editing one side moves the other.
---------------------------------------------------------------- */
const Topo = (() => {
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

  /* K: Int32Array of region keys (0 = outside/water). Returns {arcs, W, H} */
  function build(K, W, H, eps = 0.85) {
    const W1 = W + 1, H1 = H + 1, nH = W * H1, nV = W1 * H;
    const B = new Uint8Array(nH + nV), V = new Uint8Array(nH + nV);
    for (let y = 0; y <= H; y++) {
      const r0 = (y - 1) * W, r1 = y * W, base = y * W;
      for (let x = 0; x < W; x++) {
        const a = y > 0 ? K[r0 + x] : 0, b = y < H ? K[r1 + x] : 0;
        if (a !== b) B[base + x] = 1;
      }
    }
    for (let y = 0; y < H; y++) {
      const r = y * W, base = nH + y * W1; let prev = 0;
      for (let x = 0; x <= W; x++) { const b = x < W ? K[r + x] : 0; if (prev !== b) B[base + x] = 1; prev = b; }
    }
    const J = new Uint8Array(W1 * H1);
    for (let y = 0; y <= H; y++) {
      for (let x = 0; x <= W; x++) {
        let d = 0;
        if (x > 0 && B[y * W + x - 1]) d++;
        if (x < W && B[y * W + x]) d++;
        if (y > 0 && B[nH + (y - 1) * W1 + x]) d++;
        if (y < H && B[nH + y * W1 + x]) d++;
        if (d > 2) J[y * W1 + x] = 1;
      }
    }
    const kk = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : K[y * W + x]);
    const eid = (x, y, d) => {
      if (d === 0) return x < W ? y * W + x : -1;
      if (d === 2) return x > 0 ? y * W + x - 1 : -1;
      if (d === 1) return y < H ? nH + y * W1 + x : -1;
      return y > 0 ? nH + (y - 1) * W1 + x : -1;
    };
    const arcs = [];
    function trace(x0, y0, d0) {
      let L, R;
      if (d0 === 0) { L = kk(x0, y0 - 1); R = kk(x0, y0); }
      else if (d0 === 2) { L = kk(x0 - 1, y0); R = kk(x0 - 1, y0 - 1); }
      else if (d0 === 1) { L = kk(x0, y0); R = kk(x0 - 1, y0); }
      else { L = kk(x0 - 1, y0 - 1); R = kk(x0, y0 - 1); }
      const pts = [x0, y0];
      let x = x0, y = y0, d = d0;
      for (;;) {
        V[eid(x, y, d)] = 1; x += DX[d]; y += DY[d];
        if (J[y * W1 + x] || (x === x0 && y === y0)) { pts.push(x, y); break; }
        let nd = -1;
        for (let k = 0; k < 3; k++) {
          const t = k === 0 ? d : k === 1 ? (d + 1) & 3 : (d + 3) & 3;
          const e = eid(x, y, t);
          if (e >= 0 && B[e] && !V[e]) { nd = t; break; }
        }
        if (nd < 0) { pts.push(x, y); break; }
        if (nd !== d) pts.push(x, y);
        d = nd;
      }
      const n = pts.length;
      const closed = pts[0] === pts[n - 2] && pts[1] === pts[n - 1] && !J[y0 * W1 + x0];
      arcs.push({ raw: pts, L, R, closed, a: y0 * W1 + x0, b: pts[n - 1] * W1 + pts[n - 2] });
    }
    for (let y = 0; y <= H; y++) for (let x = 0; x <= W; x++) {
      if (!J[y * W1 + x]) continue;
      for (let d = 0; d < 4; d++) { const e = eid(x, y, d); if (e >= 0 && B[e] && !V[e]) trace(x, y, d); }
    }
    for (let e = 0; e < nH; e++) if (B[e] && !V[e]) trace(e % W, (e / W) | 0, 0);

    for (const a of arcs) {
      a.s = a.raw.length <= 10 ? a.raw.slice() : dpSimplify(a.raw, eps);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let i = 0; i < a.raw.length; i += 2) { const x = a.raw[i], y = a.raw[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      a.bb = [x0, y0, x1, y1];
    }
    return { arcs, W, H };
  }

  /* --- path strings --- */
  function segStr(s, fwd, start) {
    const n = s.length / 2;
    const X = fwd ? (i) => s[2 * i] : (i) => s[2 * (n - 1 - i)];
    const Y = fwd ? (i) => s[2 * i + 1] : (i) => s[2 * (n - 1 - i) + 1];
    let o = start ? 'M' + f1(X(0)) + ' ' + f1(Y(0)) : '';
    if (n === 2) return o + 'L' + f1(X(1)) + ' ' + f1(Y(1));
    o += 'L' + f1((X(0) + X(1)) / 2) + ' ' + f1((Y(0) + Y(1)) / 2);
    for (let i = 1; i < n - 1; i++) o += 'Q' + f1(X(i)) + ' ' + f1(Y(i)) + ' ' + f1((X(i) + X(i + 1)) / 2) + ' ' + f1((Y(i) + Y(i + 1)) / 2);
    return o + 'L' + f1(X(n - 1)) + ' ' + f1(Y(n - 1));
  }
  function loopStr(s, fwd) {
    const n = s.length / 2 - 1; // last point duplicates first
    if (n < 2) return '';
    const X = fwd ? (i) => s[2 * (i % n)] : (i) => s[2 * ((n - (i % n)) % n)];
    const Y = fwd ? (i) => s[2 * (i % n) + 1] : (i) => s[2 * ((n - (i % n)) % n) + 1];
    const mx = (i) => f1((X(i) + X(i + 1)) / 2), my = (i) => f1((Y(i) + Y(i + 1)) / 2);
    let o = 'M' + mx(n - 1) + ' ' + my(n - 1);
    for (let i = 0; i < n; i++) o += 'Q' + f1(X(i)) + ' ' + f1(Y(i)) + ' ' + mx(i) + ' ' + my(i);
    return o + 'Z';
  }
  /* Chain oriented arcs into closed rings. sel: [{i, fwd}] */
  function ringsD(topo, sel) {
    const arcs = topo.arcs; let d = '';
    const open = [];
    for (const o of sel) { const a = arcs[o.i]; if (a.closed) d += loopStr(a.s, o.fwd); else open.push(o); }
    if (!open.length) return d;
    const startOf = (o) => (o.fwd ? arcs[o.i].a : arcs[o.i].b), endOf = (o) => (o.fwd ? arcs[o.i].b : arcs[o.i].a);
    const byStart = new Map();
    open.forEach((o, k) => { const s = startOf(o); let l = byStart.get(s); if (!l) byStart.set(s, (l = [])); l.push(k); });
    const used = new Uint8Array(open.length);
    for (let k = 0; k < open.length; k++) {
      if (used[k]) continue;
      used[k] = 1; const ringStart = startOf(open[k]);
      d += segStr(arcs[open[k].i].s, open[k].fwd, true);
      let end = endOf(open[k]); let guard = 0;
      while (end !== ringStart && guard++ < 1e6) {
        const l = byStart.get(end); let nk = -1;
        if (l) for (let q = 0; q < l.length; q++) if (!used[l[q]]) { nk = l[q]; break; }
        if (nk < 0) break;
        used[nk] = 1; d += segStr(arcs[open[nk].i].s, open[nk].fwd, false); end = endOf(open[nk]);
      }
      d += 'Z';
    }
    return d;
  }
  /* group arcs by key → {key: [{i,fwd}]} */
  function groups(topo) {
    const g = new Map();
    const add = (k, o) => { let l = g.get(k); if (!l) g.set(k, (l = [])); l.push(o); };
    topo.arcs.forEach((a, i) => { if (a.L) add(a.L, { i, fwd: true }); if (a.R) add(a.R, { i, fwd: false }); });
    return g;
  }
  /* rings of the union of keys satisfying pred */
  function unionD(topo, pred) {
    const sel = [];
    topo.arcs.forEach((a, i) => { const l = pred(a.L), r = pred(a.R); if (l && !r) sel.push({ i, fwd: true }); else if (r && !l) sel.push({ i, fwd: false }); });
    return ringsD(topo, sel);
  }
  /* stroke path of arcs satisfying pred(L,R) */
  function strokeD(topo, pred) {
    let d = '';
    for (const a of topo.arcs) if (pred(a.L, a.R)) d += a.closed ? loopStr(a.s, true) : segStr(a.s, true, true);
    return d;
  }

  /* Region stats + label anchor (pole of inaccessibility via chamfer distance) */
  function regionStats(K, W, H) {
    const n = W * H; const D = new Float32Array(n); const INF = 1e9;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, k = K[i];
      const b = x === 0 || y === 0 || x === W - 1 || y === H - 1 || K[i - 1] !== k || K[i + 1] !== k || K[i - W] !== k || K[i + W] !== k;
      D[i] = b ? 1 : INF;
    }
    const S2 = 1.4142;
    for (let y = 1; y < H; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x; if (D[i] === 1) continue;
      let v = D[i];
      const a = D[i - 1] + 1, b = D[i - W] + 1, c = D[i - W - 1] + S2, e = D[i - W + 1] + S2;
      if (a < v) v = a; if (b < v) v = b; if (c < v) v = c; if (e < v) v = e; D[i] = v;
    }
    for (let y = H - 2; y >= 0; y--) for (let x = W - 2; x > 0; x--) {
      const i = y * W + x; if (D[i] === 1) continue;
      let v = D[i];
      const a = D[i + 1] + 1, b = D[i + W] + 1, c = D[i + W + 1] + S2, e = D[i + W - 1] + S2;
      if (a < v) v = a; if (b < v) v = b; if (c < v) v = c; if (e < v) v = e; D[i] = v;
    }
    const st = new Map();
    for (let i = 0; i < n; i++) {
      const k = K[i]; if (!k) continue;
      let s = st.get(k);
      if (!s) st.set(k, (s = { count: 0, best: -1, bi: i, sx: 0, sy: 0, x0: W, y0: H, x1: 0, y1: 0 }));
      s.count++;
      const x = i % W, y = (i / W) | 0;
      if (x < s.x0) s.x0 = x; if (x > s.x1) s.x1 = x; if (y < s.y0) s.y0 = y; if (y > s.y1) s.y1 = y;
      // Slight bias toward horizontally wide spots by reading horizontal room
      if (D[i] > s.best) { s.best = D[i]; s.bi = i; }
    }
    for (const s of st.values()) {
      s.lx = (s.bi % W) + 0.5; s.ly = ((s.bi / W) | 0) + 0.5; s.ld = s.best;
      // horizontal room at the label point, for fitting long names
      const row = (s.bi / W) | 0, x = s.bi % W, k = K[s.bi], base = row * W;
      let lx = x, rx = x;
      while (lx > 0 && K[base + lx - 1] === k && x - lx < 400) lx--;
      while (rx < W - 1 && K[base + rx + 1] === k && rx - x < 400) rx++;
      s.hw = rx - lx + 1; s.lx = (lx + rx + 1) / 2;

  }

  /* Rasterize polygon with non-zero winding. cb(cellIndex, winding) */
  function rasterPoly(pts, W, H, cb) {
    const n = pts.length / 2; if (n < 3) return;
    let miny = Infinity, maxy = -Infinity;
    for (let i = 1; i < pts.length; i += 2) { if (pts[i] < miny) miny = pts[i]; if (pts[i] > maxy) maxy = pts[i]; }
    const y0 = Math.max(0, Math.floor(miny)), y1 = Math.min(H - 1, Math.ceil(maxy));
    const xs = [];
    for (let y = y0; y <= y1; y++) {
      const yc = y + 0.5; xs.length = 0;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const ax = pts[2 * i], ay = pts[2 * i + 1], bx = pts[2 * j], by = pts[2 * j + 1];
        if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push({ x: ax + ((yc - ay) / (by - ay)) * (bx - ax), d: by > ay ? 1 : -1 });
      }
      if (xs.length < 2) continue;
      xs.sort((a, b) => a.x - b.x);
      let w = 0; for (const c of xs) w += c.d;
      let prev = -Infinity;
      for (const c of xs) {
        if (w !== 0) {
          const xa = Math.max(0, Math.ceil(prev - 0.5)), xb = Math.min(W - 1, Math.ceil(c.x - 0.5) - 1);
          for (let x = xa; x <= xb; x++) cb(y * W + x, w);
        }
        w -= c.d; prev = c.x;
      }
    }
  }

  return { build, ringsD, groups, unionD, strokeD, regionStats, rasterPoly, segStr, loopStr };
})();

/* ===== 20-model.js ===== */
/* ---------------------------------------------------------------
   Data model.
   MAP DATA (grids) and COUNTRY/INFO DATA (objects) are kept apart:
     P.land     Uint8  0 sea · 1 land · 2 lake
     P.terrain  Uint8  terrain type of land cells
     P.owner    Uint16 country id (0 = unclaimed)
     P.occ      Uint16 occupying country id (0 = none)
     P.data     { countries, cities, features, wars, nextId, year, ... }
---------------------------------------------------------------- */
const LAYERS = ['land', 'terrain', 'owner', 'occ'];
const LAYER_TYPES = { land: Uint8Array, terrain: Uint8Array, owner: Uint16Array, occ: Uint16Array };
const TERRAINS = [
  { id: 0, name: '평야' }, { id: 1, name: '숲' }, { id: 2, name: '사막' },
  { id: 3, name: '툰드라' }, { id: 4, name: '습지' }, { id: 5, name: '고원' },
];
const GOVS = ['제정(제국)', '공화제', '입헌군주제', '절대군주제', '연방제', '국가연합', '신정', '과두정', '군사정권', '부족연맹', '기타'];
const WAR_STATES = ['평화', '전쟁 중', '휴전', '냉전', '중립'];
const CITY_ICONS = [
  { id: 'dot', name: '점' }, { id: 'square', name: '사각' }, { id: 'star', name: '별' },
  { id: 'castle', name: '성채' }, { id: 'port', name: '항구' }, { id: 'ruin', name: '유적' },
];

let P = null; // current project

function blankProject(W = 1200, H = 760) {
  const n = W * H;
  return {
    id: uid(), name: '새 세계', created: Date.now(), updated: Date.now(), W, H, kmPerCell: 10, seed: 0,
    land: new Uint8Array(n), terrain: new Uint8Array(n), owner: new Uint16Array(n), occ: new Uint16Array(n),
    data: { countries: [], cities: [], features: [], wars: [], nextId: 1, year: { num: 252, era: 'CE' }, activeYearId: null, settings: {} },
  };
}
const D = () => P.data;
const cById = (id) => D().countries.find((c) => c.id === id) || null;
const cityById = (id) => D().cities.find((c) => c.id === id) || null;
const featById = (id) => D().features.find((f) => f.id === id) || null;
const activeCountries = () => D().countries.filter((c) => c.status !== 'fallen');
const yearText = (y) => (y ? `${y.num} ${y.era || ''}`.trim() : '—');

function newCountry(props = {}) {
  const d = D();
  const id = d.nextId++;
  const c = Object.assign({
    id, name: '새 국가 ' + id, color: autoColor(d.countries.length), status: 'active', capitalId: null,
    population: 0, areaOverride: '', gov: '공화제', leader: '', founded: '', allies: [], enemies: [], warStatus: '평화', desc: '',
    lastTerritory: null, fate: '', created: Date.now(),
  }, props);
  d.countries.push(c);
  return c;
}
function countryCells(id) { const o = P.owner, l = P.land, out = []; for (let i = 0; i < o.length; i++) if (o[i] === id && l[i] === 1) out.push(i); return out; }
function countCells() {
  const cnt = new Map(); const o = P.owner, l = P.land;
  for (let i = 0; i < o.length; i++) if (l[i] === 1 && o[i]) cnt.set(o[i], (cnt.get(o[i]) || 0) + 1);
  return cnt;
}
const cellArea = () => P.kmPerCell * P.kmPerCell;
function cityCountry(city) {
  const x = Math.floor(city.x), y = Math.floor(city.y);
  if (x < 0 || y < 0 || x >= P.W || y >= P.H) return 0;
  const i = y * P.W + x; return P.land[i] === 1 ? P.owner[i] : 0;
}

/* ---------- history (undo/redo) ----------
   Grid changes are stored as diffs (changed indices + old/new values),
   object changes as JSON snapshots. */
const Hist = {
  stack: [], redoStack: [], cur: null, max: 80, bufs: null,
  snapObjs() { return JSON.stringify(P.data); },
  begin(label, layers = true) {
    if (this.cur) this.end();
    const n = P.W * P.H;
    if (layers) {
      if (!this.bufs || this.bufs.n !== n) { this.bufs = { n }; for (const L of LAYERS) this.bufs[L] = new LAYER_TYPES[L](n); }
      for (const L of LAYERS) this.bufs[L].set(P[L]);
    }
    this.cur = { label, layers, objs: this.snapObjs() };
  },
  cancel() {
    const c = this.cur; if (!c) return; this.cur = null;
    if (c.layers) for (const L of LAYERS) P[L].set(this.bufs[L]);
    P.data = JSON.parse(c.objs);
    App.changed(new Set(LAYERS), true, false);
  },
  end() {
    const c = this.cur; if (!c) return null; this.cur = null;
    const after = this.snapObjs();
    const e = { label: c.label, ob: c.objs, oa: after, diffs: {}, ts: Date.now() };
    let changed = c.objs !== after; const flags = new Set();
    if (c.layers) {
      for (const L of LAYERS) {
        const a = this.bufs[L], b = P[L]; const idx = [];
        for (let i = 0; i < b.length; i++) if (a[i] !== b[i]) idx.push(i);
        if (idx.length) {
          const T = LAYER_TYPES[L]; const I = Int32Array.from(idx); const oa = new T(I.length), ob = new T(I.length);
          for (let k = 0; k < I.length; k++) { oa[k] = a[I[k]]; ob[k] = b[I[k]]; }
          e.diffs[L] = { i: I, a: oa, b: ob }; flags.add(L); changed = true;
        }
      }
    }
    if (!changed) return null;
    this.stack.push(e); if (this.stack.length > this.max) this.stack.shift();
    this.redoStack = [];
    App.changed(flags, c.objs !== after, true);
    return e;
  },
  apply(e, which) {
    const flags = new Set();
    for (const L in e.diffs) { const d = e.diffs[L], v = d[which], arr = P[L]; for (let k = 0; k < d.i.length; k++) arr[d.i[k]] = v[k]; flags.add(L); }
    P.data = JSON.parse(which === 'a' ? e.ob : e.oa);
    return flags;
  },
  undo() {
    if (this.cur) this.end();
    const e = this.stack.pop(); if (!e) { toast('되돌릴 작업이 없습니다'); return; }
    const f = this.apply(e, 'a'); this.redoStack.push(e);
    App.changed(f, true, true); toast('실행 취소: ' + e.label);
  },
  redo() {
    const e = this.redoStack.pop(); if (!e) { toast('다시 실행할 작업이 없습니다'); return; }
    const f = this.apply(e, 'b'); this.stack.push(e);
    App.changed(f, true, true); toast('다시 실행: ' + e.label);
  },
  clear() { this.stack = []; this.redoStack = []; this.cur = null; },
};
/* run fn as a single undoable step */
function commit(label, fn, layers = true) {
  Hist.begin(label, layers);
  try { fn(); } catch (err) { Hist.cancel(); console.error(err); toast('작업 실패: ' + (err.message || err), { err: true }); return null; }
  return Hist.end();
}

/* ---------- grid operations ---------- */
const Ops = {
  stamp(cx, cy, r, fn) {
    const W = P.W, H = P.H; r = Math.max(0.71, r);
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
    const r2 = r * r;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r2) fn(y * W + x);
    }
  },
  /* stroke from (ax,ay) to (bx,by) */
  strokeSeg(ax, ay, bx, by, r, fn) {
    const L = Math.hypot(bx - ax, by - ay); const step = Math.max(0.5, r * 0.4); const n = Math.max(1, Math.ceil(L / step));
    for (let k = 1; k <= n; k++) this.stamp(ax + ((bx - ax) * k) / n, ay + ((by - ay) * k) / n, r, fn);
  },
  /* territory paint filter: mode 'all' | 'unclaimed' | number (only from that country) */
  territoryFn(cid, mode) {
    const own = P.owner, land = P.land, occ = P.occ;
    return (i) => {
      if (land[i] !== 1) return;
      const o = own[i];
      if (o === cid) return;
      if (mode === 'unclaimed' && o !== 0) return;
      if (typeof mode === 'number' && o !== mode) return;
      own[i] = cid; if (occ[i] === cid) occ[i] = 0;
    };
  },
  eraseFn(onlyCid) {
    const own = P.owner, occ = P.occ;
    return (i) => { if (!own[i]) return; if (onlyCid && own[i] !== onlyCid) return; if (occ[i] === own[i]) occ[i] = 0; own[i] = 0; };
  },
  landFn(mode, claimCid) {
    const land = P.land, ter = P.terrain, own = P.owner, occ = P.occ;

const DB_NAME = 'world-atlas-editor';

function encodeProject(p) {
  const layers = {}; for (const L of LAYERS) layers[L] = rleEncode(p[L]);
  return { v: 1, id: p.id, name: p.name, created: p.created, updated: p.updated, W: p.W, H: p.H, kmPerCell: p.kmPerCell, seed: p.seed,
    layers, data: JSON.stringify(p.data), settings: JSON.stringify(p.settings || {}) };
}
function decodeProject(r) {
  if (!r || !r.W || !r.H || !r.layers) throw new Error('프로젝트 형식이 올바르지 않습니다');
  const n = r.W * r.H;
  const p = { id: r.id || uid(), name: r.name || '이름 없는 세계', created: r.created || Date.now(), updated: r.updated || Date.now(), W: r.W, H: r.H, kmPerCell: r.kmPerCell || 10, seed: r.seed || 0 };
  for (const L of LAYERS) p[L] = r.layers[L] ? rleDecode(r.layers[L], LAYER_TYPES[L], n) : new LAYER_TYPES[L](n);
  p.data = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
  p.settings = typeof r.settings === 'string' ? JSON.parse(r.settings || '{}') : r.settings || {};
  normalizeData(p.data);
  return p;
}
function normalizeData(d) {
  d.countries = Array.isArray(d.countries) ? d.countries : []; d.cities = Array.isArray(d.cities) ? d.cities : [];
  d.features = Array.isArray(d.features) ? d.features : []; d.wars = Array.isArray(d.wars) ? d.wars : [];
  d.nextId = Math.max(d.nextId || 1, ...d.countries.map((c) => c.id + 1));
  d.year = d.year || { num: 252, era: 'CE' };
  for (const c of d.countries) { c.allies = c.allies || []; c.enemies = c.enemies || []; c.status = c.status || 'active'; }
  for (const w of d.wars) { w.sideA = w.sideA || []; w.sideB = w.sideB || []; }
}
/* JSON export: map grid data and country info kept in separate sections */
function projectToJSON(p) {
  const r = encodeProject(p); const layers = {};
  for (const L of LAYERS) layers[L] = Array.from(r.layers[L]);
  return { format: 'world-atlas-editor', version: 1, exported: new Date().toISOString(),

}
function projectFromJSON(o) {

const Store = {
  db: null, ok: false, saveTimer: 0, dirty: false, saving: false, lastVersionTs: 0, lastError: null,
  open() {
    return new Promise((res) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { res(false); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore('projects', { keyPath: 'id' });
        d.createObjectStore('projdata', { keyPath: 'id' });
        d.createObjectStore('versions', { keyPath: 'vid', autoIncrement: true }).createIndex('projectId', 'projectId');
        d.createObjectStore('snapshots', { keyPath: 'id' }).createIndex('projectId', 'projectId');
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      req.onsuccess = () => { this.db = req.result; this.ok = true; this.db.onversionchange = () => this.db.close(); res(true); };
      req.onerror = () => res(false);
      req.onblocked = () => res(false);
      setTimeout(() => res(this.ok), 4000);
    });
  },
  _req(store, mode, fn) {

      const os = tx.objectStore(store); let out;
      const r = fn(os); if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error || new Error('저장소 오류')); tx.onabort = () => rej(tx.error || new Error('저장 중단 (저장 공간 부족일 수 있습니다)'));
    });
  },
  put(s, v) { return this._req(s, 'readwrite', (os) => os.put(v)); },
  get(s, k) { return this._req(s, 'readonly', (os) => os.get(k)); },
  del(s, k) { return this._req(s, 'readwrite', (os) => os.delete(k)); },
  all(s) { return this._req(s, 'readonly', (os) => os.getAll()); },

  /* ---- yearly snapshots ---- */
  async listSnapshots() { return this.ok ? (await this.byProject('snapshots', P.id)).sort((a, b) => (a.year.num - b.year.num) || (a.ts - b.ts)) : (this.memSnaps || []).filter((s) => s.projectId === P.id); },
  async putSnapshot(s) { if (this.ok) return this.put('snapshots', s); this.memSnaps = (this.memSnaps || []).filter((x) => x.id !== s.id).concat([s]); },
  async getSnapshot(id) { return this.ok ? this.get('snapshots', id) : (this.memSnaps || []).find((s) => s.id === id); },

const downloadsCap = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, data, mime) {
  let dl = null;
  try { dl = await Promise.race([downloadsCap, new Promise((r) => setTimeout(() => r(null), 1500))]); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('파일을 저장했습니다: ' + filename); return; }
    catch (e) {
      if (e && e.code === 'declined') { toast('파일 저장을 취소했습니다'); return; }
      if (e && e.code === 'rate_limited') { toast('이미 열린 저장 창이 있습니다. 잠시 후 다시 시도하세요', { err: true }); return; }
      if (e && e.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast('파일 저장 실패: ' + (e.message || e.code), { err: true }); return; }
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();

/* ---- hit tests ---- */
function hitCity(sx, sy, r = 10) {
  let best = null, bd = r * r;
  for (const { c, g } of Render.cityEls.values()) {
    if (g.getAttribute('display') === 'none') continue;
    const [x, y] = Cam.toScreen(c.x, c.y); const d = (x - sx) ** 2 + (y - sy) ** 2;
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function hitFeature(w, rpx = 7) {
  if (!Render.vs().showFeatures) return null;
  const r = px2w(rpx); let best = null, bd = Infinity;
  for (const f of D().features) {
    const [d] = polyDist2(w[0], w[1], f.pts); const lim = (f.type === 'mountain' ? r + 4 : r) ** 2;
    if (d < lim && d < bd) { bd = d; best = f; }
  }
  return best;
}
function hitArc(w, rpx = 9) {
  const topo = Render.topoPol; if (!topo) return null;
  const r = px2w(rpx); let best = null, bd = r * r;
  for (const a of topo.arcs) {
    const b = a.bb; if (w[0] < b[0] - r || w[0] > b[2] + r || w[1] < b[1] - r || w[1] > b[3] + r) continue;
    const [d] = polyDist2(w[0], w[1], a.s); if (d < bd) { bd = d; best = a; }
  }
  return best;
}
function hitHandle(pts, sx, sy, r = 8) {
  for (let k = pts.length / 2 - 1; k >= 0; k--) {
    const [x, y] = Cam.toScreen(pts[2 * k], pts[2 * k + 1]);
    if ((x - sx) ** 2 + (y - sy) ** 2 <= r * r) return k;
  }
  return -1;
}
function drawHandles(g, pts, { fixedEnds = false, selK = -1, closed = false } = {}) {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d9a648';
  let d = '';
  for (let k = 0; k < pts.length; k += 2) { const [x, y] = Cam.toScreen(pts[k], pts[k + 1]); d += (k ? 'L' : 'M') + f1(x) + ' ' + f1(y); }
  if (closed) d += 'Z';
  g.append(sv('path', { d, fill: 'none', stroke: '#111', 'stroke-width': 4, 'stroke-opacity': 0.35 }));
  g.append(sv('path', { d, fill: 'none', stroke: accent, 'stroke-width': 1.6, 'stroke-dasharray': '5 3' }));
  const n = pts.length / 2;
  for (let k = 0; k < n; k++) {
    const [x, y] = Cam.toScreen(pts[2 * k], pts[2 * k + 1]);
    const fixed = fixedEnds && (k === 0 || k === n - 1);
    if (fixed) g.append(sv('rect', { x: f1(x - 4.5), y: f1(y - 4.5), width: 9, height: 9, fill: '#fff', stroke: '#111', 'stroke-width': 1.5, class: 'handle fixed' }));
    else g.append(sv('circle', { cx: f1(x), cy: f1(y), r: k === selK ? 6 : 4.5, fill: k === selK ? accent : '#fff', stroke: '#111', 'stroke-width': 1.5, class: 'handle' }));
  }
}
function previewPath(g, pts, { closed = false, color, fill } = {}) {
  if (pts.length < 4) return;
  let d = 'M' + pts.map((v) => f1(v)).join(' ').replace(/(\S+ \S+) /g, '$1L');
  if (closed) d += 'Z';
  const accent = color || getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d9a648';
  if (fill) g.append(sv('path', { d, fill, 'fill-opacity': 0.25, stroke: 'none' }));
  g.append(sv('path', { d, fill: 'none', stroke: '#111', 'stroke-opacity': 0.4, 'stroke-width': 4, 'vector-effect': 'non-scaling-stroke' }));
  g.append(sv('path', { d, fill: 'none', stroke: accent, 'stroke-width': 2, 'stroke-dasharray': '6 4', 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }));
}

const Border = {
  ses: null, // {L, R, pts, selK}
  start(arc) {

  },
  label(k) { if (k === 0) return '바다/호수'; if (k === 1) return '무주지'; return cById(k - 1)?.name || '?'; },
  findArc() {
    const s = this.ses; Render.now(); const topo = Render.topoPol; if (!topo || !s) return null;
    const p = s.pts, n = p.length; let best = null, bs = Infinity;
    const probe = [];
    for (let k = 0; k < n; k += Math.max(2, Math.floor(n / 16) * 2)) probe.push(p[k], p[k + 1]);
    for (const a of topo.arcs) {
      let fwd;

      const r = a.raw, m = r.length;
      const ax = fwd ? r[0] : r[m - 2], ay = fwd ? r[1] : r[m - 1], bx = fwd ? r[m - 2] : r[0], by = fwd ? r[m - 1] : r[1];
      let sc = Math.hypot(ax - p[0], ay - p[1]) + Math.hypot(bx - p[n - 2], by - p[n - 1]);

      if (sc < bs) { bs = sc; best = { a, fwd }; }

    let raw = best.a.raw.slice();
    if (!best.fwd) { const rr = []; for (let k = raw.length - 2; k >= 0; k -= 2) rr.push(raw[k], raw[k + 1]); raw = rr; }

  commit(label = '국경 편집') {

    const e = commit(label, () => Ops.arcEdit(s.L, s.R, raw, pts));

const Input = {
  pointers: new Map(), pan: null, pinch: null, drag: null, space: false, hover: null, toolActive: false,
  init() {
    const svg = $('#map');
    svg.addEventListener('pointerdown', (e) => this.down(e));
    svg.addEventListener('pointermove', (e) => this.move(e));
    svg.addEventListener('pointerup', (e) => this.up(e));
    svg.addEventListener('pointercancel', (e) => this.up(e, true));
    svg.addEventListener('pointerleave', () => { $('#cursor').setAttribute('display', 'none'); $('#cursor2')?.setAttribute('display', 'none'); });
    svg.addEventListener('contextmenu', (e) => e.preventDefault());
    svg.addEventListener('dblclick', (e) => { const [sx, sy] = this.local(e); const t = Tools.t; if (t.dblclick) t.dblclick(Cam.toWorld(sx, sy), e, sx, sy); });
    svg.addEventListener('wheel', (e) => {
      e.preventDefault(); const [sx, sy] = this.local(e);
      if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX) || e.deltaMode) {
        const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        Cam.zoomAt(sx, sy, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)));
      } else { View.tx -= e.deltaX; View.ty -= e.deltaY; Render.schedule(); }
      this.updateBrushCursor(sx, sy);
    }, { passive: false });
  },
  local(e) { const r = $('#map').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; },
  down(e) {
    const svg = $('#map');
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    const [sx, sy] = this.local(e);
    this.pointers.set(e.pointerId, { sx, sy });
    if (this.pointers.size === 2) {
      // second finger: cancel drawing, start pinch
      if (this.toolActive) { const t = Tools.t; if (Hist.cur) Hist.cancel(); t.cancel && t.cancel(); this.toolActive = false; this.drag = null; Render.moveOffset = null; }
      const [a, b] = [...this.pointers.values()];
      this.pinch = { d: Math.hypot(a.sx - b.sx, a.sy - b.sy), cx: (a.sx + b.sx) / 2, cy: (a.sy + b.sy) / 2 }; this.pan = null; return;
    }
    if (this.pointers.size > 2) return;
    $$('.popmenu').forEach((m) => m.remove()); $$('.menubtn.open').forEach((b) => b.classList.remove('open'));
    const w = Cam.toWorld(sx, sy);
    if (e.button === 1 || e.button === 2 || this.space) { this.startPan(sx, sy, null); return; }
    if (e.button !== 0) return;
    const t = Tools.t;
    const r = t.down ? t.down(w, e, sx, sy) : 'pan';
    if (r === 'pan' || r === 'pan-click') this.startPan(sx, sy, r === 'pan-click' ? (ww, ee) => t.click && t.click(ww, ee, sx, sy) : null, e);
    else if (r) this.toolActive = true;
  },
  startPan(sx, sy, click, e) { this.pan = { sx, sy, tx: View.tx, ty: View.ty, moved: false, click, ev: e }; $('#map').classList.add('c-panning'); },
  move(e) {
    const [sx, sy] = this.local(e);
    const p = this.pointers.get(e.pointerId); if (p) { p.sx = sx; p.sy = sy; }
    const w = Cam.toWorld(sx, sy);
    this.updateBrushCursor(sx, sy);
    UI.hover(w);
    if (this.pinch && this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.sx - b.sx, a.sy - b.sy), cx = (a.sx + b.sx) / 2, cy = (a.sy + b.sy) / 2;
      View.tx += cx - this.pinch.cx; View.ty += cy - this.pinch.cy;
      Cam.zoomAt(cx, cy, d / (this.pinch.d || d));
      this.pinch = { d, cx, cy }; return;
    }
    if (this.pan) {
      const dx = sx - this.pan.sx, dy = sy - this.pan.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) this.pan.moved = true;
      if (this.pan.moved) { View.tx = this.pan.tx + dx; View.ty = this.pan.ty + dy; Render.schedule(); }
      return;
    }
    if (this.toolActive) { const t = Tools.t; t.move && t.move(w, e, sx, sy); }
  },
  up(e, cancelled) {
    this.pointers.delete(e.pointerId);
    if (this.pinch) { if (this.pointers.size < 2) this.pinch = null; this.pan = null; return; }
    const [sx, sy] = this.local(e); const w = Cam.toWorld(sx, sy);
    if (this.pan) {
      const pan = this.pan; this.pan = null; $('#map').classList.remove('c-panning');
      if (!pan.moved && pan.click && !cancelled) pan.click(w, e);
      return;
    }
    if (this.toolActive) {
      this.toolActive = false; const t = Tools.t;
      if (cancelled) { if (Hist.cur) Hist.cancel(); t.cancel && t.cancel(); } else t.up && t.up(w, e, sx, sy);
      this.drag = null; Render.schedule();
    }
  },
  updateCursor() {
    const svg = $('#map'); const t = Tools.t;
    svg.classList.remove('c-pan', 'c-cross', 'c-none', 'c-pointer', 'c-move');
    svg.classList.add(this.space ? 'c-pan' : t.cursor === 'cross' ? 'c-cross' : t.cursor === 'none' ? 'c-none' : t.cursor === 'move' ? 'c-move' : 'c-pointer');
    if (!t.brush) $('#cursor').setAttribute('display', 'none');
  },
  updateBrushCursor(sx, sy) {
    const c = $('#cursor'); const t = Tools.t;
    if (!t.brush || this.space) { c.setAttribute('display', 'none'); $('#cursor2')?.setAttribute('display', 'none'); return; }
    c.removeAttribute('display'); c.setAttribute('cx', sx); c.setAttribute('cy', sy);
    c.setAttribute('r', Math.max(2, Tools.opt.brush * View.s));
    const col = Tools.cur === 'eraser' || (Tools.cur === 'occupy' && Tools.opt.occErase) ? '#e05a4a' : cById(App.activeCid)?.color || '#ffffff';
    c.setAttribute('stroke', '#111'); c.setAttribute('stroke-width', 3); c.setAttribute('stroke-opacity', 0.45);
    let c2 = $('#cursor2'); if (!c2) { c2 = sv('circle', { id: 'cursor2', fill: 'none', 'pointer-events': 'none' }); c.after(c2); }
    c2.setAttribute('cx', sx); c2.setAttribute('cy', sy); c2.setAttribute('r', c.getAttribute('r')); c2.setAttribute('stroke', col); c2.setAttribute('stroke-width', 1.6);
    c2.removeAttribute('display');
  },
};

async function openProject(p) {
  P = p; P.settings = P.settings || {}; normalizeData(P.data);
  Hist.clear(); App.sel = null; Border.ses = null; Render.compare = null; Render.preview = null; Render.moveOffset = null;
  App.activeCid = activeCountries()[0]?.id || 0;
  for (const e of Render.countryEls.values()) e.remove(); Render.countryEls.clear();
  for (const e of Render.labelEls.values()) e.remove(); Render.labelEls.clear();
  $$('#defs pattern').forEach((e) => e.remove());
  Cam.resize(); Render.all(); Render.now(); Cam.fit();
  Tools.set(Tools.cur || 'select'); UI.refresh(); UI.setSaveState(Store.ok ? 'saved' : 'memory');
  if (Store.ok) Store.meta('lastProject', P.id).catch(() => {});
}

async function boot() {
  UI.init(); Input.init();
  const ok = await Store.open();
  if (!ok) $('#app').insertBefore(el('div', { id: 'warnBar' }, '이 브라우저에서는 IndexedDB를 쓸 수 없어 작업이 임시 백업에만 저장됩니다. 파일 › JSON 내보내기로 꼭 백업하세요.'), $('#main'));
  let p = null;
  if (ok) {
    const last = await Store.meta('lastProject');
    if (last) { try { p = await Store.loadProject(last); } catch (e) { console.warn(e); } }
    if (!p) for (const m of await Store.listProjects()) { try { p = await Store.loadProject(m.id); break; } catch (e) { console.warn(e); } }
  }
  const em = Store.readEmergency();
  if (em && (!p || (em.id === p.id && em.updated > p.updated + 1500))) { p = em; setTimeout(() => toast('마지막으로 저장되지 못한 작업을 임시 백업에서 복구했습니다'), 600); }
  let fresh = false;
  if (!p) { p = generateWorld(20252); fresh = true; }
  await openProject(p);
  if (fresh) await Store.save();
  $('#loading').hidden = true;
  new ResizeObserver(() => { const cx = (View.w / 2 - View.tx) / View.s, cy = (View.h / 2 - View.ty) / View.s; Cam.resize(); if (P) Cam.center(cx, cy); }).observe($('#mapwrap'));
}

const TOOL_KEYS = Object.fromEntries(Tools.order.filter((t) => t !== '|').map((t) => [t[2].toLowerCase(), t[0]]));
document.addEventListener('keydown', (e) => {
  const tg = e.target; const typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable);
  const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); Store.save(true); return; }
  if (typing) { if (e.key === 'Escape') tg.blur(); return; }
  if (Modal.stack.length) { if (e.key === 'Escape') Modal.closeTop(); return; }
  if (!P) return;
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) Hist.redo(); else Hist.undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); Hist.redo(); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Escape') {
    if (Input.toolActive) { if (Hist.cur) Hist.cancel(); Tools.t.cancel && Tools.t.cancel(); Input.toolActive = false; Render.moveOffset = null; }
    else if (Border.ses) { Border.ses = null; UI.renderOptbar(); }
    else App.select(null);
    UI.closeMenus(); Render.schedule(); return;
  }
  if (e.key === ' ') { e.preventDefault(); if (!Input.space) { Input.space = true; Input.updateCursor(); } return; }
  if (e.key === '[' || e.key === ']') { Tools.opt.brush = clamp(Tools.opt.brush + (e.key === ']' ? 2 : -2), 1, 80); const r = $('#brushSize'); if (r) { r.value = Tools.opt.brush; r.dispatchEvent(new Event('input')); } toast('브러시 크기 ' + Tools.opt.brush, { ms: 900 }); return; }
  if (e.key === '0') { Cam.fit(); return; }
  if (e.key === '+' || e.key === '=') { Cam.zoomCenter(1.4); return; }
  if (e.key === '-' || e.key === '_') { Cam.zoomCenter(1 / 1.4); return; }
  if (e.key === '?') { UI.shortcuts(); return; }
  if (TOOL_KEYS[k]) { Tools.set(TOOL_KEYS[k]); }
});
document.addEventListener('keyup', (e) => { if (e.key === ' ') { Input.space = false; Input.updateCursor(); } });
window.addEventListener('blur', () => { if (Input.space) { Input.space = false; Input.updateCursor(); } });
window.addEventListener('beforeunload', () => { if (P && Store.dirty) { try { Store.emergency(encodeProject(P)); } catch (e) {} Store.save(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && P && Store.dirty) Store.save(); });
window.addEventListener('error', (e) => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); toast('오류: ' + (e.reason?.message || e.reason), { err: true }); });

boot().catch((err) => { console.error(err); $('#loading').textContent = '시작 실패: ' + err.message; });
/* console handle for debugging / advanced scripting */
window.WAE = { get P() { return P; }, Render, Ops, Hist, Tools, App, UI, Store, Topo, Cam, View, Border, commit, Input };

})();
</script>
