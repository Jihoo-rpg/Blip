<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blip — 게임</title>
<meta name="description" content="blip 게임 허브 · 냥냥 점프, 바이러스 시뮬레이터, 쌍성 궤도, 머드락 섬">
<style>
  /* =========== 색상 (밝은 테마 / 어두운 테마) =========== */
  :root{--bg:#f2f4f5;--panel:#fff;--panel2:#f7f8f9;--line:#e3e5e8;--text:#232527;--sub:#606162;--blue:#0b74e5;--green:#00b06f;--green2:#00995f;--chip:#e9ecef;--shadow:0 1px 3px rgba(0,0,0,.08)}
  html.dark{--bg:#111214;--panel:#191b1d;--panel2:#202225;--line:#2c2e31;--text:#f2f3f5;--sub:#a7a9ac;--chip:#26282b;--shadow:0 1px 3px rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* =========== 위쪽 바 =========== */
  .top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.03em}
  .logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--text);color:var(--panel);font-style:normal;font-size:17px;transform:rotate(-12deg)}
  .search{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;font-family:inherit}
  .tbtn{flex:0 0 38px;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:17px}
  .tbtn:hover{border-color:var(--sub)}

  /* =========== 왼쪽 메뉴 =========== */
  .layout{display:flex;min-height:calc(100vh - 56px)}
  .side{width:190px;flex:0 0 190px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px)}
  .nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:8px;font-size:15px;font-weight:700;text-align:left}
  .nav:hover{background:var(--panel2)}
  .nav.on{background:var(--chip)}
  .nav .ic{width:22px;text-align:center;font-size:18px}
  .nav .n{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
  .sideFoot{position:absolute;bottom:14px;left:16px;right:16px;font-size:12px;color:var(--sub);line-height:1.6}

  /* =========== 본문 =========== */
  main{flex:1;min-width:0;padding:22px 26px 60px}
  .hello{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .ava{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffd54a,#ff7a59);display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
  .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em}
  .hello small{color:var(--sub)}
  .sec{margin-bottom:30px}
  .sech{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .sech h2{margin:0;font-size:20px;font-weight:800}
  .sech span{color:var(--sub);font-size:13px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:0;background:var(--chip);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px}
  .chip.on{background:var(--text);color:var(--panel)}

  /* 게임 타일 (정사각형 썸네일 + 제목 + 정보) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 16px}
  .tile{display:block;border:0;background:transparent;padding:0;text-align:left;width:100%}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:var(--shadow);transition:transform .15s}
  .tile:hover .thumb{transform:translateY(-3px)}
  .thumb .play{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:17px;opacity:0;transform:scale(.8);transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .tile:hover .play{opacity:1;transform:none}
  .thumb .fav{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#ffd54a;border-radius:6px;padding:2px 6px;font-size:12px}
  .tname{margin:8px 0 3px;font-weight:800;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tinfo{display:flex;gap:10px;color:var(--sub);font-size:12.5px;align-items:center}
  .tinfo .on{color:var(--green);font-weight:700}
  .empty{color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center}

  /* =========== 게임 상세 창 =========== */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .ov.show{display:flex;animation:fi .18s}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .det{background:var(--panel);border-radius:14px;width:min(880px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .2s ease-out}
  @keyframes pop{from{transform:scale(.97)}to{transform:none}}
  .dtop{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;padding:20px}
  .banner{border-radius:10px;aspect-ratio:16/9;background:#000 center/cover no-repeat}
  .dtitle{margin:2px 0 4px;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
  .by{color:var(--sub);font-size:14px;margin-bottom:14px}.by b{color:var(--blue)}
  .bigplay{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:28px;box-shadow:0 3px 0 var(--green2)}
  .bigplay:hover{filter:brightness(1.07)}
  .bigplay:active{transform:translateY(2px);box-shadow:none}
  .drow{display:flex;gap:8px;margin-top:10px}
  .sbtn{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
  .sbtn.on{border-color:#e8b400;color:#c99a00;background:#fff8dd}
  html.dark .sbtn.on{background:#3a3110}
  .x{position:sticky;top:0;float:right;margin:10px 10px 0 0;width:36px;height:36px;border-radius:50%;border:0;background:var(--chip);font-size:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px}
  .tab{border:0;background:transparent;padding:12px 14px;font-weight:800;font-size:14px;color:var(--sub);border-bottom:3px solid transparent}
  .tab.on{color:var(--text);border-color:var(--text)}
  .dbody{padding:18px 20px 24px}
  .dbody p{line-height:1.65;margin:0 0 14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stats div{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .stats small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
  .stats b{font-size:14.5px}
  .live{background:var(--panel2);border-radius:10px;padding:12px 14px;margin-top:14px}
  .live h4{margin:0 0 8px;font-size:14px}
  .live ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
  .live li{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
  .live li:last-child{border:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tags span{background:var(--chip);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700}

  /* =========== 휴대폰 =========== */
  .bnav{display:none}
  @media (max-width:820px){
    .side{display:none}
    main{padding:16px 14px 90px}
    .logo span{display:none}
    .grid{grid-template-columns:repeat(2,1fr);gap:14px 12px}
    .dtop{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);height:62px}
    .bnav button{flex:1;border:0;background:transparent;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .bnav button span{font-size:20px}
    .bnav button.on{color:var(--text)}
  }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./"><i>b</i><span>blip</span></a>
  <label class="search">🔍<input id="q" type="search" placeholder="게임 검색" autocomplete="off"></label>
  <button class="tbtn" id="theme" title="밝게 / 어둡게">🌙</button>
</header>

<div class="layout">
  <aside class="side">
    <button class="nav on" data-v="home"><span class="ic">🏠</span>홈</button>
    <button class="nav" data-v="all"><span class="ic">🎮</span>모든 게임<span class="n" id="nAll"></span></button>
    <button class="nav" data-v="fav"><span class="ic">⭐</span>즐겨찾기<span class="n" id="nFav"></span></button>
    <button class="nav" data-v="recent"><span class="ic">🕒</span>최근 플레이<span class="n" id="nRec"></span></button>
    <div class="sideFoot">© blip company<br>모든 게임 무료 · 설치 없음</div>
  </aside>

  <main id="main"></main>
</div>

<nav class="bnav">
  <button class="on" data-v="home"><span>🏠</span>홈</button>
  <button data-v="all"><span>🎮</span>게임</button>
  <button data-v="fav"><span>⭐</span>즐겨찾기</button>
  <button data-v="recent"><span>🕒</span>최근</button>
</nav>

<div class="ov" id="ov"><div class="det" id="det"></div></div>

<script>
/* ===================== 게임 목록 =====================
   새 게임을 추가하려면 이 배열에 항목 하나만 더 넣으면 돼요. */
const GAMES = [
  {
    id: 'catjump', name: '냥냥 점프', url: 'https://jihoo-rpg.github.io/CatJump/CatJump.html',
    sq: 'sq_catjump.jpg', bn: 'bn_catjump.jpg', genre: '캐주얼', icon: '🐾',
    desc: '고양이가 양쪽 벽을 번갈아 타고 끝없이 올라가는 점프 게임이에요. 장애물을 피하며 최고 기록에 도전하고, 고양이와 스킨을 모으고, 친구와 1:1 대결·거래를 해 보세요. 시즌마다 1~3등은 칭호를 받아요.',
    info: [['장르', '캐주얼 점프'], ['기기', '모바일 · PC'], ['온라인', '랭킹 · 대결 · 거래'], ['조작', '클릭 · 스페이스 · 터치']],
    tags: ['시즌 랭킹', '1:1 대결', '거래', '라이브 이벤트', '스킬 각성'],
  },
  {
    id: 'virus', name: '바이러스 시뮬레이터', url: '../virus/',
    sq: 'sq_virus.jpg', bn: 'bn_virus.jpg', genre: '전략', icon: '🦠',
    desc: '가상의 바이러스가 실제 세계 지도 176개국으로 퍼지는 전략 시뮬레이션이에요. 바이러스가 되어 능력을 키우며 세계로 퍼지거나, 국제 방역 기구가 되어 의료 자원을 나누고 백신 연구를 도와 세계를 지켜 보세요.',
    info: [['장르', '전략 시뮬레이션'], ['기기', 'PC 추천'], ['모드', '확산 · 방역'], ['저장', '자동 저장']],
    tags: ['실제 세계 지도', '업그레이드 트리', '실시간 뉴스', '랜덤 이벤트'],
  },
  {
    id: 'ball', name: '쌍성 궤도', url: 'https://jihoo-rpg.github.io/balldance/balldance.html',
    sq: 'sq_ball.jpg', bn: 'bn_ball.jpg', genre: '리듬', icon: '🪐',
    desc: '두 행성이 번갈아 서로를 돌며 길을 따라가는 리듬 게임이에요. 도는 행성이 다음 칸에 닿는 순간 박자에 맞춰 누르세요. 12개 월드, 직접 만드는 맵, 공유 코드까지 있어요.',
    info: [['장르', '리듬'], ['기기', '모바일 · PC'], ['월드', '12개 + 맵 만들기'], ['조작', '아무 키 · 탭']],
    tags: ['12개 월드', '맵 에디터', '공유 코드', '연습 모드'],
  },
  {
    id: 'mudlark', name: '머드락 섬', url: '../mudlark/',
    sq: 'sq_mudlark.jpg', bn: 'bn_mudlark.jpg', genre: '생존', icon: '🐄',
    desc: '넓은 로우폴리 섬에 맨몸으로 떨어져 살아남는 3D 생존 로그라이크예요. 나무를 치고 돌을 주워 작업대와 화로를 만들고, 나무에서 금까지 장비를 올리세요. 밤마다 몬스터가 몰려오고 3일마다 보스가 나와요. 코인으로 상자를 열어 파워업을 쌓으세요.',
    info: [['장르', '3D 생존 로그라이크'], ['기기', 'PC (키보드 · 마우스)'], ['맵', '매번 새로 생성되는 섬'], ['조작', 'WASD · 마우스 · E · Tab · M']],
    tags: ['제작', '낮·밤', '보스', '파워업', '섬 지도'],
  },
];
const GENRES = ['전체', ...new Set(GAMES.map(g => g.genre))];

/* ===================== 내 기록 (이 브라우저에만 저장) ===================== */
const KEY = 'blip_hub_v1';
let ME = { fav: [], recent: [], dark: false };
try { ME = Object.assign(ME, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const saveMe = () => { try { localStorage.setItem(KEY, JSON.stringify(ME)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const G = id => GAMES.find(g => g.id === id);

/* ===================== 실제 데이터 (가짜 숫자 없음) ===================== */
const LIVE = { cjOnline: null, cjTop: null, cjSeason: null };
const FB = 'https://cat-jump-3afbb-default-rtdb.firebaseio.com';
async function loadCatJump() {
  try {
    const get = p => fetch(FB + '/' + p + '.json').then(r => r.ok ? r.json() : null);
    const [se, rk, pin, ban, lobby] = await Promise.all([get('season'), get('ranking'), get('rankPin'), get('banned'), get('rooms/lobby')]);
    // 지금 접속 중: 최근 40초 안에 신호를 보낸 사람 수
    const now = Date.now(); let on = 0;
    for (const k in lobby || {}) { const v = lobby[k]; if (v && Math.abs(now - (Number(v.t) || 0)) < 40000) on++; }
    LIVE.cjOnline = on;
    // 이번 시즌 TOP 3
    const n = Math.max(1, Math.floor(Number(se && se.n) || 1)), seen = {}, rows = [];
    const add = (k, v, pinned) => { if (!v || typeof v !== 'object') return; if (!pinned && (ban || {})[k]) return; if ((Number(v.sn) || 1) !== n) return;
      const nick = String(v.nick || '냥이').slice(0, 10), best = Math.max(0, Math.floor(Number(v.best) || 0)), key = nick.trim().toLowerCase();
      if (seen[key] !== undefined) { if (rows[seen[key]].best < best) rows[seen[key]] = { nick, best }; return; } seen[key] = rows.length; rows.push({ nick, best }); };
    for (const k in rk || {}) add(k, rk[k], false); for (const k in pin || {}) add(k, pin[k], true);
    rows.sort((a, b) => b.best - a.best); LIVE.cjTop = rows.slice(0, 5); LIVE.cjSeason = n;
  } catch (e) {}
  render(); if (openId) openDetail(openId, curTab);
}
function localInfo(id) {
  try {
    if (id === 'virus') { const d = JSON.parse(localStorage.getItem('virussim_save_v1') || 'null'); if (d && d.day != null) return `💾 이어하기 · DAY ${d.day}`; }
    if (id === 'ball') { const d = JSON.parse(localStorage.getItem('twin-orbit-v1') || 'null'); const n = d && d.best ? Object.keys(d.best).length : 0; if (n) return `🏁 ${n}/12 월드 클리어`; }
    if (id === 'catjump') { const d = JSON.parse(localStorage.getItem('nyangjump_save_v2') || 'null'); if (d && d.best) return `🏔️ 내 최고 ${Number(d.best).toLocaleString('ko-KR')}m`; }
  } catch (e) {}
  return '';
}

/* ===================== 화면 그리기 ===================== */
let view = 'home', genre = '전체', query = '', openId = null, curTab = 'about';
function tile(g) {
  const fav = ME.fav.includes(g.id), li = localInfo(g.id);
  const online = g.id === 'catjump' && LIVE.cjOnline ? `<span class="on">● ${LIVE.cjOnline}명 접속 중</span>` : '';
  return `<button class="tile" data-open="${g.id}">
    <div class="thumb" style="background-image:url(${g.sq})">${fav ? '<span class="fav">⭐</span>' : ''}<span class="play">▶</span></div>
    <div class="tname">${g.icon} ${esc(g.name)}</div>
    <div class="tinfo">${online || `<span>${esc(g.genre)}</span>`}${li ? `<span>${esc(li)}</span>` : ''}</div></button>`;
}
function grid(list, emptyMsg) { return list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : `<div class="empty">${emptyMsg}</div>`; }
function filtered(list) {
  const q = query.trim().toLowerCase();
  return list.filter(g => (q || genre === '전체' || g.genre === genre) && (!q || (g.name + g.genre + g.tags.join(' ') + g.desc).toLowerCase().includes(q)));
}
function render() {
  const m = document.getElementById('main');
  const rec = ME.recent.map(G).filter(Boolean), fav = ME.fav.map(G).filter(Boolean);
  document.getElementById('nAll').textContent = GAMES.length;
  document.getElementById('nFav').textContent = fav.length || '';
  document.getElementById('nRec').textContent = rec.length || '';
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const chips = `<div class="chips">${GENRES.map(x => `<button class="chip ${genre === x ? 'on' : ''}" data-g="${x}">${x}</button>`).join('')}</div>`;
  if (query.trim()) {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>“${esc(query)}” 검색 결과</h2></div>${grid(filtered(GAMES), '찾는 게임이 없어요')}</div>`; return;
  }
  if (view === 'home') {
    m.innerHTML = `<div class="hello"><div class="ava">🎮</div><div><h1>어서 오세요!</h1><small>blip에서 바로 플레이할 수 있는 게임 ${GAMES.length}개</small></div></div>
      ${rec.length ? `<div class="sec"><div class="sech"><h2>🕒 이어서 플레이</h2></div>${grid(rec.slice(0, 6))}</div>` : ''}
      <div class="sec"><div class="sech"><h2>🔥 추천 게임</h2><span>blip이 만든 게임</span></div>${chips}${grid(filtered(GAMES), '이 장르의 게임이 아직 없어요')}</div>
      ${fav.length ? `<div class="sec"><div class="sech"><h2>⭐ 즐겨찾기</h2></div>${grid(fav)}</div>` : ''}`;
  } else if (view === 'all') {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>🎮 모든 게임</h2><span>${GAMES.length}개</span></div>${chips}${grid(filtered(GAMES), '이 장르의 게임이 아직 없어요')}</div>`;
  } else if (view === 'fav') {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>⭐ 즐겨찾기</h2></div>${grid(fav, '아직 즐겨찾기한 게임이 없어요.<br>게임을 열고 ☆ 즐겨찾기를 눌러 보세요.')}</div>`;
  } else {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>🕒 최근 플레이</h2>${rec.length ? '<button class="chip" id="clrRec">기록 지우기</button>' : ''}</div>${grid(rec, '아직 플레이한 게임이 없어요')}</div>`;
    const c = document.getElementById('clrRec'); if (c) c.onclick = () => { ME.recent = []; saveMe(); render(); };
  }
}

/* ===================== 게임 상세 창 ===================== */
function openDetail(id, tab) {
  const g = G(id); if (!g) return; openId = id; curTab = tab || 'about';
  const fav = ME.fav.includes(id), li = localInfo(id);
  let live = '';
  if (id === 'catjump') {
    live = `<div class="live"><h4>🏆 시즌${LIVE.cjSeason || ''} 랭킹 TOP 5${LIVE.cjOnline ? ` · <span style="color:var(--green)">● ${LIVE.cjOnline}명 접속 중</span>` : ''}</h4>${LIVE.cjTop ? (LIVE.cjTop.length ? `<ol>${LIVE.cjTop.map((r, i) => `<li><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${esc(r.nick)}</span><b>${r.best.toLocaleString('ko-KR')}m</b></li>`).join('')}</ol>` : '<small>이번 시즌 기록이 아직 없어요. 첫 1등이 되어 보세요!</small>') : '<small>랭킹을 불러오지 못했어요. 게임 안에서 볼 수 있어요.</small>'}</div>`;
  }
  const body = curTab === 'about'
    ? `<p>${esc(g.desc)}</p><div class="stats">${g.info.map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div>${live}<div class="tags">${g.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>`
    : `<div class="stats"><div><small>내 기록</small><b>${li ? esc(li) : '아직 없음'}</b></div><div><small>즐겨찾기</small><b>${fav ? '⭐ 등록됨' : '안 함'}</b></div><div><small>최근 플레이</small><b>${ME.recent.includes(id) ? '✔ 해봄' : '아직'}</b></div><div><small>만든 곳</small><b>blip</b></div></div>
       <p style="margin-top:14px;color:var(--sub)">기록은 이 브라우저에 저장돼요. 같은 브라우저로 들어오면 이어서 볼 수 있어요.</p>`;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button>
    <div class="dtop"><div class="banner" style="background-image:url(${g.bn})"></div>
      <div><div class="dtitle">${g.icon} ${esc(g.name)}</div><div class="by">만든 곳 <b>@blip</b> · ${esc(g.genre)}</div>
        <button class="bigplay" data-play="${g.id}" title="플레이">▶</button>
        <div class="drow"><button class="sbtn ${fav ? 'on' : ''}" id="dfav">${fav ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기'}</button><button class="sbtn" id="dshare">🔗 링크 복사</button></div>
        ${li ? `<div style="margin-top:12px;color:var(--sub);font-size:14px">${esc(li)}</div>` : ''}
      </div></div>
    <div class="tabs"><button class="tab ${curTab === 'about' ? 'on' : ''}" data-tab="about">정보</button><button class="tab ${curTab === 'mine' ? 'on' : ''}" data-tab="mine">내 기록</button></div>
    <div class="dbody">${body}</div>`;
  document.getElementById('ov').classList.add('show');
  document.getElementById('dx').onclick = closeDetail;
  document.getElementById('dfav').onclick = () => { ME.fav = fav ? ME.fav.filter(x => x !== id) : [id, ...ME.fav]; saveMe(); render(); openDetail(id, curTab); };
  document.getElementById('dshare').onclick = async () => {
    const url = new URL(g.url, location.href).href;
    try { await navigator.clipboard.writeText(url); document.getElementById('dshare').textContent = '✔ 복사됨'; } catch (e) { prompt('이 링크를 복사하세요', url); }
  };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openDetail(id, b.dataset.tab));
}
function closeDetail() { openId = null; document.getElementById('ov').classList.remove('show'); }
function play(id) {
  const g = G(id); if (!g) return;
  ME.recent = [id, ...ME.recent.filter(x => x !== id)].slice(0, 12); saveMe();
  location.href = g.url;
}

/* ===================== 클릭 / 입력 ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-play],[data-v],[data-g]');
  if (!t) { if (e.target.id === 'ov') closeDetail(); return; }
  if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.dataset.play) play(t.dataset.play);
  else if (t.dataset.v) { view = t.dataset.v; query = ''; genre = '전체'; document.getElementById('q').value = ''; render(); window.scrollTo(0, 0); }
  else if (t.dataset.g) { genre = t.dataset.g; render(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
function applyTheme() { document.documentElement.classList.toggle('dark', !!ME.dark); document.getElementById('theme').textContent = ME.dark ? '☀️' : '🌙'; }
document.getElementById('theme').onclick = () => { ME.dark = !ME.dark; saveMe(); applyTheme(); };

applyTheme(); render(); loadCatJump();
</script>
</body>
</html>
