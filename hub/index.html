<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blip — 게임 아케이드</title>
<meta name="description" content="blip 게임 허브 · 냥냥 점프, 바이러스 시뮬레이터, 쌍성 궤도, 머드락 섬, 하프코트 레전드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
  /* =========== 색상: 캔디 아케이드(밝게) / 나이트 아케이드(어둡게) =========== */
  :root{--bg:#f7f3ff;--bg2:#efe8ff;--panel:#ffffff;--panel2:#f4f0fc;--line:#e6dff7;--text:#1d1830;--sub:#6e6688;--blue:#5b5bf7;--green:#16c784;--green2:#0e9e68;--chip:#efe9fb;
    --g1:#ff5fa2;--g2:#7c5cff;--g3:#22d3ee;--grad:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));--shadow:0 6px 18px rgba(80,50,160,.10);--shadow2:0 18px 40px rgba(80,50,160,.18);
    --disp:"SUIT Variable","SUIT",system-ui,sans-serif;--body:"SUIT Variable","SUIT","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
  html.dark{--bg:#0e0b1c;--bg2:#160f2e;--panel:#191433;--panel2:#221b42;--line:#2f2758;--text:#f5f2ff;--sub:#a99fd0;--chip:#261f4a;--shadow:0 6px 18px rgba(0,0,0,.4);--shadow2:0 20px 50px rgba(0,0,0,.55)}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--text);font-family:var(--body);background:var(--bg)}
  body{background:radial-gradient(900px 500px at 0% 0%,rgba(255,95,162,.14),transparent 60%),radial-gradient(900px 600px at 100% 0%,rgba(34,211,238,.14),transparent 60%),radial-gradient(800px 600px at 50% 100%,rgba(124,92,255,.12),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(124,92,255,.10) 1px,transparent 1px);background-size:22px 22px;z-index:0}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,.dtitle,.tname,.logo{font-family:var(--disp);font-weight:800;letter-spacing:-.025em}

  /* =========== 위쪽 바 (떠 있는 유리 막대) =========== */
  .top{position:sticky;top:10px;z-index:20;margin:10px 14px 0;height:62px;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900!important;letter-spacing:-.04em}
  .logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--grad);color:#fff;font-style:normal;font-size:20px;box-shadow:0 6px 14px rgba(124,92,255,.4);animation:wob 3s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg) translateY(-2px)}}
  .search{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:0 14px;height:42px;transition:.15s}
  .search:focus-within{border-color:var(--g2);background:var(--panel)}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;font-family:inherit;font-weight:600}
  .tbtn{flex:0 0 42px;width:42px;height:42px;border-radius:14px;border:0;background:var(--panel2);font-size:18px;transition:.15s}
  .tbtn:hover{transform:rotate(15deg)}

  /* =========== 왼쪽 메뉴 =========== */
  .layout{position:relative;z-index:1;display:flex;gap:18px;padding:16px 14px 0;min-height:calc(100vh - 72px)}
  .side{width:210px;flex:0 0 210px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;position:sticky;top:88px;height:fit-content;box-shadow:var(--shadow)}
  .nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:transparent;border-radius:14px;font-size:15px;font-weight:800;text-align:left;margin-bottom:4px;transition:.15s}
  .nav:hover{background:var(--panel2);transform:translateX(3px)}
  .nav.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(124,92,255,.35)}
  .nav .ic{width:24px;text-align:center;font-size:19px}
  .nav .n{margin-left:auto;font-size:12px;opacity:.75;font-weight:700}
  .sideFoot{margin-top:14px;padding:12px;border-radius:14px;background:var(--panel2);font-size:12px;color:var(--sub);line-height:1.6;font-weight:600}

  /* =========== 본문 =========== */
  main{flex:1;min-width:0;padding:4px 6px 70px}
  .hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:21/8;min-height:230px;background:#000 center/cover no-repeat;box-shadow:var(--shadow2);margin-bottom:26px;transition:background-image .4s}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,24,.88) 0%,rgba(10,6,24,.55) 45%,rgba(10,6,24,0) 75%)}
  .hero .hin{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:26px 32px;max-width:560px;color:#fff}
  .hero .tag{align-self:flex-start;background:var(--grad);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.04em}
  .hero h1{margin:0;font-size:clamp(30px,4.4vw,52px);line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.5)}
  .hero p{margin:0;font-size:14.5px;line-height:1.6;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
  .hero .hb{display:flex;gap:10px;margin-top:6px}
  .hplay{border:0;border-radius:16px;padding:13px 22px;font-family:var(--disp);font-weight:800;font-size:18px;color:#fff;background:var(--grad);box-shadow:0 10px 24px rgba(255,95,162,.4);transition:.15s}
  .hplay:hover{transform:translateY(-2px) scale(1.03)}
  .hmore{border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:14px;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
  .dots{position:absolute;right:20px;bottom:18px;z-index:2;display:flex;gap:6px}
  .dots button{width:9px;height:9px;border-radius:9px;border:0;background:rgba(255,255,255,.45);padding:0;transition:.2s}
  .dots button.on{width:26px;background:#fff}
  .hello{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .ava{width:58px;height:58px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
  .hello h1{margin:0;font-size:30px}
  .hello small{color:var(--sub);font-weight:600}
  .sec{margin-bottom:34px}
  .sech{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sech h2{margin:0;font-size:25px}
  .sech span{color:var(--sub);font-size:13px;font-weight:700;background:var(--panel2);border-radius:999px;padding:3px 10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;font-weight:800;font-size:13px;transition:.15s}
  .chip:hover{border-color:var(--g2)}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--panel)}

  /* 게임 카드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}
  .tile{display:block;border:0;background:var(--panel);padding:8px 8px 12px;text-align:left;width:100%;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
  .tile:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:var(--shadow2)}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#000 center/cover no-repeat}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
  .thumb .play{position:absolute;right:8px;bottom:8px;z-index:1;width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:17px;opacity:0;transform:translateY(6px) scale(.85);transition:.2s;box-shadow:0 6px 14px rgba(124,92,255,.5)}
  .tile:hover .play{opacity:1;transform:none}
  .thumb .fav{position:absolute;left:8px;top:8px;z-index:1;background:rgba(0,0,0,.55);color:#ffd54a;border-radius:10px;padding:3px 7px;font-size:12px}
  .tname{margin:10px 6px 4px;font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tinfo{display:flex;gap:8px;color:var(--sub);font-size:12px;align-items:center;margin:0 6px;flex-wrap:wrap;font-weight:700}
  .tinfo span{background:var(--panel2);border-radius:999px;padding:2px 9px}
  .tinfo .on{color:#fff;background:var(--green)}
  .empty{color:var(--sub);background:var(--panel);border:2px dashed var(--line);border-radius:20px;padding:26px;text-align:center;font-weight:600}

  /* =========== 게임 상세 창 =========== */
  .ov{position:fixed;inset:0;background:rgba(14,8,32,.6);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .ov.show{display:flex;animation:fi .18s}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .det{background:var(--panel);border-radius:28px;width:min(900px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow2);animation:pop .28s cubic-bezier(.2,1.4,.4,1);border:1px solid var(--line)}
  @keyframes pop{from{transform:scale(.92) translateY(10px);opacity:.5}to{transform:none;opacity:1}}
  .dtop{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;padding:22px}
  .banner{border-radius:20px;aspect-ratio:16/9;background:#000 center/cover no-repeat;box-shadow:var(--shadow)}
  .dtitle{margin:2px 0 4px;font-size:34px;line-height:1.1}
  .by{color:var(--sub);font-size:14px;margin-bottom:14px;font-weight:600}.by b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bigplay{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:62px;border:0;border-radius:18px;background:var(--grad);color:#fff;font-size:26px;font-family:var(--disp);box-shadow:0 10px 24px rgba(255,95,162,.35);transition:.15s}
  .bigplay::after{content:"플레이";font-size:20px;font-weight:800}
  .bigplay:hover{transform:translateY(-2px)}
  .bigplay:active{transform:translateY(2px)}
  .drow{display:flex;gap:8px;margin-top:10px}
  .sbtn{flex:1;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:14px}
  .sbtn.on{border-color:#ffc94a;color:#c98a00;background:#fff6db}
  html.dark .sbtn.on{background:#3a2f10;color:#ffd66b}
  .x{position:sticky;top:0;float:right;margin:12px 12px 0 0;width:40px;height:40px;border-radius:14px;border:0;background:var(--panel2);font-size:16px;z-index:2}
  .tabs{display:flex;gap:6px;padding:0 22px}
  .tab{border:0;background:var(--panel2);padding:10px 16px;font-weight:800;font-size:14px;color:var(--sub);border-radius:12px}
  .tab.on{color:#fff;background:var(--text)}
  html.dark .tab.on{color:var(--panel)}
  .dbody{padding:18px 22px 26px}
  .dbody p{line-height:1.7;margin:0 0 14px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stats div{background:var(--panel2);border-radius:14px;padding:12px}
  .stats small{display:block;color:var(--sub);font-size:12px;margin-bottom:3px;font-weight:700}
  .stats b{font-size:14.5px}
  .live{background:var(--panel2);border-radius:16px;padding:14px;margin-top:14px}
  .live h4{margin:0 0 8px;font-size:15px}
  .live ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
  .live li{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .live li:last-child{border:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tags span{background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800}

  /* =========== 친구 · 프로필 =========== */
  .me{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 4px;border-radius:16px;border:0;background:var(--panel2);font-weight:800;font-size:14px;flex:0 0 auto;max-width:180px}
  .me .av{width:34px;height:34px;font-size:19px;border-radius:12px;background:var(--grad)}
  .me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{position:relative;display:grid;place-items:center;border-radius:50%;background:var(--chip);flex:0 0 auto}
  .av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
  .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--g1);color:#fff;font-size:11px;font-weight:800}
  .frow{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
  .fr{display:flex;flex-direction:column;align-items:center;gap:6px;width:86px;flex:0 0 86px;border:0;background:transparent;padding:0}
  .fr .av{width:74px;height:74px;font-size:38px;border-radius:24px;box-shadow:var(--shadow);background:var(--panel)}
  .fr b{font-size:13px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr small{font-size:11px;color:var(--green);font-weight:800;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
  .fr small.off{color:var(--sub)}
  .fr.add .av{background:transparent;border:2px dashed var(--line);font-size:30px;color:var(--sub);box-shadow:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
  .addrow{display:flex;gap:8px;flex-wrap:wrap}
  .addrow input{flex:1;min-width:160px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);padding:0 14px;font-size:16px;font-weight:700;font-family:inherit}
  .gbtn{height:46px;padding:0 18px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;font-size:14px;box-shadow:0 6px 14px rgba(124,92,255,.3)}
  .gbtn.gray{background:var(--chip);color:var(--text);box-shadow:none}
  .gbtn.blue{background:linear-gradient(120deg,#5b5bf7,#22d3ee)}
  .gbtn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:12px}
  .gbtn:disabled{opacity:.45;cursor:not-allowed}
  .mycode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--sub);font-size:14px;font-weight:700}
  .mycode b{font-size:22px;letter-spacing:.16em;color:var(--text);font-weight:900}
  .flist{display:grid;gap:10px}
  .fitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
  .fitem .av{width:48px;height:48px;font-size:26px;border-radius:16px}
  .fitem .tx{flex:1;min-width:0}
  .fitem .tx b{display:block;font-size:15px}
  .fitem .tx small{color:var(--sub);font-size:13px;font-weight:600}
  .fitem .tx small.on{color:var(--green);font-weight:800}
  .fbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .msg{min-height:20px;margin-top:8px;font-size:14px;font-weight:800}
  .msg.ok{color:var(--green)}.msg.err{color:#ff4d6d}
  /* 📮 게임 요청 우편함 */
  .mbox{position:relative;overflow:hidden;border-radius:26px;padding:26px 24px;background:var(--grad);color:#fff;box-shadow:var(--shadow2);margin-bottom:22px}
  .mbox h1{margin:0 0 6px;font-size:28px;font-weight:900;letter-spacing:-.02em}
  .mbox p{margin:0;font-size:15px;font-weight:600;opacity:.95;max-width:560px}
  .mbox .promise{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.95);color:#2a1d5c;font-weight:900;font-size:15px}
  .mbox .env{position:absolute;right:18px;top:12px;font-size:84px;transform:rotate(-12deg);opacity:.9;pointer-events:none}
  .mform{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px}
  .mform input,.mform textarea{width:100%;box-sizing:border-box;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);padding:12px 14px;font-size:16px;font-weight:700;font-family:inherit}
  .mform textarea{min-height:110px;resize:vertical;font-weight:600;line-height:1.5}
  .mform .lbl{font-weight:800;font-size:14px;margin-bottom:-4px}
  .mform .cnt{font-size:12px;color:var(--sub);text-align:right;margin-top:-6px}
  .mlist{display:grid;gap:10px}
  .mitem{padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px}
  .mitem .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mitem .h b{font-size:16px;flex:1;min-width:140px}
  .mitem .d{color:var(--sub);font-size:14px;font-weight:600;white-space:pre-wrap;word-break:break-word}
  .mitem .who{font-size:12px;color:var(--sub);font-weight:700}
  .st{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
  .st.new{background:#fff1c2;color:#8a5a00}.st.make{background:#dbe8ff;color:#1e4fd8}.st.done{background:#d3f7e6;color:#0b7a4b}.st.late{background:#ffe0e6;color:#c2184b}
  .mown{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .mown select{height:36px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;padding:0 8px}
  .claim{margin-top:18px;padding:14px;border-radius:16px;border:2px dashed var(--line);color:var(--sub);font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .accbox{margin-top:16px;padding:14px;border-radius:16px;background:var(--panel2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .accbox .tx{flex:1;min-width:0}
  .field{display:grid;gap:6px;margin-top:12px}
  .field label{font-weight:800;font-size:14px}
  .field input{height:46px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);padding:0 14px;font-size:16px;font-family:inherit}
  .field small{color:var(--sub);font-size:12.5px}
  .pop{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
  .pop .fitem{box-shadow:var(--shadow2);animation:pop .25s ease-out}
  .avs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
  .avs button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--chip);font-size:24px}
  .avs button.on{border-color:var(--g2);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
  .sheet{padding:22px}
  .sheet h3{margin:0 0 12px;font-size:24px}
  .playing{color:var(--green);font-weight:800}

  /* =========== 휴대폰 =========== */
  .bnav{display:none}
  @media (max-width:820px){
    .side{display:none}
    .top{margin:8px 10px 0;height:56px;border-radius:18px;padding:0 8px 0 12px;gap:8px}
    .logo{font-size:24px}.logo span{display:none}
    .layout{padding:12px 10px 0}
    main{padding:0 0 100px}
    .hero{aspect-ratio:auto;min-height:300px;border-radius:24px}
    .hero::after{background:linear-gradient(0deg,rgba(10,6,24,.92) 0%,rgba(10,6,24,.5) 55%,rgba(10,6,24,.05) 100%)}
    .hero .hin{justify-content:flex-end;padding:20px}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .tname{font-size:16px}
    .dtop{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .me span:last-child{display:none}.me{padding:0 4px}
    #loginBtn{padding:0 10px}
    .pop{left:16px;right:16px;bottom:90px}
    .avs{grid-template-columns:repeat(6,1fr)}

  } catch (e) {}
  return '';
}

/* ===================== 화면 그리기 ===================== */
let view = 'home', genre = '전체', query = '', openId = null, curTab = 'about', heroI = Math.floor(Math.random() * 99);
function heroHTML() { const hg = GAMES[heroI % GAMES.length];

    <div class="hb"><button class="hplay" data-play="${hg.id}">▶ 바로 플레이</button><button class="hmore" data-open="${hg.id}">자세히 보기</button></div></div>
    <div class="dots">${GAMES.map((g, i) => `<button class="${i === heroI % GAMES.length ? 'on' : ''}" data-hero="${i}" aria-label="${esc(g.name)}"></button>`).join('')}</div>`; }
function updHero() { const h = document.getElementById('hero'); if (!h) return; h.style.backgroundImage = `url(${GAMES[heroI % GAMES.length].bn})`; h.innerHTML = heroHTML(); }
setInterval(() => { if (view !== 'home' || query.trim() || document.hidden || openId) return; heroI++; updHero(); }, 6500);
document.addEventListener('click', e => { const t = e.target.closest('[data-hero]'); if (t) { heroI = +t.dataset.hero; updHero(); } });
function tile(g) {

function grid(list, emptyMsg) { return list.length ? `<div class="grid">${list.map(tile).join('')}</div>` : `<div class="empty">${emptyMsg}</div>`; }
function filtered(list) {
  const q = query.trim().toLowerCase();

function render() {

      <div class="sec" id="homeFriends">${homeFriendsHTML()}</div>
      ${rec.length ? `<div class="sec"><div class="sech"><h2>🕒 이어서 플레이</h2></div>${grid(rec.slice(0, 6))}</div>` : ''}
      <div class="sec"><div class="sech"><h2>🔥 추천 게임</h2><span>blip이 만든 게임</span></div>${chips}${grid(filtered(GAMES), '이 장르의 게임이 아직 없어요')}</div>

/* ===================== 친구 · 멀티플레이 ===================== */
const FR = { list: [], reqs: [], invs: [], users: {}, loaded: false };
const GNAME = id => BLIP.GAMES[id] ? BLIP.GAMES[id].icon + ' ' + BLIP.GAMES[id].name : '';
/** 실제로 지금 그 게임을 하고 있는 사람 수 (가짜 숫자 없음) */

  let n = 0; for (const k in FR.users) { const u = FR.users[k]; if (u && u.game === id && BLIP.isOnline(u)) n++; }
  if (id === 'catjump' && LIVE.cjOnline) n = Math.max(n, LIVE.cjOnline);
  return n;
}
function statusText(f) { return f.online ? (f.game ? GNAME(f.game) + ' 플레이 중' : '허브에 있어요') : '오프라인'; }

function friendItem(f) {

    <div class="fbtns">${f.online && f.game ? `<button class="gbtn sm" data-follow="${f.code}" data-game="${f.game}">따라 들어가기</button>` : ''}<button class="gbtn sm blue" data-invfriend="${f.code}">초대</button><button class="gbtn sm gray" data-unfriend="${f.code}">삭제</button></div></div>`;

    <div class="sech"><h2>내 친구</h2><span>${FR.list.filter(f => f.online).length}명 접속 중 · 전체 ${FR.list.length}명</span></div>

}
function friendsViewHTML() {

    <div class="card"><b>친구 추가</b><div style="color:var(--sub);font-size:14px;margin:4px 0 10px">친구의 <b>6자리 친구 코드</b>나 <b>아이디</b>를 넣으면 친구 요청을 보내요.</div>
      <div class="addrow"><input id="addCode" maxlength="12" placeholder="친구 코드 또는 아이디" autocomplete="off" autocapitalize="off"><button class="gbtn" id="addBtn">요청 보내기</button></div>
      <div class="msg" id="addMsg"></div>
      <div class="mycode">내 친구 코드 <b id="myCode">${BLIP.me.code}</b><button class="gbtn sm gray" id="copyCode">복사</button></div></div></div>
    <div class="sec" id="frList">${friendsListHTML()}</div>`;
}
function bindFriendsView() {
  const inp = document.getElementById('addCode'), msg = document.getElementById('addMsg');
  const send = async () => {
    const code = inp.value.trim(); msg.className = 'msg'; msg.textContent = '보내는 중…';
    try {
      const r = await BLIP.requestFriend(code); msg.className = 'msg ok';
      msg.textContent = r.done ? `${r.name}님과 바로 친구가 됐어요! (서로 요청했어요)` : r.pending ? `${code.toUpperCase()} 코드로 친구 요청을 남겼어요. 그 친구가 blip에 들어오면 요청이 보여요.` : `${r.name}님에게 친구 요청을 보냈어요. 상대가 수락하면 친구가 돼요.`;
      inp.value = ''; pollFriends();
    }
    catch (e) { msg.className = 'msg err'; msg.textContent = typeof e === 'number' ? '서버에 연결하지 못했어요. 잠시 후 다시 해 보세요.' : (e.message || '보내지 못했어요'); }
  };
  document.getElementById('addBtn').onclick = send;
  inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  document.getElementById('copyCode').onclick = async e => { try { await navigator.clipboard.writeText(BLIP.me.code); e.target.textContent = '✔ 복사됨'; } catch (x) { prompt('내 친구 코드', BLIP.me.code); } };
}
function renderFriendParts() {

/** 받은 초대 / 친구 요청 알림 (오른쪽 아래) */
const popSeen = {};
function renderPop() {
  const p = document.getElementById('pop');
  const items = [];
  for (const v of FR.invs) items.push(`<div class="fitem"><span class="av">${v.ava}</span><div class="tx"><b>${esc(v.nick)}님의 초대</b><small>${esc(GNAME(v.game))}에서 같이 놀자!</small></div><div class="fbtns"><button class="gbtn sm" data-invgo="${v.code}" data-game="${v.game}">가기</button><button class="gbtn sm gray" data-invno="${v.code}">거절</button></div></div>`);

    <div style="margin-top:14px;font-weight:800">아바타</div><div class="avs">${BLIP.AVAS.map(a => `<button data-ava="${a}" class="${a === ava ? 'on' : ''}">${a}</button>`).join('')}</div>
    <div class="addrow" style="justify-content:flex-end"><button class="gbtn gray" id="pCopy">코드 복사</button><button class="gbtn" id="pSave">저장</button></div><div class="msg" id="pMsg"></div>
    <div class="accbox">${me.acc ? `<div class="tx"><b>@${esc(me.acc)}</b> 계정으로 로그인 중<br><small style="color:var(--sub)">친구 목록과 냥냥 점프 기록이 계정에 저장돼요</small></div><button class="gbtn sm gray" id="pOut">로그아웃</button>` : `<div class="tx"><b>게스트</b>로 플레이 중<br><small style="color:var(--sub)">로그인하면 다른 기기에서도 친구와 기록이 그대로예요</small></div><button class="gbtn sm" id="pIn">로그인 / 가입</button>`}</div></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
  document.querySelectorAll('[data-ava]').forEach(b => b.onclick = () => { ava = b.dataset.ava; document.querySelectorAll('[data-ava]').forEach(x => x.classList.toggle('on', x === b)); document.getElementById('pAva').textContent = ava; });
  document.getElementById('pCopy').onclick = async e => { try { await navigator.clipboard.writeText(me.code); e.target.textContent = '✔ 복사됨'; } catch (x) { prompt('내 친구 코드', me.code); } };
  const po = document.getElementById('pOut'), pi = document.getElementById('pIn');
  if (po) po.onclick = () => { if (!po.dataset.sure) { po.dataset.sure = '1'; po.textContent = '정말 로그아웃'; return; } BLIP.logout(); FR.list = []; FR.reqs = []; FR.invs = []; showMe(); render(); pollFriends(); openProfile(); };
  if (pi) pi.onclick = () => openLogin('login');
  document.getElementById('pSave').onclick = () => { BLIP.setProfile(document.getElementById('pNick').value, ava); showMe(); const m = document.getElementById('pMsg'); m.className = 'msg ok'; m.textContent = '저장했어요!'; render(); };
}
function openLogin(tab) {
  const isUp = tab === 'signup';
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet" style="max-width:440px;margin:0 auto">
    <h3>${isUp ? '회원가입' : '로그인'}</h3>
    <div class="tabs" style="padding:0;margin-bottom:6px"><button class="tab ${isUp ? '' : 'on'}" id="tLogin">로그인</button><button class="tab ${isUp ? 'on' : ''}" id="tUp">회원가입</button></div>
    <p style="color:var(--sub);font-size:14px;margin:10px 0 0">냥냥 점프 계정과 같아요. 이미 냥냥 점프 아이디가 있으면 그대로 로그인하세요.</p>
    <form id="accForm" autocomplete="on">
      <div class="field"><label for="aId">아이디</label><input id="aId" name="username" autocomplete="username" autocapitalize="off" maxlength="12" placeholder="영어 소문자·숫자 4~12자"></div>
      <div class="field"><label for="aPw">비밀번호</label><input id="aPw" name="password" type="password" autocomplete="${isUp ? 'new-password' : 'current-password'}" placeholder="4자 이상"></div>
      ${isUp ? `<div class="field"><label for="aNick">닉네임</label><input id="aNick" maxlength="12" value="${esc(/^플레이어/.test(BLIP.me.nick) ? '' : BLIP.me.nick)}" placeholder="친구들에게 보이는 이름"><small>지금 기기의 친구 코드 ${BLIP.me.code}와 친구 목록이 이 계정으로 옮겨져요.</small></div>` : ''}
      <div class="addrow" style="margin-top:16px"><button class="gbtn" type="submit" id="aGo" style="flex:1">${isUp ? '가입하고 로그인' : '로그인'}</button></div>
      <div class="msg" id="aMsg"></div>
    </form></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
  document.getElementById('tLogin').onclick = () => openLogin('login');
  document.getElementById('tUp').onclick = () => openLogin('signup');
  setTimeout(() => { const i = document.getElementById('aId'); if (i) i.focus(); }, 50);
  document.getElementById('accForm').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('aGo'), msg = document.getElementById('aMsg');
    btn.disabled = true; msg.className = 'msg'; msg.textContent = isUp ? '가입하는 중…' : '로그인하는 중…';
    try {
      const id = document.getElementById('aId').value, pw = document.getElementById('aPw').value;
      if (isUp) await BLIP.signup(id, pw, document.getElementById('aNick').value); else await BLIP.login(id, pw);
      msg.className = 'msg ok'; msg.textContent = '환영해요, ' + BLIP.me.nick + '님!';
      FR.list = []; FR.reqs = []; FR.invs = []; showMe(); render(); pollFriends();
      setTimeout(closeDetail, 700);
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message || '다시 시도해 주세요'; btn.disabled = false; }
  };
}
function showMe() { document.getElementById('meAva').textContent = BLIP.me.ava; document.getElementById('meNick').textContent = BLIP.me.nick; document.getElementById('loginBtn').hidden = !!BLIP.me.acc; }
BLIP._onAccount = () => { showMe(); render(); pollFriends(); };
async function friendAction(t) {
  const d = t.dataset;
  try {
    if (d.friend) { const f = FR.list.find(x => x.code === d.friend); if (!f) return; view = 'friends'; render(); return; }
    if (d.follow) { BLIP.go(d.game, d.follow); return; }
    if (d.invfriend) { const f = FR.list.find(x => x.code === d.invfriend); openFriendInvite(f); return; }
    if (d.invpick) { openInvitePicker(d.invpick); return; }
    if (d.invsend) { t.disabled = true; t.textContent = '보내는 중…'; await BLIP.invite(d.invsend, d.game); t.textContent = '✔ 보냈어요'; return; }
    if (d.unfriend) {
      if (t.dataset.sure) { await BLIP.removeFriend(d.unfriend); FR.list = FR.list.filter(f => f.code !== d.unfriend); renderFriendParts(); }
      else { t.dataset.sure = '1'; t.textContent = '정말 삭제'; setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = '삭제'; } }, 3000); }
      return;
    }
    if (d.accept) { t.disabled = true; await BLIP.accept(d.accept); FR.reqs = FR.reqs.filter(r => r.code !== d.accept); popSeen['r' + d.accept] = 1; pollFriends(); return; }
    if (d.decline) { await BLIP.decline(d.decline); FR.reqs = FR.reqs.filter(r => r.code !== d.decline); renderFriendParts(); return; }
    if (d.later) { popSeen['r' + d.later] = 1; renderPop(); return; }
    if (d.invgo) { await BLIP.clearInvite(d.invgo); BLIP.go(d.game, d.invgo); return; }
    if (d.invno) { await BLIP.clearInvite(d.invno); FR.invs = FR.invs.filter(v => v.code !== d.invno); renderPop(); return; }
  } catch (e) { t.disabled = false; t.textContent = '다시 시도'; }
}
function openFriendInvite(f) {
  if (!f) return;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet"><h3>${f.ava} ${esc(f.nick)}님을 초대할 게임</h3><div class="flist">${GAMES.map(g => `<div class="fitem"><span class="av" style="background:#000 url(${g.sq}) center/cover"></span><div class="tx"><b>${g.icon} ${esc(g.name)}</b><small>${esc(g.genre)}</small></div><div class="fbtns"><button class="gbtn sm blue" data-invsend="${f.code}" data-game="${g.id}">초대 보내기</button></div></div>`).join('')}</div></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-friend],[data-follow],[data-invfriend],[data-invpick],[data-invsend],[data-unfriend],[data-accept],[data-decline],[data-later],[data-invgo],[data-invno]');
  if (t) { e.stopPropagation(); friendAction(t); }
}, true);
document.getElementById('meBtn').onclick = openProfile;
document.getElementById('loginBtn').onclick = () => openLogin('login');

/* ===================== 클릭 / 입력 ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-play],[data-v],[data-g]');
  if (!t) { if (e.target.id === 'ov') closeDetail(); return; }
  if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.dataset.play) play(t.dataset.play);
  else if (t.dataset.v) { view = t.dataset.v; query = ''; genre = '전체'; document.getElementById('q').value = ''; render(); window.scrollTo(0, 0); }
  else if (t.dataset.g) { genre = t.dataset.g; render(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
function applyTheme() { document.documentElement.classList.toggle('dark', !!ME.dark); document.getElementById('theme').textContent = ME.dark ? '☀️' : '🌙'; }
document.getElementById('theme').onclick = () => { ME.dark = !ME.dark; saveMe(); applyTheme(); };


/* ===================== 📮 게임 요청 우편함 ===================== */
const MAIL = { list: null, err: '', unseen: 0 };
const OWNER_MODE = new URLSearchParams(location.search).has('owner');
function ago(t) { const d = Math.max(0, BLIP.now() - t) / 60000; return d < 1 ? '방금' : d < 60 ? Math.floor(d) + '분 전' : d < 1440 ? Math.floor(d / 60) + '시간 전' : Math.floor(d / 1440) + '일 전'; }
function left(t) { const ms = t + BLIP.mail.DAY_MS - BLIP.now(); if (ms <= 0) return null; if (ms > BLIP.mail.DAY_MS - 60000) return '24시간'; const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000); return h ? `${h}시간 ${m}분` : `${m}분`; }
function stBadge(v) { if (v.st === 'done') return '<span class="st done">✅ 완성</span>'; const l = v.t ? left(v.t) : '24시간'; if (!l) return `<span class="st late">⏰ 곧 나와요</span>`; return v.st === 'make' ? `<span class="st make">🔨 만드는 중 · ${l} 남음</span>` : `<span class="st new">📬 접수 · ${l} 안에</span>`; }
function mailItemHTML(v) {
  const own = BLIP.mail.isOwner(), g = v.game && G(v.game), mine = (BLIP.me.myMail || []).includes(v.id);
  return `<div class="mitem"><div class="h"><b>${esc(v.title)}</b>${v.genre ? `<span class="chip" style="padding:3px 10px;font-size:12px">${esc(v.genre)}</span>` : ''}${stBadge(v)}</div>
    <div class="d">${esc(v.desc)}</div>
    <div class="who">${esc(v.ava || '🎮')} ${esc(v.nick || '익명')}${v.acc ? ' (@' + esc(v.acc) + ')' : ''} · ${v.t ? ago(v.t) : ''}${mine ? ' · <b style="color:var(--g2)">내 요청</b>' : ''}</div>
    ${g ? `<div><button class="gbtn sm" data-play="${g.id}">${g.icon} ${esc(g.name)} 하러 가기</button></div>` : ''}
    ${own ? `<div class="mown"><button class="gbtn sm blue" data-mst="${v.id}" data-s="make">🔨 만드는 중</button><select data-mg="${v.id}"><option value="">완성된 게임 고르기</option>${GAMES.map(x => `<option value="${x.id}" ${v.game === x.id ? 'selected' : ''}>${x.icon} ${esc(x.name)}</option>`).join('')}</select><button class="gbtn sm" data-mst="${v.id}" data-s="done">✅ 완성</button><button class="gbtn sm gray" data-mdel="${v.id}">🗑️ 지우기</button></div>` : ''}</div>`;
}
function mailViewHTML() {
  const own = BLIP.mail.isOwner(), L = MAIL.list;
  const open = (L || []).filter(v => v.st !== 'done'), done = (L || []).filter(v => v.st === 'done');
  return `<div class="mbox"><div class="env">📮</div><h1>게임 우편함</h1><p>“이런 게임 있었으면 좋겠다!” 하는 게임을 보내 주세요. blip이 직접 만들어서 허브에 올려 드려요.</p><div class="promise">⏰ 24시간 안에 만들어 드려요!</div></div>
    <div class="sec"><div class="sech"><h2>✉️ 요청 보내기</h2></div>
      <form class="mform" id="mForm" autocomplete="off">
        <div class="lbl">게임 이름</div><input id="mTitle" maxlength="40" placeholder="예: 좀비 피하기 달리기">
        <div class="lbl">어떤 게임이에요?</div><textarea id="mDesc" maxlength="600" placeholder="어떻게 하는 게임인지, 꼭 있었으면 하는 것들을 자유롭게 적어 주세요. 자세할수록 원하는 대로 나와요!"></textarea><div class="cnt" id="mCnt">0 / 600</div>
        <div class="chips" id="mGenre" style="margin:0">${['액션', '캐주얼', '퍼즐', '레이싱', '스포츠', '전략', 'RPG', '공포', '기타'].map(x => `<button type="button" class="chip" data-mgn="${x}">${x}</button>`).join('')}</div>
        <div class="addrow"><button class="gbtn" type="submit" id="mSend" style="flex:1">📮 우편함에 넣기</button></div>
        <div class="msg ${MAIL.flash ? 'ok' : ''}" id="mMsg">${MAIL.flash || ''}</div>
      </form></div>
    <div class="sec"><div class="sech"><h2>📬 만들고 있는 요청</h2><span>${open.length}개</span>${own ? `<span class="chip" style="padding:4px 10px;font-size:12px">📥 @${esc(BLIP.me.acc)} 계정으로 받는 중</span>` : ''}</div>${L === null ? `<div class="empty">불러오는 중…</div>` : open.length ? `<div class="mlist">${open.map(mailItemHTML).join('')}</div>` : `<div class="empty">${MAIL.err || '아직 요청이 없어요. 첫 번째로 보내 보세요!'}</div>`}</div>
    ${done.length ? `<div class="sec"><div class="sech"><h2>🎉 완성된 요청</h2><span>${done.length}개</span></div><div class="mlist">${done.map(mailItemHTML).join('')}</div></div>` : ''}
    ${OWNER_MODE && !own ? `<div class="claim">📮 이 우편함으로 오는 요청을 내 계정으로 받기 ${BLIP.me.acc ? `<button class="gbtn sm" id="mClaim">@${esc(BLIP.me.acc)} 계정으로 받기</button>` : '<button class="gbtn sm" id="mLogin">먼저 로그인</button>'}<span id="mCl"></span></div>` : ''}`;
}
let mGenre = '';
function bindMailView() {
  const f = document.getElementById('mForm'); if (!f) return;
  const d = document.getElementById('mDesc'), c = document.getElementById('mCnt'); d.oninput = () => c.textContent = d.value.length + ' / 600';
  document.querySelectorAll('[data-mgn]').forEach(b => { b.classList.toggle('on', b.dataset.mgn === mGenre); b.onclick = () => { mGenre = mGenre === b.dataset.mgn ? '' : b.dataset.mgn; document.querySelectorAll('[data-mgn]').forEach(x => x.classList.toggle('on', x.dataset.mgn === mGenre)); }; });
  f.onsubmit = async e => {
    e.preventDefault(); const msg = document.getElementById('mMsg'), btn = document.getElementById('mSend'); btn.disabled = true; msg.className = 'msg'; msg.textContent = '보내는 중…';
    try { await BLIP.mail.send(document.getElementById('mTitle').value, d.value, mGenre); MAIL.flash = '📮 보냈어요! 24시간 안에 만들어 드릴게요. 완성되면 알림으로 알려 드려요.'; setTimeout(() => MAIL.flash = '', 15000); msg.className = 'msg ok'; msg.textContent = MAIL.flash; document.getElementById('mTitle').value = ''; d.value = ''; mGenre = ''; c.textContent = '0 / 600'; loadMail(true); }
    catch (er) { msg.className = 'msg err'; msg.textContent = er && er.message ? er.message : '보내지 못했어요. 잠시 뒤 다시 해 보세요.'; }
    btn.disabled = false;
  };
  const cl = document.getElementById('mClaim'); if (cl) cl.onclick = async () => { try { await BLIP.mail.claim(); BLIP.notify('📮 이제 이 계정으로 게임 요청을 받아요'); loadMail(true); } catch (er) { document.getElementById('mCl').textContent = er.message; } };
  const lg = document.getElementById('mLogin'); if (lg) lg.onclick = () => openLogin('login');
  document.querySelectorAll('[data-mst]').forEach(b => b.onclick = async () => { const id = b.dataset.mst, st = b.dataset.s; const sel = document.querySelector(`[data-mg="${id}"]`); const patch = { st }; if (st === 'done') { if (!sel.value) { BLIP.notify('완성된 게임을 먼저 골라 주세요'); return; } patch.game = sel.value; patch.doneT = { '.sv': 'timestamp' }; } try { await BLIP.mail.set(id, patch); loadMail(true); } catch (er) { BLIP.notify(er.message); } });
  document.querySelectorAll('[data-mdel]').forEach(b => b.onclick = async () => { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 지울까요?'; return; } try { await BLIP.mail.del(b.dataset.mdel); loadMail(true); } catch (er) { BLIP.notify(er.message); } });
}
function mailBadge() { const el = document.getElementById('nReq'); if (el) el.innerHTML = MAIL.unseen ? `<span class="badge">${MAIL.unseen}</span>` : ''; }
async function loadMail(rerender) {
  try { await BLIP.mail.owner(true); MAIL.list = await BLIP.mail.list(60); MAIL.err = ''; } catch (e) { MAIL.list = MAIL.list || []; MAIL.err = '요청 목록을 불러오지 못했어요'; }
  if (BLIP.mail.isOwner()) { const seen = Number(BLIP.me.mailSeen || 0); MAIL.unseen = MAIL.list.filter(v => (v.t || 0) > seen && v.st !== 'done').length; if (view === 'req') { BLIP.mail.seenNow(MAIL.list); MAIL.unseen = 0; } } else MAIL.unseen = 0;
  mailBadge(); if (view === 'req' && (rerender || !document.activeElement || !document.activeElement.closest('#mForm'))) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
async function pollMailHub() { if (BLIP.mail.isOwner() && view !== 'req') await BLIP.mail.poll(() => { }); loadMail(false); }
if (new URLSearchParams(location.search).get('v') === 'req' || OWNER_MODE) view = 'req';
setTimeout(pollMailHub, 1500); setInterval(pollMailHub, 30000);
applyTheme(); showMe(); render(); loadCatJump(); pollFriends(); setInterval(pollFriends, 6000);
</script>
