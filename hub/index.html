<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blip — 게임</title>
<meta name="description" content="blip 게임 허브 · 냥냥 점프, 바이러스 시뮬레이터, 쌍성 궤도, 머드락 섬, 하프코트 레전드">
<style>
  /* =========== 색상 (밝은 테마 / 어두운 테마) =========== */
  :root{--bg:#f2f4f5;--panel:#fff;--panel2:#f7f8f9;--line:#e3e5e8;--text:#232527;--sub:#606162;--blue:#0b74e5;--green:#00b06f;--green2:#00995f;--chip:#e9ecef;--shadow:0 1px 3px rgba(0,0,0,.08)}
  html.dark{--bg:#111214;--panel:#191b1d;--panel2:#202225;--line:#2c2e31;--text:#f2f3f5;--sub:#a7a9ac;--chip:#26282b;--shadow:0 1px 3px rgba(0,0,0,.5)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* =========== 위쪽 바 =========== */
  .top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.03em}
  .logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--text);color:var(--panel);font-style:normal;font-size:17px;transform:rotate(-12deg)}
  .search{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;font-family:inherit}
  .tbtn{flex:0 0 38px;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:17px}
  .tbtn:hover{border-color:var(--sub)}

  /* =========== 왼쪽 메뉴 =========== */
  .layout{display:flex;min-height:calc(100vh - 56px)}
  .side{width:190px;flex:0 0 190px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px)}
  .nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:8px;font-size:15px;font-weight:700;text-align:left}
  .nav:hover{background:var(--panel2)}
  .nav.on{background:var(--chip)}
  .nav .ic{width:22px;text-align:center;font-size:18px}
  .nav .n{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
  .sideFoot{position:absolute;bottom:14px;left:16px;right:16px;font-size:12px;color:var(--sub);line-height:1.6}

  /* =========== 본문 =========== */
  main{flex:1;min-width:0;padding:22px 26px 60px}
  .hello{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .ava{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffd54a,#ff7a59);display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
  .hello h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em}
  .hello small{color:var(--sub)}
  .sec{margin-bottom:30px}
  .sech{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .sech h2{margin:0;font-size:20px;font-weight:800}
  .sech span{color:var(--sub);font-size:13px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:0;background:var(--chip);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px}
  .chip.on{background:var(--text);color:var(--panel)}

  /* 게임 타일 (정사각형 썸네일 + 제목 + 정보) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 16px}
  .tile{display:block;border:0;background:transparent;padding:0;text-align:left;width:100%}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:var(--shadow);transition:transform .15s}
  .tile:hover .thumb{transform:translateY(-3px)}
  .thumb .play{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:17px;opacity:0;transform:scale(.8);transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .tile:hover .play{opacity:1;transform:none}
  .thumb .fav{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#ffd54a;border-radius:6px;padding:2px 6px;font-size:12px}
  .tname{margin:8px 0 3px;font-weight:800;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tinfo{display:flex;gap:10px;color:var(--sub);font-size:12.5px;align-items:center}
  .tinfo .on{color:var(--green);font-weight:700}
  .empty{color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center}

  /* =========== 게임 상세 창 =========== */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .ov.show{display:flex;animation:fi .18s}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .det{background:var(--panel);border-radius:14px;width:min(880px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .2s ease-out}
  @keyframes pop{from{transform:scale(.97)}to{transform:none}}
  .dtop{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;padding:20px}
  .banner{border-radius:10px;aspect-ratio:16/9;background:#000 center/cover no-repeat}
  .dtitle{margin:2px 0 4px;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
  .by{color:var(--sub);font-size:14px;margin-bottom:14px}.by b{color:var(--blue)}
  .bigplay{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:28px;box-shadow:0 3px 0 var(--green2)}
  .bigplay:hover{filter:brightness(1.07)}
  .bigplay:active{transform:translateY(2px);box-shadow:none}
  .drow{display:flex;gap:8px;margin-top:10px}
  .sbtn{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
  .sbtn.on{border-color:#e8b400;color:#c99a00;background:#fff8dd}
  html.dark .sbtn.on{background:#3a3110}
  .x{position:sticky;top:0;float:right;margin:10px 10px 0 0;width:36px;height:36px;border-radius:50%;border:0;background:var(--chip);font-size:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px}
  .tab{border:0;background:transparent;padding:12px 14px;font-weight:800;font-size:14px;color:var(--sub);border-bottom:3px solid transparent}
  .tab.on{color:var(--text);border-color:var(--text)}
  .dbody{padding:18px 20px 24px}
  .dbody p{line-height:1.65;margin:0 0 14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .stats div{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .stats small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
  .stats b{font-size:14.5px}
  .live{background:var(--panel2);border-radius:10px;padding:12px 14px;margin-top:14px}
  .live h4{margin:0 0 8px;font-size:14px}
  .live ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
  .live li{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
  .live li:last-child{border:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tags span{background:var(--chip);border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700}

  /* =========== 친구 · 프로필 =========== */
  .me{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 4px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:14px;flex:0 0 auto;max-width:180px}
  .me .av{width:30px;height:30px;font-size:18px}
  .me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{position:relative;display:grid;place-items:center;border-radius:50%;background:var(--chip);flex:0 0 auto}
  .av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
  .badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e2231a;color:#fff;font-size:11px;font-weight:800}
  .frow{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
  .fr{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;flex:0 0 84px;border:0;background:transparent;padding:0}
  .fr .av{width:72px;height:72px;font-size:38px;box-shadow:var(--shadow)}
  .fr b{font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr small{font-size:11px;color:var(--green);font-weight:700;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
  .fr small.off{color:var(--sub)}
  .fr.add .av{background:transparent;border:2px dashed var(--line);font-size:30px;color:var(--sub)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
  .addrow{display:flex;gap:8px;flex-wrap:wrap}
  .addrow input{flex:1;min-width:160px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;font-size:16px;font-weight:700;font-family:inherit}
  .gbtn{height:42px;padding:0 16px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:800;font-size:14px}
  .gbtn.gray{background:var(--chip);color:var(--text)}
  .gbtn.blue{background:var(--blue)}
  .gbtn.sm{height:34px;padding:0 12px;font-size:13px}
  .gbtn:disabled{opacity:.45;cursor:not-allowed}
  .mycode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--sub);font-size:14px}
  .mycode b{font-size:22px;letter-spacing:.18em;color:var(--text)}
  .flist{display:grid;gap:8px}
  .fitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .fitem .av{width:46px;height:46px;font-size:26px}
  .fitem .tx{flex:1;min-width:0}
  .fitem .tx b{display:block;font-size:15px}
  .fitem .tx small{color:var(--sub);font-size:13px}
  .fitem .tx small.on{color:var(--green);font-weight:700}
  .fbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .msg{min-height:20px;margin-top:8px;font-size:14px;font-weight:700}
  .msg.ok{color:var(--green)}.msg.err{color:#e2231a}
  .accbox{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .accbox .tx{flex:1;min-width:0}
  .field{display:grid;gap:6px;margin-top:12px}
  .field label{font-weight:800;font-size:14px}
  .field input{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;font-size:16px;font-family:inherit}
  .field small{color:var(--sub);font-size:12.5px}
  .pop{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
  .pop .fitem{box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s ease-out}
  .avs{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
  .avs button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--chip);font-size:24px}
  .avs button.on{border-color:var(--green)}
  .sheet{padding:20px}
  .sheet h3{margin:0 0 12px;font-size:20px}
  .playing{color:var(--green);font-weight:700}

  /* =========== 휴대폰 =========== */
  .bnav{display:none}
  @media (max-width:820px){
    .side{display:none}
    main{padding:16px 14px 90px}
    .logo span{display:none}
    .grid{grid-template-columns:repeat(2,1fr);gap:14px 12px}
    .dtop{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .me span:last-child{display:none}.me{padding:0 4px}
    #loginBtn{padding:0 10px}
    .pop{left:16px;right:16px;bottom:74px}
    .avs{grid-template-columns:repeat(6,1fr)}
    .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);height:62px}
    .bnav button{flex:1;border:0;background:transparent;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .bnav button span{font-size:20px}
    .bnav button.on{color:var(--text)}
  }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./"><i>b</i><span>blip</span></a>
  <label class="search">🔍<input id="q" type="search" placeholder="게임 검색" autocomplete="off"></label>
  <button class="tbtn" id="theme" title="밝게 / 어둡게">🌙</button>
  <button class="gbtn sm" id="loginBtn" style="flex:0 0 auto">로그인</button>
  <button class="me" id="meBtn" title="내 프로필"><span class="av" id="meAva">😺</span><span id="meNick">나</span></button>
</header>

<div class="layout">
  <aside class="side">
    <button class="nav on" data-v="home"><span class="ic">🏠</span>홈</button>
    <button class="nav" data-v="all"><span class="ic">🎮</span>모든 게임<span class="n" id="nAll"></span></button>
    <button class="nav" data-v="friends"><span class="ic">👥</span>친구<span class="n" id="nFr"></span></button>
    <button class="nav" data-v="fav"><span class="ic">⭐</span>즐겨찾기<span class="n" id="nFav"></span></button>
    <button class="nav" data-v="recent"><span class="ic">🕒</span>최근 플레이<span class="n" id="nRec"></span></button>
    <div class="sideFoot">© blip company<br>모든 게임 무료 · 설치 없음</div>
  </aside>

  <main id="main"></main>
</div>

<nav class="bnav">
  <button class="on" data-v="home"><span>🏠</span>홈</button>
  <button data-v="all"><span>🎮</span>게임</button>
  <button data-v="friends"><span>👥</span>친구</button>
  <button data-v="fav"><span>⭐</span>즐겨찾기</button>
  <button data-v="recent"><span>🕒</span>최근</button>
</nav>

<div class="ov" id="ov"><div class="det" id="det"></div></div>
<div class="pop" id="pop"></div>
<script src="../common/blip.js" data-game="hub" data-ui="none"></script>

<script>
/* ===================== 게임 목록 =====================
   새 게임을 추가하려면 이 배열에 항목 하나만 더 넣으면 돼요. */
const GAMES = [
  {
    id: 'catjump', name: '냥냥 점프', url: '../catjump/',
    sq: 'sq_catjump.jpg', bn: 'bn_catjump.jpg', genre: '캐주얼', icon: '🐾',
    desc: '고양이가 양쪽 벽을 번갈아 타고 끝없이 올라가는 점프 게임이에요. 장애물을 피하며 최고 기록에 도전하고, 고양이와 스킨을 모으고, 친구와 1:1 대결·거래를 해 보세요. 시즌마다 1~3등은 칭호를 받아요.',
    info: [['장르', '캐주얼 점프'], ['기기', '모바일 · PC'], ['온라인', '랭킹 · 대결 · 거래'], ['조작', '클릭 · 스페이스 · 터치']],
    tags: ['시즌 랭킹', '1:1 대결', '거래', '라이브 이벤트', '스킬 각성'],
  },
  {
    id: 'virus', name: '바이러스 시뮬레이터', url: '../virus/',
    sq: 'sq_virus.jpg', bn: 'bn_virus.jpg', genre: '전략', icon: '🦠',
    desc: '가상의 바이러스가 실제 세계 지도 176개국으로 퍼지는 전략 시뮬레이션이에요. 바이러스가 되어 능력을 키우며 세계로 퍼지거나, 국제 방역 기구가 되어 의료 자원을 나누고 백신 연구를 도와 세계를 지켜 보세요.',
    info: [['장르', '전략 시뮬레이션'], ['기기', 'PC 추천'], ['모드', '확산 · 방역'], ['저장', '자동 저장']],
    tags: ['실제 세계 지도', '업그레이드 트리', '실시간 뉴스', '랜덤 이벤트'],
  },
  {
    id: 'ball', name: '쌍성 궤도', url: '../balldance/',
    sq: 'sq_ball.jpg', bn: 'bn_ball.jpg', genre: '리듬', icon: '🪐',
    desc: '두 행성이 번갈아 서로를 돌며 길을 따라가는 리듬 게임이에요. 도는 행성이 다음 칸에 닿는 순간 박자에 맞춰 누르세요. 12개 월드, 직접 만드는 맵, 공유 코드까지 있어요.',
    info: [['장르', '리듬'], ['기기', '모바일 · PC'], ['월드', '12개 + 맵 만들기'], ['조작', '아무 키 · 탭']],
    tags: ['12개 월드', '맵 에디터', '공유 코드', '연습 모드'],
  },
  {
    id: 'mudlark', name: '머드락 섬', url: '../mudlark/',
    sq: 'sq_mudlark.jpg', bn: 'bn_mudlark.jpg', genre: '생존', icon: '🐄',
    desc: '넓은 로우폴리 섬에 맨몸으로 떨어져 살아남는 3D 생존 로그라이크예요. 나무를 치고 돌을 주워 작업대와 화로를 만들고, 나무에서 금까지 장비를 올리세요. 밤마다 몬스터가 몰려오고 3일마다 보스가 나와요. 코인으로 상자를 열어 파워업을 쌓으세요.',
    info: [['장르', '3D 생존 로그라이크'], ['기기', 'PC (키보드 · 마우스)'], ['맵', '매번 새로 생성되는 섬'], ['조작', 'WASD · 마우스 · E · Tab · M']],
    tags: ['제작', '낮·밤', '보스', '파워업', '섬 지도'],
  },
  {
    id: 'hoops', name: '하프코트 레전드', url: '../hoops/',
    sq: 'sq_hoops.jpg', bn: 'bn_hoops.jpg', genre: '스포츠', icon: '🏀',
    desc: '로블록스 스타일 캐릭터로 하는 3D 1대1 길거리 농구예요. 로비를 걸어다니며 뽑기 머신에서 캐릭터를 뽑고, 코트의 원 안에 서면 경기가 시작돼요. 캐릭터마다 고유 스킬과 궁극기가 있고, 크로스오버·스핀·스텝백으로 상대의 발목을 꺾을 수 있어요. 상대가 없으면 AI와, 같은 키보드로는 친구와 대결해요.',

const GENRES = ['전체', ...new Set(GAMES.map(g => g.genre))];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const G = id => GAMES.find(g => g.id === id);

/* ===================== 실제 데이터 (가짜 숫자 없음) ===================== */
const LIVE = { cjOnline: null, cjTop: null, cjSeason: null };
const FB = 'https://cat-jump-3afbb-default-rtdb.firebaseio.com';
async function loadCatJump() {
  try {
    const get = p => fetch(FB + '/' + p + '.json').then(r => r.ok ? r.json() : null);
    const [se, rk, pin, ban, lobby] = await Promise.all([get('season'), get('ranking'), get('rankPin'), get('banned'), get('rooms/lobby')]);
    // 지금 접속 중: 최근 40초 안에 신호를 보낸 사람 수
    const now = Date.now(); let on = 0;
    for (const k in lobby || {}) { const v = lobby[k]; if (v && Math.abs(now - (Number(v.t) || 0)) < 40000) on++; }
    LIVE.cjOnline = on;
    // 이번 시즌 TOP 3
    const n = Math.max(1, Math.floor(Number(se && se.n) || 1)), seen = {}, rows = [];
    const add = (k, v, pinned) => { if (!v || typeof v !== 'object') return; if (!pinned && (ban || {})[k]) return; if ((Number(v.sn) || 1) !== n) return;
      const nick = String(v.nick || '냥이').slice(0, 10), best = Math.max(0, Math.floor(Number(v.best) || 0)), key = nick.trim().toLowerCase();
      if (seen[key] !== undefined) { if (rows[seen[key]].best < best) rows[seen[key]] = { nick, best }; return; } seen[key] = rows.length; rows.push({ nick, best }); };
    for (const k in rk || {}) add(k, rk[k], false); for (const k in pin || {}) add(k, pin[k], true);
    rows.sort((a, b) => b.best - a.best); LIVE.cjTop = rows.slice(0, 5); LIVE.cjSeason = n;
  } catch (e) {}
  render(); if (openId) openDetail(openId, curTab);
}
function localInfo(id) {
  try {
    if (id === 'virus') { const d = JSON.parse(localStorage.getItem('virussim_save_v1') || 'null'); if (d && d.day != null) return `💾 이어하기 · DAY ${d.day}`; }
    if (id === 'ball') { const d = JSON.parse(localStorage.getItem('twin-orbit-v1') || 'null'); const n = d && d.best ? Object.keys(d.best).length : 0; if (n) return `🏁 ${n}/12 월드 클리어`; }
    if (id === 'catjump') { const d = JSON.parse(localStorage.getItem('nyangjump_save_v2') || 'null'); if (d && d.best) return `🏔️ 내 최고 ${Number(d.best).toLocaleString('ko-KR')}m`; }
  } catch (e) {}
  return '';
}

let view = 'home', genre = '전체', query = '', openId = null, curTab = 'about';
function tile(g) {

function filtered(list) {

      <div class="sec"><div class="sech"><h2>🔥 추천 게임</h2><span>blip이 만든 게임</span></div>${chips}${grid(filtered(GAMES), '이 장르의 게임이 아직 없어요')}</div>
      ${fav.length ? `<div class="sec"><div class="sech"><h2>⭐ 즐겨찾기</h2></div>${grid(fav)}</div>` : ''}`;
  } else if (view === 'all') {

  } else if (view === 'friends') {

  } else if (view === 'fav') {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>⭐ 즐겨찾기</h2></div>${grid(fav, '아직 즐겨찾기한 게임이 없어요.<br>게임을 열고 ☆ 즐겨찾기를 눌러 보세요.')}</div>`;
  } else {
    m.innerHTML = `<div class="sec"><div class="sech"><h2>🕒 최근 플레이</h2>${rec.length ? '<button class="chip" id="clrRec">기록 지우기</button>' : ''}</div>${grid(rec, '아직 플레이한 게임이 없어요')}</div>`;
    const c = document.getElementById('clrRec'); if (c) c.onclick = () => { ME.recent = []; saveMe(); render(); };
  }
}

/* ===================== 게임 상세 창 ===================== */

  }
  const body = curTab === 'about'

    : `<div class="stats"><div><small>내 기록</small><b>${li ? esc(li) : '아직 없음'}</b></div><div><small>즐겨찾기</small><b>${fav ? '⭐ 등록됨' : '안 함'}</b></div><div><small>최근 플레이</small><b>${ME.recent.includes(id) ? '✔ 해봄' : '아직'}</b></div><div><small>만든 곳</small><b>blip</b></div></div>
       <p style="margin-top:14px;color:var(--sub)">기록은 이 브라우저에 저장돼요. 같은 브라우저로 들어오면 이어서 볼 수 있어요.</p>`;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button>
    <div class="dtop"><div class="banner" style="background-image:url(${g.bn})"></div>

        <div class="drow"><button class="sbtn ${fav ? 'on' : ''}" id="dfav">${fav ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기'}</button><button class="sbtn" id="dshare">🔗 링크 복사</button></div>
        <div class="drow"><button class="sbtn" data-invpick="${g.id}">👥 친구 초대</button></div>
        ${li ? `<div style="margin-top:12px;color:var(--sub);font-size:14px">${esc(li)}</div>` : ''}

  document.getElementById('ov').classList.add('show');

function play(id) {

}

/* ===================== 친구 · 멀티플레이 ===================== */
const FR = { list: [], reqs: [], invs: [], users: {}, loaded: false };
const GNAME = id => BLIP.GAMES[id] ? BLIP.GAMES[id].icon + ' ' + BLIP.GAMES[id].name : '';
/** 실제로 지금 그 게임을 하고 있는 사람 수 (가짜 숫자 없음) */
function playing(id) {
  let n = 0; for (const k in FR.users) { const u = FR.users[k]; if (u && u.game === id && BLIP.isOnline(u)) n++; }
  if (id === 'catjump' && LIVE.cjOnline) n = Math.max(n, LIVE.cjOnline);
  return n;
}
function statusText(f) { return f.online ? (f.game ? GNAME(f.game) + ' 플레이 중' : '허브에 있어요') : '오프라인'; }
function homeFriendsHTML() {
  const list = FR.list.slice(0, 12);
  return `<div class="sech"><h2>👥 친구 ${FR.list.length ? `(${FR.list.length})` : ''}</h2>${FR.reqs.length ? `<button class="chip" data-v="friends">친구 요청 ${FR.reqs.length}개 <span class="badge">${FR.reqs.length}</span></button>` : ''}</div>
    <div class="frow">${list.map(f => `<button class="fr" data-friend="${f.code}"><span class="av ${f.online ? 'on' : ''}">${f.ava}</span><b>${esc(f.nick)}</b><small class="${f.online ? '' : 'off'}">${f.online ? (f.game ? BLIP.GAMES[f.game].name : '온라인') : '오프라인'}</small></button>`).join('')}
      <button class="fr add" data-v="friends"><span class="av">＋</span><b>친구 추가</b></button></div>`;
}
function friendItem(f) {
  return `<div class="fitem"><span class="av ${f.online ? 'on' : ''}">${f.ava}</span><div class="tx"><b>${esc(f.nick)}${f.acc ? ` <small style="color:var(--sub);font-weight:600">@${esc(f.acc)}</small>` : ''}</b><small class="${f.online ? 'on' : ''}">${esc(statusText(f))} · ${f.code}</small></div>
    <div class="fbtns">${f.online && f.game ? `<button class="gbtn sm" data-follow="${f.code}" data-game="${f.game}">따라 들어가기</button>` : ''}<button class="gbtn sm blue" data-invfriend="${f.code}">초대</button><button class="gbtn sm gray" data-unfriend="${f.code}">삭제</button></div></div>`;
}
function friendsListHTML() {
  return `${FR.reqs.length ? `<div class="sech"><h2>📨 받은 친구 요청</h2></div><div class="flist">${FR.reqs.map(r => `<div class="fitem"><span class="av">${r.ava}</span><div class="tx"><b>${esc(r.nick)}</b><small>${r.acc ? '@' + esc(r.acc) + ' · ' : ''}코드 ${r.code}</small></div><div class="fbtns"><button class="gbtn sm" data-accept="${r.code}">수락</button><button class="gbtn sm gray" data-decline="${r.code}">거절</button></div></div>`).join('')}</div><div style="height:22px"></div>` : ''}
    <div class="sech"><h2>내 친구</h2><span>${FR.list.filter(f => f.online).length}명 접속 중 · 전체 ${FR.list.length}명</span></div>
    <div class="flist">${FR.list.length ? FR.list.map(friendItem).join('') : `<div class="empty">${FR.loaded ? '아직 친구가 없어요. 위에서 친구 코드나 아이디로 추가해 보세요!' : '친구 목록을 불러오는 중…'}</div>`}</div>`;
}
function friendsViewHTML() {
  return `<div class="sec"><div class="sech"><h2>👥 친구</h2></div>
    <div class="card"><b>친구 추가</b><div style="color:var(--sub);font-size:14px;margin:4px 0 10px">친구의 <b>6자리 친구 코드</b>나 <b>아이디</b>를 넣으면 친구 요청을 보내요.</div>
      <div class="addrow"><input id="addCode" maxlength="12" placeholder="친구 코드 또는 아이디" autocomplete="off" autocapitalize="off"><button class="gbtn" id="addBtn">요청 보내기</button></div>
      <div class="msg" id="addMsg"></div>
      <div class="mycode">내 친구 코드 <b id="myCode">${BLIP.me.code}</b><button class="gbtn sm gray" id="copyCode">복사</button></div></div></div>
    <div class="sec" id="frList">${friendsListHTML()}</div>`;
}
function bindFriendsView() {
  const inp = document.getElementById('addCode'), msg = document.getElementById('addMsg');
  const send = async () => {
    const code = inp.value.trim(); msg.className = 'msg'; msg.textContent = '보내는 중…';
    try {
      const r = await BLIP.requestFriend(code); msg.className = 'msg ok';
      msg.textContent = r.done ? `${r.name}님과 바로 친구가 됐어요! (서로 요청했어요)` : r.pending ? `${code.toUpperCase()} 코드로 친구 요청을 남겼어요. 그 친구가 blip에 들어오면 요청이 보여요.` : `${r.name}님에게 친구 요청을 보냈어요. 상대가 수락하면 친구가 돼요.`;
      inp.value = ''; pollFriends();
    }
    catch (e) { msg.className = 'msg err'; msg.textContent = typeof e === 'number' ? '서버에 연결하지 못했어요. 잠시 후 다시 해 보세요.' : (e.message || '보내지 못했어요'); }
  };
  document.getElementById('addBtn').onclick = send;
  inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  document.getElementById('copyCode').onclick = async e => { try { await navigator.clipboard.writeText(BLIP.me.code); e.target.textContent = '✔ 복사됨'; } catch (x) { prompt('내 친구 코드', BLIP.me.code); } };
}
function renderFriendParts() {
  const h = document.getElementById('homeFriends'); if (h) h.innerHTML = homeFriendsHTML();
  const l = document.getElementById('frList'); if (l) l.innerHTML = friendsListHTML();
  // 타일의 '플레이 중' 숫자와 메뉴 배지만 새로 그림 (입력 중인 칸은 건드리지 않음)
  document.querySelectorAll('.tile').forEach(t => { const id = t.dataset.open, info = t.querySelector('.tinfo'); if (!info) return; const n = playing(id), g = G(id), li = localInfo(id); info.innerHTML = (n ? `<span class="on">● ${n}명 플레이 중</span>` : `<span>${esc(g.genre)}</span>`) + (li ? `<span>${esc(li)}</span>` : ''); });
  const nr = FR.reqs.length, nOn = FR.list.filter(f => f.online).length;

  renderPop();
}
/** 받은 초대 / 친구 요청 알림 (오른쪽 아래) */
const popSeen = {};
function renderPop() {
  const p = document.getElementById('pop');
  const items = [];
  for (const v of FR.invs) items.push(`<div class="fitem"><span class="av">${v.ava}</span><div class="tx"><b>${esc(v.nick)}님의 초대</b><small>${esc(GNAME(v.game))}에서 같이 놀자!</small></div><div class="fbtns"><button class="gbtn sm" data-invgo="${v.code}" data-game="${v.game}">가기</button><button class="gbtn sm gray" data-invno="${v.code}">거절</button></div></div>`);
  for (const r of FR.reqs) if (!popSeen['r' + r.code]) items.push(`<div class="fitem"><span class="av">${r.ava}</span><div class="tx"><b>${esc(r.nick)}님의 친구 요청</b><small>코드 ${r.code}</small></div><div class="fbtns"><button class="gbtn sm" data-accept="${r.code}">수락</button><button class="gbtn sm gray" data-later="${r.code}">나중에</button></div></div>`);
  p.innerHTML = items.join('');
}
async function pollFriends() {
  try {
    const [list, box, users] = await Promise.all([BLIP.friendList(), BLIP.inbox(), BLIP.allUsers()]);
    FR.list = list; FR.reqs = box.reqs; FR.invs = box.invs; FR.users = users; FR.loaded = true;
    renderFriendParts();
    if (openId) { const pick = document.getElementById('invPick'); if (pick) pick.innerHTML = invPickHTML(pick.dataset.game); }
  } catch (e) { FR.loaded = true; renderFriendParts(); }
}
function invPickHTML(game) {
  const on = FR.list.filter(f => f.online);
  return FR.list.length ? FR.list.map(f => `<div class="fitem"><span class="av ${f.online ? 'on' : ''}">${f.ava}</span><div class="tx"><b>${esc(f.nick)}</b><small class="${f.online ? 'on' : ''}">${esc(statusText(f))}</small></div><div class="fbtns"><button class="gbtn sm blue" data-invsend="${f.code}" data-game="${game}">초대 보내기</button></div></div>`).join('') + (on.length ? '' : '<p style="color:var(--sub);margin-top:10px">지금 접속 중인 친구가 없어도 초대는 10분 동안 남아 있어요.</p>')
    : '<div class="empty">아직 친구가 없어요. 👥 친구 메뉴에서 먼저 추가해 보세요.</div>';
}
function openInvitePicker(game) {
  openId = openId || game;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet"><h3>👥 ${esc(GNAME(game))}에 친구 초대</h3><div class="flist" id="invPick" data-game="${game}">${invPickHTML(game)}</div></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
}
function openProfile() {
  const me = BLIP.me; let ava = me.ava;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet"><h3>내 프로필</h3>
    <div style="display:flex;align-items:center;gap:14px"><span class="av on" id="pAva" style="width:72px;height:72px;font-size:40px">${ava}</span><div><div style="color:var(--sub);font-size:13px">친구 코드</div><div style="font-size:24px;font-weight:900;letter-spacing:.18em">${me.code}</div></div></div>
    <div style="margin-top:16px;font-weight:800">닉네임</div><div class="addrow" style="margin-top:6px"><input id="pNick" maxlength="12" value="${esc(me.nick)}" style="letter-spacing:0;text-transform:none"></div>
    <div style="margin-top:14px;font-weight:800">아바타</div><div class="avs">${BLIP.AVAS.map(a => `<button data-ava="${a}" class="${a === ava ? 'on' : ''}">${a}</button>`).join('')}</div>
    <div class="addrow" style="justify-content:flex-end"><button class="gbtn gray" id="pCopy">코드 복사</button><button class="gbtn" id="pSave">저장</button></div><div class="msg" id="pMsg"></div>
    <div class="accbox">${me.acc ? `<div class="tx"><b>@${esc(me.acc)}</b> 계정으로 로그인 중<br><small style="color:var(--sub)">친구 목록과 냥냥 점프 기록이 계정에 저장돼요</small></div><button class="gbtn sm gray" id="pOut">로그아웃</button>` : `<div class="tx"><b>게스트</b>로 플레이 중<br><small style="color:var(--sub)">로그인하면 다른 기기에서도 친구와 기록이 그대로예요</small></div><button class="gbtn sm" id="pIn">로그인 / 가입</button>`}</div></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
  document.querySelectorAll('[data-ava]').forEach(b => b.onclick = () => { ava = b.dataset.ava; document.querySelectorAll('[data-ava]').forEach(x => x.classList.toggle('on', x === b)); document.getElementById('pAva').textContent = ava; });
  document.getElementById('pCopy').onclick = async e => { try { await navigator.clipboard.writeText(me.code); e.target.textContent = '✔ 복사됨'; } catch (x) { prompt('내 친구 코드', me.code); } };
  const po = document.getElementById('pOut'), pi = document.getElementById('pIn');
  if (po) po.onclick = () => { if (!po.dataset.sure) { po.dataset.sure = '1'; po.textContent = '정말 로그아웃'; return; } BLIP.logout(); FR.list = []; FR.reqs = []; FR.invs = []; showMe(); render(); pollFriends(); openProfile(); };
  if (pi) pi.onclick = () => openLogin('login');
  document.getElementById('pSave').onclick = () => { BLIP.setProfile(document.getElementById('pNick').value, ava); showMe(); const m = document.getElementById('pMsg'); m.className = 'msg ok'; m.textContent = '저장했어요!'; render(); };
}
function openLogin(tab) {
  const isUp = tab === 'signup';
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet" style="max-width:440px;margin:0 auto">
    <h3>${isUp ? '회원가입' : '로그인'}</h3>
    <div class="tabs" style="padding:0;margin-bottom:6px"><button class="tab ${isUp ? '' : 'on'}" id="tLogin">로그인</button><button class="tab ${isUp ? 'on' : ''}" id="tUp">회원가입</button></div>
    <p style="color:var(--sub);font-size:14px;margin:10px 0 0">냥냥 점프 계정과 같아요. 이미 냥냥 점프 아이디가 있으면 그대로 로그인하세요.</p>
    <form id="accForm" autocomplete="on">
      <div class="field"><label for="aId">아이디</label><input id="aId" name="username" autocomplete="username" autocapitalize="off" maxlength="12" placeholder="영어 소문자·숫자 4~12자"></div>
      <div class="field"><label for="aPw">비밀번호</label><input id="aPw" name="password" type="password" autocomplete="${isUp ? 'new-password' : 'current-password'}" placeholder="4자 이상"></div>
      ${isUp ? `<div class="field"><label for="aNick">닉네임</label><input id="aNick" maxlength="12" value="${esc(/^플레이어/.test(BLIP.me.nick) ? '' : BLIP.me.nick)}" placeholder="친구들에게 보이는 이름"><small>지금 기기의 친구 코드 ${BLIP.me.code}와 친구 목록이 이 계정으로 옮겨져요.</small></div>` : ''}
      <div class="addrow" style="margin-top:16px"><button class="gbtn" type="submit" id="aGo" style="flex:1">${isUp ? '가입하고 로그인' : '로그인'}</button></div>
      <div class="msg" id="aMsg"></div>
    </form></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
  document.getElementById('tLogin').onclick = () => openLogin('login');
  document.getElementById('tUp').onclick = () => openLogin('signup');
  setTimeout(() => { const i = document.getElementById('aId'); if (i) i.focus(); }, 50);
  document.getElementById('accForm').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('aGo'), msg = document.getElementById('aMsg');
    btn.disabled = true; msg.className = 'msg'; msg.textContent = isUp ? '가입하는 중…' : '로그인하는 중…';
    try {
      const id = document.getElementById('aId').value, pw = document.getElementById('aPw').value;
      if (isUp) await BLIP.signup(id, pw, document.getElementById('aNick').value); else await BLIP.login(id, pw);
      msg.className = 'msg ok'; msg.textContent = '환영해요, ' + BLIP.me.nick + '님!';
      FR.list = []; FR.reqs = []; FR.invs = []; showMe(); render(); pollFriends();
      setTimeout(closeDetail, 700);
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message || '다시 시도해 주세요'; btn.disabled = false; }
  };
}
function showMe() { document.getElementById('meAva').textContent = BLIP.me.ava; document.getElementById('meNick').textContent = BLIP.me.nick; document.getElementById('loginBtn').hidden = !!BLIP.me.acc; }
BLIP._onAccount = () => { showMe(); render(); pollFriends(); };
async function friendAction(t) {
  const d = t.dataset;
  try {
    if (d.friend) { const f = FR.list.find(x => x.code === d.friend); if (!f) return; view = 'friends'; render(); return; }
    if (d.follow) { BLIP.go(d.game, d.follow); return; }
    if (d.invfriend) { const f = FR.list.find(x => x.code === d.invfriend); openFriendInvite(f); return; }
    if (d.invpick) { openInvitePicker(d.invpick); return; }
    if (d.invsend) { t.disabled = true; t.textContent = '보내는 중…'; await BLIP.invite(d.invsend, d.game); t.textContent = '✔ 보냈어요'; return; }
    if (d.unfriend) {
      if (t.dataset.sure) { await BLIP.removeFriend(d.unfriend); FR.list = FR.list.filter(f => f.code !== d.unfriend); renderFriendParts(); }
      else { t.dataset.sure = '1'; t.textContent = '정말 삭제'; setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = '삭제'; } }, 3000); }
      return;
    }
    if (d.accept) { t.disabled = true; await BLIP.accept(d.accept); FR.reqs = FR.reqs.filter(r => r.code !== d.accept); popSeen['r' + d.accept] = 1; pollFriends(); return; }
    if (d.decline) { await BLIP.decline(d.decline); FR.reqs = FR.reqs.filter(r => r.code !== d.decline); renderFriendParts(); return; }
    if (d.later) { popSeen['r' + d.later] = 1; renderPop(); return; }
    if (d.invgo) { await BLIP.clearInvite(d.invgo); BLIP.go(d.game, d.invgo); return; }
    if (d.invno) { await BLIP.clearInvite(d.invno); FR.invs = FR.invs.filter(v => v.code !== d.invno); renderPop(); return; }
  } catch (e) { t.disabled = false; t.textContent = '다시 시도'; }
}
function openFriendInvite(f) {
  if (!f) return;
  document.getElementById('det').innerHTML = `<button class="x" id="dx" title="닫기">✕</button><div class="sheet"><h3>${f.ava} ${esc(f.nick)}님을 초대할 게임</h3><div class="flist">${GAMES.map(g => `<div class="fitem"><span class="av" style="background:#000 url(${g.sq}) center/cover"></span><div class="tx"><b>${g.icon} ${esc(g.name)}</b><small>${esc(g.genre)}</small></div><div class="fbtns"><button class="gbtn sm blue" data-invsend="${f.code}" data-game="${g.id}">초대 보내기</button></div></div>`).join('')}</div></div>`;
  document.getElementById('ov').classList.add('show'); document.getElementById('dx').onclick = closeDetail;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-friend],[data-follow],[data-invfriend],[data-invpick],[data-invsend],[data-unfriend],[data-accept],[data-decline],[data-later],[data-invgo],[data-invno]');
  if (t) { e.stopPropagation(); friendAction(t); }
}, true);
document.getElementById('meBtn').onclick = openProfile;
document.getElementById('loginBtn').onclick = () => openLogin('login');

/* ===================== 클릭 / 입력 ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-play],[data-v],[data-g]');
  if (!t) { if (e.target.id === 'ov') closeDetail(); return; }
  if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.dataset.play) play(t.dataset.play);
  else if (t.dataset.v) { view = t.dataset.v; query = ''; genre = '전체'; document.getElementById('q').value = ''; render(); window.scrollTo(0, 0); }
  else if (t.dataset.g) { genre = t.dataset.g; render(); }
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
function applyTheme() { document.documentElement.classList.toggle('dark', !!ME.dark); document.getElementById('theme').textContent = ME.dark ? '☀️' : '🌙'; }
document.getElementById('theme').onclick = () => { ME.dark = !ME.dark; saveMe(); applyTheme(); };

applyTheme(); showMe(); render(); loadCatJump(); pollFriends(); setInterval(pollFriends, 6000);
</script>
</body>
</html>
