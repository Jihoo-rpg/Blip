<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0620">
<title>웨이브 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--a:#00e5ff;--b:#ff2bd6;--ink:#f4f7ff;--bg:#0b0620}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Black Han Sans',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));z-index:5}
  .scr.on{display:flex}
  .shade{background:rgba(6,3,20,.62);backdrop-filter:blur(3px)}
  h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(40px,9vw,86px);margin:0;letter-spacing:2px;line-height:1;text-align:center;
     background:linear-gradient(90deg,var(--a),#fff 45%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,229,255,.55))}
  .sub{opacity:.8;font-size:15px;text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:inherit;font-size:20px;color:#fff;border:0;border-radius:16px;padding:14px 26px;cursor:pointer;background:linear-gradient(135deg,#2a1d66,#16103a);box-shadow:0 0 0 2px rgba(255,255,255,.18) inset,0 6px 0 #07041a;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 2px rgba(255,255,255,.18) inset,0 3px 0 #07041a}
  .btn.go{background:linear-gradient(135deg,#00c6ff,#7b2bff);font-size:24px;padding:16px 40px}
  .btn.pink{background:linear-gradient(135deg,#ff2bd6,#7b2bff)}
  .btn.sm{font-size:15px;padding:9px 16px;border-radius:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(980px,100%);max-height:62vh;overflow:auto;padding:4px}
  .lv{position:relative;border-radius:16px;padding:12px 12px 10px;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:0 0 0 2px rgba(255,255,255,.12) inset;min-height:112px;display:flex;flex-direction:column;gap:4px}
  .lv:hover{box-shadow:0 0 0 2px var(--a) inset}
  .lv .n{font-size:13px;opacity:.7}.lv .t{font-size:19px}.lv .d{font-size:13px;font-weight:700}
  .lv .face{position:absolute;right:10px;top:8px;font-size:30px}
  .lv .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:auto}.lv .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
  .lv .pc{font-size:12px;opacity:.8;font-family:Orbitron,sans-serif}
  .lv.done{box-shadow:0 0 0 2px #7dff8a inset}.lv.lock{opacity:.35;pointer-events:none}
  .tog{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.08)}
  .tog b{width:42px;height:24px;border-radius:12px;background:#444;position:relative;transition:.2s}.tog b:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .tog.on b{background:#3ddc84}.tog.on b:after{left:21px}
  .cols{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cols div{width:34px;height:34px;border-radius:10px;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.15) inset}.cols div.on{box-shadow:0 0 0 3px #fff inset,0 0 14px currentColor}
  .big{font-family:Orbitron,sans-serif;font-size:clamp(34px,7vw,64px);font-weight:900}
  .hint{font-size:14px;opacity:.75;text-align:center}
  #hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));z-index:4;pointer-events:none}
  #hud.on{display:flex}
  #prog{flex:1;height:12px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden;max-width:520px;margin:0 auto}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
  #pct{font-family:Orbitron,sans-serif;font-size:16px;min-width:64px;text-align:right}
  #att{font-size:14px;opacity:.8;min-width:80px}
  #pauseB{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
  #prac{position:fixed;right:14px;top:56px;z-index:4;font-size:14px;color:#7dff8a;display:none}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:Orbitron,'Black Han Sans',sans-serif;font-size:clamp(20px,4vw,34px);z-index:6;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 0 14px rgba(0,229,255,.9);white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"><span id="att">시도 1</span><div id="prog"><i></i></div><span id="pct">0%</span><button id="pauseB">❚❚</button></div>
<div id="prac">◆ 연습 모드</div>
<div id="toast"></div>

<div id="menu" class="scr on">
  <h1>WAVE DASH</h1>
  <div class="sub">누르고 있으면 ↗ 위로 · 떼면 ↘ 아래로. 벽에 닿으면 끝!</div>
  <div class="row"><button class="btn go" id="bLevels">▶ 레벨</button><button class="btn pink" id="bEndless">∞ 무한 모드</button></div>
  <div class="cols" id="cols"></div>
  <div class="hint" id="mBest"></div>
</div>

<div id="sel" class="scr shade">
  <div class="row" style="align-items:center"><button class="btn sm" id="selBack">← 뒤로</button><div class="big" style="font-size:28px">레벨 선택</div><div class="tog" id="pracTog"><b></b>연습 모드</div></div>
  <div class="grid" id="grid"></div>
  <div class="hint">연습 모드: 죽으면 마지막 체크포인트(◆)에서 다시 시작해요</div>
</div>

<div id="pause" class="scr shade">
  <div class="big">일시정지</div>
  <div class="row"><button class="btn go" id="pRes">계속</button><button class="btn" id="pRe">처음부터</button><button class="btn" id="pQuit">나가기</button></div>
</div>

<div id="win" class="scr shade">
  <div class="big" id="wT">레벨 완료!</div>
  <div class="sub" id="wS"></div>
  <div class="row"><button class="btn go" id="wNext">다음 레벨 ▶</button><button class="btn" id="wRe">다시</button><button class="btn" id="wQuit">레벨 선택</button></div>
</div>

<div id="over" class="scr shade">
  <div class="big" id="oT">0 m</div>
  <div class="sub" id="oS"></div>
  <div class="row"><button class="btn go" id="oRe">다시 ▶</button><button class="btn" id="oQuit">메뉴</button></div>
</div>

<script>
'use strict';
/* ================= 웨이브 대시 =================
   웨이브만 있는 리듬 게임. 누르면 ↗, 떼면 ↘ (일반 45°, 미니 63°).
   공정성: 레벨마다 '정답 길(지그재그 선)'을 먼저 만들고, 벽은 그 길에서 위아래로 떨어진 곳에 세워요.
   → 길을 따라가면 무조건 살 수 있고, 통로 여유는 사람이 맞출 수 있는 시간(최소 0.06초)보다 크게 잡아요. */
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
const STEP = 1 / 240;
const store = { get(k, d) { try { const v = localStorage.getItem('wd_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('wd_' + k, JSON.stringify(v)); } catch (e) { } } };

// ---------- 레벨 ----------
// v: 속도(칸/초) · gap: 통로 폭 · seg: 꺾는 간격(초) · T: 사람이 틀려도 되는 시간(초) · mini/open/spam/speed: 구간 확률
const LEVELS = [
  { n: '잔물결', d: 'Easy', f: '😊', h: 190, v: 8.6, gap: [4.0, 3.5], seg: [0.5, 0.95], T: 0.16, mini: 0, open: 0.15, spam: 0, speed: 0, len: 34, bpm: 120 },
  { n: '지그재그', d: 'Easy', f: '😊', h: 160, v: 9.2, gap: [3.7, 3.2], seg: [0.42, 0.85], T: 0.15, mini: 0, open: 0.2, spam: 0.05, speed: 0, len: 40, bpm: 124 },
  { n: '톱날 정원', d: 'Normal', f: '🙂', h: 120, v: 9.6, gap: [3.4, 2.9], seg: [0.38, 0.8], T: 0.13, mini: 0.1, open: 0.35, spam: 0.1, speed: 0, len: 46, bpm: 128 },
  { n: '밀물', d: 'Normal', f: '🙂', h: 210, v: 10, gap: [3.2, 2.7], seg: [0.34, 0.75], T: 0.12, mini: 0.2, open: 0.25, spam: 0.15, speed: 0.1, len: 50, bpm: 130 },
  { n: '펄스', d: 'Hard', f: '😠', h: 280, v: 10.6, gap: [3.0, 2.45], seg: [0.3, 0.68], T: 0.11, mini: 0.22, open: 0.25, spam: 0.25, speed: 0.15, len: 54, bpm: 134 },
  { n: '오버플로', d: 'Hard', f: '😠', h: 330, v: 11, gap: [2.85, 2.3], seg: [0.28, 0.64], T: 0.1, mini: 0.3, open: 0.2, spam: 0.28, speed: 0.15, len: 58, bpm: 136 },
  { n: '가시비', d: 'Harder', f: '😡', h: 0, v: 11.6, gap: [2.7, 2.15], seg: [0.26, 0.6], T: 0.09, mini: 0.3, open: 0.3, spam: 0.32, speed: 0.2, len: 60, bpm: 140 },
  { n: '스태틱', d: 'Harder', f: '😡', h: 40, v: 12, gap: [2.55, 2.05], seg: [0.24, 0.56], T: 0.085, mini: 0.35, open: 0.25, spam: 0.36, speed: 0.25, len: 64, bpm: 142 },
  { n: '글리치', d: 'Insane', f: '😈', h: 300, v: 12.6, gap: [2.4, 1.92], seg: [0.22, 0.52], T: 0.075, mini: 0.4, open: 0.25, spam: 0.4, speed: 0.3, len: 66, bpm: 146 },
  { n: '하이퍼', d: 'Insane', f: '😈', h: 260, v: 13.2, gap: [2.3, 1.82], seg: [0.2, 0.48], T: 0.07, mini: 0.42, open: 0.2, spam: 0.45, speed: 0.3, len: 70, bpm: 150 },
  { n: '블랙홀', d: 'Demon', f: '👿', h: 275, v: 13.8, gap: [2.15, 1.72], seg: [0.19, 0.45], T: 0.065, mini: 0.45, open: 0.22, spam: 0.5, speed: 0.35, len: 72, bpm: 154 },
  { n: '웨이브의 신', d: 'Demon', f: '💀', h: 350, v: 14.6, gap: [2.05, 1.65], seg: [0.18, 0.42], T: 0.06, mini: 0.5, open: 0.2, spam: 0.55, speed: 0.4, len: 78, bpm: 160 },
];
const DCOL = { Easy: '#5cf07a', Normal: '#4fc3ff', Hard: '#ffb43c', Harder: '#ff6a3c', Insane: '#ff3cc8', Demon: '#ff2b4a' };
const R0 = 0.2;            // 웨이브 판정 반지름 (미니는 0.13)
const R_MINI = 0.13;
const TOP = 10;            // 통로가 움직이는 범위 0~10

// ---------- 난수 ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 맵 만들기 ----------
   P: 꼭짓점 [{x, y, g}] (y = 정답 길 높이, g = 통로 폭)  · 꼭짓점 사이 기울기는 ±k (k = 1 일반 · 2 미니)
   Z: 구간 [{x, k, v}] (미니·속도 바뀌는 곳 = 포털) · S: 톱날 [{x, y, r}] · CP: 체크포인트 x 목록 */
function Gen(def, seed, endless) {
  const R = rng(seed); const rr = (a, b) => a + R() * (b - a);
  const M = { P: [{ x: -40, y: 5, g: 7 }, { x: -6, y: 5, g: 7 }], Z: [{ x: -1e9, k: 1, v: def.v, mini: false }], S: [], CP: [], end: Infinity, def };
  let x = -6, y = 5, dir = 1, k = 1, v = def.v, mini = false;
  const lenX = endless ? Infinity : def.len * def.v; let sec = 0;
  // 난이도 진행 (0 → 1): 레벨 안에서 통로가 조금씩 좁아져요
  const prog = () => Math.max(0, endless ? Math.min(1, x / 2600) : Math.min(1, x / lenX));
  const D = () => { if (!endless) return def; const p = prog(); const a = LEVELS[Math.min(LEVELS.length - 1, Math.floor(p * 9))], b = LEVELS[Math.min(LEVELS.length - 1, Math.floor(p * 9) + 1)]; const t = p * 9 % 1; const L = (u, w) => u + (w - u) * t; return { v: L(a.v, b.v), gap: [L(a.gap[0], b.gap[0]), L(a.gap[1], b.gap[1])], seg: [L(a.seg[0], b.seg[0]), L(a.seg[1], b.seg[1])], T: L(a.T, b.T), mini: L(a.mini, b.mini), open: 0.25, spam: L(a.spam, b.spam), speed: L(a.speed, b.speed) * 0.6 }; };
  function gapNow(d, extra) { const p = prog(); let g = d.gap[0] + (d.gap[1] - d.gap[0]) * p; if (mini) g *= 0.82; const r = mini ? R_MINI : R0; const need = 2 * r + 2 * v * k * d.T + 0.25; return Math.max(g, need) + (extra || 0); }
  let curC = 0; function pushV(nx, ny, g) { M.P.push({ x: nx, y: ny, g, c: curC }); x = nx; y = ny; }
  function seg(d, tMin, tMax, g, flipOK = true) {
    curC = v * d.T * 0.6; let t = rr(tMin, tMax); t = Math.max(t, d.T * 2.6); let dx = v * t; const lo = g / 2 + 0.35, hi = TOP - g / 2 - 0.35;
    // 위아래 끝에 닿으면 그만큼만 가요. 남은 거리가 너무 짧으면(사람이 못 꺾을 만큼) 방향을 바꿔요
    const minDx = v * d.T * 2.6; const room = dd => dd > 0 ? (hi - y) / k : (y - lo) / k;
    if (y > hi) dir = -1; else if (y < lo) dir = 1;
    else if (room(dir) < minDx) dir = -dir;
    const rm = room(dir); if (rm > 0) dx = Math.min(dx, Math.max(minDx, rm));
    pushV(x + dx, y + dir * k * dx, g); if (flipOK) dir = -dir;
  }
  function zone(nk, nv, nmini) { if (nk === k && nv === v && nmini === mini) return; k = nk; v = nv; mini = nmini; M.Z.push({ x, k, v, mini }); }
  // 시작: 넓고 완만한 구간
  for (let i = 0; i < 3; i++) seg(D(), 0.55, 0.8, 5.2 - i * 0.4);
  M.CP.push(x);
  function section() {
    const d = D(); sec++; const r = R();
    // 포털: 미니 / 속도
    const wantMini = R() < d.mini, wantSpeed = R() < d.speed;
    const nv = wantSpeed ? d.v * (R() < 0.5 ? 1.22 : 0.86) : d.v;
    zone(wantMini ? 2 : 1, nv, wantMini);
    const g = gapNow(d);
    if (r < d.open) { // 넓은 곳 + 톱날 (길에서 충분히 떨어진 곳에만)
      const g2 = Math.min(6, g + 2.2); const x0 = x; const n = 3 + Math.floor(R() * 3);
      for (let i = 0; i < n; i++) seg(d, d.seg[0] * 1.1, d.seg[1] * 1.2, g2);
      const x1 = x; const tries = 30; let placed = 0;
      for (let t = 0; t < tries && placed < n; t++) {
        const sx = rr(x0 + 1.5, x1 - 1.5), sr = rr(0.45, 0.8); const py = pathY(sx), pg = gapAtX(sx); const sy = py + (R() < 0.5 ? 1 : -1) * rr(0.9, pg / 2);
        if (sy - sr < py - pg / 2 + 0.1 && sy + sr > py + pg / 2 - 0.1) continue;
        // 정답 길과의 거리: 반지름 + 웨이브 + 여유
        if (distToPath(sx, sy) < sr + (mini ? R_MINI : R0) + v * k * d.T + 0.35) continue;
        if (M.S.some(s => Math.hypot(s.x - sx, s.y - sy) < s.r + sr + 0.6)) continue;
        M.S.push({ x: sx, y: sy, r: sr }); placed++;
      }
    } else if (r < d.open + d.spam) { // 빠른 지그재그 연타 (짧게 꺾기)
      const n = 4 + Math.floor(R() * 5); const ts = Math.max(d.T * 2.6, d.seg[0] * 0.6);
      for (let i = 0; i < n; i++) seg(d, ts, ts * 1.25, g);
    } else { // 기본 통로
      const n = 4 + Math.floor(R() * 4);
      for (let i = 0; i < n; i++) seg(d, d.seg[0], d.seg[1], g);
    }
    M.CP.push(x);
  }
  // 정답 길 높이 / 통로 폭 (만드는 중에도 씀)
  function idxAt(px) { const P = M.P; let lo = 0, hi = P.length - 1; if (px >= P[hi].x) return hi - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].x <= px) lo = m; else hi = m; } return lo; }
  function pathY(px) { const P = M.P, i = idxAt(px), a = P[i], b = P[i + 1]; if (!b) return a.y; const t = (px - a.x) / (b.x - a.x || 1); return a.y + (b.y - a.y) * Math.max(0, Math.min(1, t)); }
  function gapAtX(px) { const P = M.P, i = idxAt(px), a = P[i], b = P[i + 1] || P[i]; if (b.g >= a.g || b === a) return b.g; const t = Math.max(0, Math.min(1, (px - a.x) / (b.x - a.x || 1))); return a.g + (b.g - a.g) * t; } // 좁아질 땐 한 구간에 걸쳐 천천히 (항상 목표보다 넓어서 안전)
  function distToPath(px, py) { let best = 1e9; const i0 = idxAt(px - 4), i1 = idxAt(px + 4) + 1; for (let i = Math.max(0, i0); i < Math.min(M.P.length - 1, i1 + 1); i++) { const a = M.P[i], b = M.P[i + 1]; const vx = b.x - a.x, vy = b.y - a.y; const t = Math.max(0, Math.min(1, ((px - a.x) * vx + (py - a.y) * vy) / (vx * vx + vy * vy || 1))); best = Math.min(best, Math.hypot(a.x + vx * t - px, a.y + vy * t - py)); } return best; }
  // 벽: 꼭짓점(꺾이는 곳)에서 앞뒤 c만큼 평평하게 넓혀요 → 조금 일찍/늦게 꺾어도 안 죽어요
  function band(px) { const P = M.P, i = idxAt(px), c = (P[i + 1] || P[i]).c || 0; let mx = pathY(px), mn = mx;
    if (c > 0) { for (const q of [pathY(px - c), pathY(px + c)]) { if (q > mx) mx = q; if (q < mn) mn = q; } for (let j = Math.max(0, i - 2); j < Math.min(P.length, i + 4); j++) if (P[j].x >= px - c && P[j].x <= px + c) { if (P[j].y > mx) mx = P[j].y; if (P[j].y < mn) mn = P[j].y; } }
    const g = gapAtX(px); return [mn - g / 2, mx + g / 2]; }
  M.pathY = pathY; M.gapAt = gapAtX; M.idxAt = idxAt; M.band = band;
  M.extend = until => { while (x < until && x < lenX) section(); if (!endless && x >= lenX && M.end === Infinity) { zone(1, def.v, false); for (let i = 0; i < 3; i++) seg(def, 0.5, 0.7, 5.5); M.end = x; for (let i = 0; i < 4; i++) seg(def, 0.6, 0.8, 7); } };
  M.extend(endless ? 400 : Infinity);
  return M;
}

// ---------- 화면 ----------
let W = 0, H = 0, DPR = 1, U = 40;

// ---------- 물리 (1/240초 고정) ----------

// ---------- 입력 ----------

addEventListener('pointerdown', e => { if (isUI(e)) return; held = true; Music.unlock(); if (mode === 'play' && s && s.dead && deadT > 0.25) { } });

// ---------- 루프 ----------
let last = performance.now(), T0 = 0;

// ---------- 화면 전환 ----------

function goMenu() { Music.stop(); mode = 'menu'; $('hud').classList.remove('on'); $('prac').style.display = 'none'; trail = []; demo = null; show('menu'); drawMenu(); }
function goSel() { Music.stop(); mode = 'sel'; $('hud').classList.remove('on'); $('prac').style.display = 'none'; show('sel'); drawSel(); }
function pauseGame() { if (mode !== 'play') return; mode = 'pause'; Music.stop(); held = false; show('pause'); }
function resume() { mode = 'play'; show(null); acc = 0; last = performance.now(); Music.resume(); }
function overScreen() { mode = 'over'; Music.stop(); $('hud').classList.remove('on'); const m = Math.floor(Math.max(0, s.x)); $('oT').textContent = m + ' m'; $('oS').textContent = `최고 기록 ${bestEnd} m · 멀리 갈수록 빨라지고 좁아져요`; show('over'); }
function drawMenu() {
  const C = $('cols'); C.innerHTML = ''; COLS.forEach((c, i) => { const d = document.createElement('div'); d.style.background = c; d.style.color = c; if (i === col) d.className = 'on'; d.onclick = () => { col = i; store.set('col', col); drawMenu(); }; C.appendChild(d); });
  const done = LEVELS.filter((_, i) => prog[i] && prog[i].done).length; $('mBest').textContent = `레벨 ${done}/${LEVELS.length} 클리어 · 무한 모드 최고 ${bestEnd} m`;
}
function drawSel() {
  const G = $('grid'); G.innerHTML = '';
  LEVELS.forEach((d, i) => { const p = prog[i] || {}; const lock = false; // 지오메트리 대쉬처럼 처음부터 전부 열려 있어요
    const e = document.createElement('div'); e.className = 'lv' + (p.done ? ' done' : '') + (lock ? ' lock' : '');
    e.innerHTML = `<span class="face">${lock ? '🔒' : d.f}</span><span class="n">${i + 1}단계</span><span class="t">${d.n}</span><span class="d" style="color:${DCOL[d.d]}">${d.d}</span><div class="bar"><i style="width:${p.best || 0}%"></i></div><span class="pc">${p.done ? '✔ 완료' : (p.best || 0) + '%'}${p.pdone && !p.done ? ' · 연습 완료' : ''}</span>`;
    e.onclick = () => { Music.unlock(); startLevel(i); }; G.appendChild(e); });
  $('pracTog').classList.toggle('on', practice);
}
const click = (id, f) => $(id).addEventListener('click', e => { e.stopPropagation(); Music.unlock(); f(); });
click('bLevels', goSel); click('bEndless', startEndless); click('selBack', goMenu);
click('pracTog', () => { practice = !practice; drawSel(); });
click('pauseB', pauseGame); click('pRes', resume); click('pRe', () => { show(null); mode = 'play'; att++; newRun(false); }); click('pQuit', () => endless ? goMenu() : goSel());
click('wNext', () => startLevel(LV + 1)); click('wRe', () => startLevel(LV)); click('wQuit', goSel);
click('oRe', startEndless); click('oQuit', goMenu);
drawMenu();
// 테스트용
window.__WD = { LEVELS, Gen, get s() { return s; }, get map() { return map; }, step, startLevel, setHeld: v => held = v, get mode() { return mode; } };
</script>
